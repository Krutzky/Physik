<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Strom-Spur</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lexend:wght@500;600;700&display=swap">
<style>
/* Layout wie „Linsen-Labor“: Kopfleiste mit Stationen-Weg · links optische Bank + Dia- und Schirm-Ansicht mit Lineal (fest) · rechts Steuerpult + Stationsaufgabe. */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface-2:#F3F5FA; --ink:#0B1442; --ink-soft:#4E5677; --line:#CBD3E1;
  --navy:#020C45; --navy-ink:#FFFFFF; --accent:#E8892B; --accent-ink:#1B1300; --blue:#1C66C0; --blue-soft:#DCE8F7; --on-blue:#FFFFFF;
  --ok:#22865A; --ok-soft:#DDF2E7; --bad:#C8423D; --bad-soft:#F9E1DF; --pro:#6B3FB0; --pro-soft:#ECE4F8;
  --grid:#E3E8F0; --axis:#4A5068; --rail:#5B6278; --lens:#9CC3F0; --lens-edge:#3A6AA8; --ray1:#E8892B; --ray2:#1C66C0; --red:#E8432E;
  --room:#14161D; --display:#111111; --display-ink:#FFC94D;
  --f-display:"Lexend","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",Calibri,system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#060B26; --surface:#0E1640; --surface-2:#141D4F; --ink:#EEF1FA; --ink-soft:#A9B1D3; --line:#2B3672;
  --navy:#020722; --navy-ink:#FFFFFF; --accent:#F3A04F; --accent-ink:#1B1300; --blue:#6FA8F0; --blue-soft:#1A2A63; --on-blue:#06102E;
  --ok:#4CC48A; --ok-soft:#123A2C; --bad:#F07A73; --bad-soft:#40181C; --pro:#B89AF0; --pro-soft:#2A1E52;
  --grid:#1E2858; --axis:#AEB6D8; --rail:#8792C2; --lens:#3D6FB0; --lens-edge:#9CC3F0; --ray1:#F3A04F; --ray2:#6FA8F0; --red:#F2604D;
  --room:#05060A; --display:#000000; --display-ink:#FFC94D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060B26; --surface:#0E1640; --surface-2:#141D4F; --ink:#EEF1FA; --ink-soft:#A9B1D3; --line:#2B3672;
  --navy:#020722; --navy-ink:#FFFFFF; --accent:#F3A04F; --accent-ink:#1B1300; --blue:#6FA8F0; --blue-soft:#1A2A63; --on-blue:#06102E;
  --ok:#4CC48A; --ok-soft:#123A2C; --bad:#F07A73; --bad-soft:#40181C; --pro:#B89AF0; --pro-soft:#2A1E52;
  --grid:#1E2858; --axis:#AEB6D8; --rail:#8792C2; --lens:#3D6FB0; --lens-edge:#9CC3F0; --ray1:#F3A04F; --ray2:#6FA8F0; --red:#F2604D;
  --room:#05060A; --display:#000000; --display-ink:#FFC94D; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

header{background:var(--navy);color:var(--navy-ink);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hwrap{max-width:1360px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;flex-direction:column}
.brand b{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.2px}
.brand span{font-size:13px;color:#8DB7EE}
.route{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.stop{display:flex;align-items:center;gap:8px;border:2px solid #34428F;background:transparent;color:#fff;border-radius:999px;padding:5px 12px 5px 6px;font-size:14px;font-weight:700}
.stop .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#24317A;font-size:13px}
.stop.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stop.on .n{background:rgba(0,0,0,.18);color:var(--accent-ink)}
.stop.done .n{background:var(--ok);color:#fff}
.stop.pro{border-style:dashed;border-color:#8E74D6}
.stop.pro.on{background:#B89AF0;border-color:#B89AF0;color:#1A0F33;border-style:solid}
.stop:disabled{opacity:.45;cursor:not-allowed}
.reset{background:transparent;border:1.5px solid #34428F;color:#B9C6EE;border-radius:999px;padding:5px 10px;font-size:13px}

main{max-width:1360px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.plot{position:sticky;top:env(safe-area-inset-top,0px);padding:10px;display:flex;flex-direction:column;gap:10px}
@media (max-width:900px){.plot{position:static}}
canvas{display:block;width:100%;border-radius:10px;touch-action:none}
.views{display:grid;grid-template-columns:repeat(2,minmax(0,250px));justify-content:center;gap:14px}
.view{display:flex;flex-direction:column;gap:4px;min-width:0}
.view canvas{aspect-ratio:1/1;max-width:100%;background:var(--room)}
.view small{font-size:13px;color:var(--ink-soft);text-align:center}
.view small b{color:var(--ink)}

.side{display:flex;flex-direction:column;gap:16px;min-width:0}
h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0 0 4px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0}
.eyebrow{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--blue);font-weight:700;margin:0 0 2px}
.eyebrow.pro{color:var(--pro)}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--ink-soft);font-size:15px}

/* Steuerpult */
.ctl{display:flex;flex-direction:column;gap:6px}
.lift{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:stretch}
.disp{background:var(--display);color:var(--display-ink);font-family:var(--f-mono);border-radius:12px;padding:6px 10px;text-align:center;box-shadow:inset 0 0 0 3px #333;display:flex;flex-direction:column;justify-content:center}
.disp small{font-size:11px;letter-spacing:2px;color:#9a9a9a}
.disp span{font-size:28px;letter-spacing:1px;font-variant-numeric:tabular-nums}
.disp.g{color:#9FD0FF}
.keys{display:flex;gap:8px;align-items:center}
.key{width:56px;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);font-size:22px;font-weight:700}
.key:active{background:var(--accent);color:var(--accent-ink)}
input[type=range]{width:100%;accent-color:var(--accent);height:30px}
input[type=range].gr{accent-color:var(--blue)}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.locked{font-size:15px;color:var(--ink-soft);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.chk{display:flex;align-items:center;gap:10px;font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--blue)}
.sep{border:0;border-top:1.5px dashed var(--line);margin:8px 0}

.num{width:4.6em;text-align:center;border:2px solid var(--line);border-radius:8px;padding:5px 2px;background:var(--surface);font-variant-numeric:tabular-nums}
.num.ok{border-color:var(--ok);background:var(--ok-soft)}
.num.bad{border-color:var(--bad);background:var(--bad-soft)}
.sel{font:inherit;border:2px solid var(--line);border-radius:8px;padding:4px 4px;background:var(--surface);max-width:100%}
.sel.ok{border-color:var(--ok);background:var(--ok-soft)}
.sel.bad{border-color:var(--bad);background:var(--bad-soft)}
.btn{border:none;border-radius:999px;padding:10px 18px;font-weight:700;font-size:16px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--surface);border:1.5px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn.tip{background:transparent;border:1.5px dashed var(--blue);color:var(--blue);padding:7px 14px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.choice{display:flex;flex-direction:column;gap:8px}
.choice.grid2{display:grid;grid-template-columns:1fr 1fr}
@media (max-width:440px){.choice.grid2{grid-template-columns:1fr}}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.opt b{font-family:var(--f-display)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.gopt{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center}
.gopt .L{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-family:var(--f-display);grid-row:1/3}
.gopt span{font-size:15px}
.seg{display:inline-flex;flex-wrap:wrap;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:7px 14px;font-weight:700}
.seg button.sel{background:var(--blue);color:var(--on-blue)}
.seg button.ok{background:var(--ok);color:#fff}
.seg button.bad{background:var(--bad);color:#fff}
.fb{font-weight:700;min-height:1.4em}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.note{border-left:4px solid var(--accent);background:var(--surface-2);padding:10px 12px;border-radius:0 10px 10px 0;font-size:15px}
.hint{border:1.5px dashed var(--blue);background:var(--blue-soft);border-radius:10px;padding:10px 12px;font-size:15px}
.win{border:2px solid var(--ok);background:var(--ok-soft);border-radius:12px;padding:12px}
.guess{border:2px solid var(--pro);background:var(--pro-soft);border-radius:12px;padding:12px}
.q{display:flex;flex-direction:column;gap:6px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.q p b{font-family:var(--f-display);font-weight:600}
.gap ol{padding-left:1.2em;margin:0}
.gap li{margin-bottom:10px}
.dots{display:flex;gap:6px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:block}
.dots i.on{background:var(--ok);border-color:var(--ok)}
.merk{border:2px solid var(--blue);border-radius:12px;padding:14px;background:var(--surface)}
.merk h3{color:var(--blue);margin-bottom:6px}
.merk .k{color:var(--blue);font-weight:700}
textarea.free{width:100%;border:2px solid var(--line);border-radius:10px;padding:8px;background:var(--surface);color:var(--ink)}
.bz{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}
.badge{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-family:var(--f-display)}
.tw{overflow-x:auto}
table.mt{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:15.5px}
table.mt th,table.mt td{border:1.5px solid var(--line);padding:6px 6px;text-align:center}
table.mt th{background:var(--surface-2);font-weight:700}
table.mt th small{display:block;font-weight:400;color:var(--ink-soft);font-size:12px}
table.mt tr.cur td{background:var(--blue-soft)}
table.mt tr.done td{background:var(--ok-soft)}
table.mt tr.lock td{color:var(--ink-soft)}
table.mt td.v b{font-size:16px}
.chart{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--ink-soft);padding:0 6px 4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
.ctlrow{display:flex;flex-direction:column;gap:4px}
.ctlrow > span{font-size:13px;color:var(--ink-soft);font-weight:700;letter-spacing:.5px}
.seg.full{display:flex}
.seg.full button{flex:1}
.gopt{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center}
.gopt .L{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-family:var(--f-display)}
.gopt span{font-size:15px}
</style>
<style>
.overlay{position:fixed;inset:0;background:rgba(2,12,69,.6);overflow:auto;padding:24px max(16px,env(safe-area-inset-left,0px));z-index:20}
.overlay .card{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}

.view canvas{background:transparent}
#tCv{width:100%;display:block;border-radius:10px}
.opt:disabled{opacity:.6;cursor:not-allowed}
table.mt td input.num{width:4.2em}
table.mt tr{cursor:pointer}
.reset.t{border-color:#E8892B;color:#FFD9B0}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand"><b>Strom-Spur</b><span>Woher kommt unsere tägliche Energie?</span></div>
    <nav class="route" id="route" aria-label="Stationen"></nav>
    <button class="reset" id="reset" type="button">Neu starten</button>
  </div>
</header>
<main>
  <section class="card plot" aria-label="Modell">
    <canvas id="cv" aria-label="Modell"></canvas>
    <div class="views" id="views">
      <div class="view"><canvas id="cvA"></canvas><small id="capA"></small></div>
      <div class="view"><canvas id="cvB"></canvas><small id="capB"></small></div>
    </div>
  </section>
  <aside class="side">
    <section class="card" id="ctlCard"><p class="eyebrow">Steuerpult</p><div id="ctl" class="ctl"></div></section>
    <section class="card stack" id="task"></section>
  </aside>
</main>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var APP={title:'Strom-Spur',file:'Strom-Spur',klasse:'10'};
var KEY='strom-spur-v1',RKEY='strom-spur-resets';
var STATIONS=[
  {key:'s1',name:'Fit-Check',scene:'house'},
  {key:'s2',name:'Energiequellen',scene:'sources'},
  {key:'s3',name:'Kraftwerk',scene:'plant'},
  {key:'s4',name:'Strommix',scene:'mix'},
  {key:'s5',name:'Merksatz',scene:'house'},
  {key:'s6',name:'Profi-Zusatz',pro:true,scene:'plant'}
];
var st={station:0,done:[false,false,false,false,false,false],guess:null,labels:true,hints:false,ptype:'kohle',mixCol:'type',
  s1:{a:{},ok:false},
  s2:{sort:{},sortOk:false,gas:null,gasOk:false,bio:null,bioOk:false},
  s3:{chain:{},chainOk:false,gen:null,genOk:false,heat:null,heatOk:false,wind:null,windOk:false},
  s4:{top:null,topOk:false,fos:null,fosOk:false,grow:null,growOk:false,nuc:null,nucOk:false},
  s5:{gaps:{},ok:false,refl:'',reflOk:false},
  s6:{eta:'',etaOk:false,loss:'',lossOk:false},
  res:{},tries:{},help:{},t0:null};
function save(){try{localStorage.setItem(KEY,JSON.stringify({station:st.station,done:st.done,guess:st.guess,s1:st.s1,s2:st.s2,s3:st.s3,s4:st.s4,s5:st.s5,s6:st.s6,res:st.res,tries:st.tries,help:st.help,t0:st.t0}));}catch(e){}}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||'null');if(!x)return;
  ['station','guess','res','tries','help','t0'].forEach(function(k){if(x[k]!=null)st[k]=x[k];});
  if(x.done){st.done=x.done;while(st.done.length<6)st.done.push(false);}
  ['s1','s2','s3','s4','s5','s6'].forEach(function(k){if(x[k])st[k]=Object.assign(st[k],x[k]);});}catch(e){}}
/* ---------- gemeinsame Bausteine (wie Regenbogen-Labor) ---------- */
function tryInc(k,ok,val){var t=st.tries[k]||(st.tries[k]={n:0,ok:false,first:null});if(t.ok)return;t.n++;if(t.first===null)t.first=!!ok;if(ok)t.ok=true;else if(val!=null&&val!==''){t.w=t.w||[];if(t.w.length<12)t.w.push(val);}save();}
function stuck(k){var t=st.tries[k];return !!(t&&!t.ok&&t.n>=3);}
function showHelp(fb,k,fn){if(!fb||!stuck(k))return;var id='hb_'+k;if(document.getElementById(id))return;var b=document.createElement('button');b.type='button';b.id=id;b.className='btn tip';b.style.marginTop='6px';b.textContent='Ich komme nicht weiter: Lösung zeigen';
  b.addEventListener('click',function(){st.help[k]=true;save();fn();});var wrap=document.createElement('div');wrap.className='row';wrap.appendChild(b);(fb.parentNode.classList&&fb.parentNode.classList.contains('row')?fb.parentNode:fb).insertAdjacentElement('afterend',wrap);}
function helpMsg(id,t){var f=$(id);if(f){f.className='fb ok';f.textContent=t;}}
function fnv(str){var h=0x811c9dc5;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return ('0000000'+h.toString(16)).slice(-8);}
function resets(){try{return +(localStorage.getItem(RKEY)||0);}catch(e){return 0;}}
function fmt(v,d){var p=Math.pow(10,d||0);return String(Math.round(v*p)/p).replace('.',',');}
function num(s){if(s==null)return NaN;s=String(s).trim().replace(/\s/g,'').replace(',','.');if(s===''||!/^-?\d*\.?\d+$/.test(s))return NaN;return parseFloat(s);}
function col(n){return getComputedStyle(document.documentElement).getPropertyValue('--'+n).trim();}
function ff(){return getComputedStyle(document.body).fontFamily;}
function font(px,b){return (b?'bold ':'')+px+'px '+ff();}
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}

/* Steuerpult */
function segHTML(id,opts,cur){return '<span class="seg full" id="'+id+'">'+opts.map(function(o){return '<button type="button" data-v="'+o[0]+'" class="'+(String(o[0])===String(cur)?'sel':'')+'">'+o[1]+'</button>';}).join('')+'</span>';}
function bindSeg(id,fn){var el=$(id);if(!el)return;Array.prototype.forEach.call(el.children,function(b){b.addEventListener('click',function(){Array.prototype.forEach.call(el.children,function(x){x.className=x===b?'sel':'';});fn(b.dataset.v);});});}
function slider(id,lab,disp,min,max,step,val,lo,hi,cls){return '<div class="lift"><div class="disp'+(cls?' '+cls:'')+'"><small>'+lab+'</small><span id="disp'+id+'">'+disp+'</span></div><div class="keys"><button class="key" id="'+id+'m" type="button" aria-label="weniger">◀</button><button class="key" id="'+id+'p" type="button" aria-label="mehr">▶</button></div></div>'+
  '<input type="range" id="'+id+'S" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'" aria-label="'+lab+'"><div class="scale"><span>'+lo+'</span><span>'+hi+'</span></div>';}
function bindSlider(id,get,set,step,min,max){function u(v){v=Math.max(min,Math.min(max,v));set(v);$(id+'S').value=v;draw();}
  $(id+'S').addEventListener('input',function(){u(parseFloat(this.value));});$(id+'m').addEventListener('click',function(){u(get()-step);});$(id+'p').addEventListener('click',function(){u(get()+step);});}

/* Stationen-Weg */
function unlocked(i){return i===0||st.done[i-1];}
function renderRoute(){var h='';STATIONS.forEach(function(s,i){var cls='stop'+(s.pro?' pro':'')+(i===st.station?' on':'')+(st.done[i]?' done':'');
    h+='<button type="button" class="'+cls+'" data-i="'+i+'"'+(unlocked(i)?'':' disabled')+'><span class="n">'+(st.done[i]?'✓':(s.pro?'★':(i+1)))+'</span>'+s.name+'</button>';});
  $('route').innerHTML=h;Array.prototype.forEach.call($('route').querySelectorAll('.stop'),function(b){b.addEventListener('click',function(){go(+b.dataset.i);});});}
function go(i){if(!unlocked(i))return;st.station=i;save();render();window.scrollTo({top:0,behavior:'smooth'});}
function finish(i){if(!st.done[i]){st.done[i]=true;save();renderRoute();}}
function nextBtn(i){if(!st.done[i]||i>=STATIONS.length-1)return '';var n=STATIONS[i+1];return '<button class="btn pri" type="button" id="nextSt">'+(n.pro?'Zu den Profi-Aufgaben ★':'Weiter zu Station '+(i+2)+': '+n.name)+' →</button>';}
function bindNext(){var b=$('nextSt');if(b)b.addEventListener('click',function(){go(st.station+1);});}

/* Aufgabenbausteine */

    var wrong=CHAIN.filter(function(c){return s.chain[c.id]!==c.a;});tryInc('s3chain',!wrong.length,wrong.map(function(c){return c.id;}).join(','));
    CHAIN.forEach(function(c){var el=document.querySelector('[data-ch="'+c.id+'"]');el.className='sel '+(s.chain[c.id]===c.a?'ok':'bad');});
    if(!wrong.length){s.chainOk=true;save();r3();return;}fb.className='fb bad';fb.textContent=wrong[0].id==='c1'?'Was entsteht, wenn etwas verbrennt? Es wird heiß.':wrong[0].id==='c2'?'Die Turbine dreht sich. Welche Energie hat etwas, das sich bewegt?':'Was kommt am Ende aus der Steckdose?';
    showHelp(fb,'s3chain',function(){CHAIN.forEach(function(c){s.chain[c.id]=c.a;});s.chainOk=true;save();r3();});});
  if(s.chainOk)helpMsg('fb3c','Richtig! chemische → thermische → Bewegungsenergie → elektrische Energie.');
  if(s.chainOk)mcBind('gen',QGEN,s,'gen','s3gen',r3);if(s.genOk)mcBind('heat',QHEAT,s,'heat','s3heat',r3);if(s.heatOk)mcBind('wind',QWIND,s,'wind','s3wind',r3);
  bindNext();}

/* Station 4: Strommix */
var QTOP={q:'Welche Energiequelle lieferte 2025 den meisten Strom?',o:['Wind','Braunkohle','Solar','Erdgas'],a:0,ok:'Richtig! Wind lag 2025 klar vorne, Solar auf Platz 2.',bad:['','Braunkohle ist die größte fossile Quelle, aber nicht die größte insgesamt.','Solar liegt auf Platz 2.','Vergleicht die Längen der Balken.']};
var QFOS={q:'Welche <b>nicht erneuerbare</b> Quelle lieferte am meisten Strom?',o:['Braunkohle','Steinkohle','Erdgas'],a:0,ok:'Genau! Braunkohle wird z. B. im Rheinischen Revier bei Köln abgebaut.',bad:['','Stellt „regenerativ / fossil“ ein und vergleicht die braunen Balken.','Stellt „regenerativ / fossil“ ein und vergleicht die braunen Balken.']};
var QGROW={q:'Wie hat sich der Anteil erneuerbarer Energien von 2000 bis 2025 verändert?',o:['Er ist von etwa 6 % auf etwa 55 % gestiegen.','Er ist gleich geblieben.','Er ist gesunken.'],a:0,ok:'Richtig! Heute kommt mehr als die Hälfte unseres Stroms aus erneuerbaren Energien.',bad:['','Vergleicht die beiden Kreise rechts unten.','Vergleicht die beiden Kreise rechts unten.']};
var QNUC={q:'Uran habt ihr in Station 2 sortiert. Warum fehlt Kernenergie im Diagramm?',o:['Das letzte Kernkraftwerk in Deutschland wurde im April 2023 abgeschaltet.','Uran ist eine regenerative Energiequelle.','Kernkraftwerke machen keinen Strom.'],a:0,ok:'Genau! Wie ein Kernkraftwerk funktioniert, lernt ihr in UV VI.',bad:['','Uran gehört zu den nicht erneuerbaren Energiequellen.','Doch, in anderen Ländern liefern Kernkraftwerke viel Strom.']};
function r4(){var s=st.s4;
  var q1=mcHTML('top',QTOP.q,QTOP.o,s.top,QTOP.a,true),q2=s.topOk?mcHTML('fos',QFOS.q,QFOS.o,s.fos,QFOS.a):'',q3=s.fosOk?mcHTML('grow',QGROW.q,QGROW.o,s.grow,QGROW.a):'',q4=s.growOk?mcHTML('nuc',QNUC.q,QNUC.o,s.nuc,QNUC.a):'';
  var chk=s.growOk?'<div class="merk"><h3>Eure Vermutung vom Anfang</h3><p>Ihr habt vermutet: <span class="k">'+(st.guess?guessName(st.guess):'keine')+'</span>. Richtig ist <span class="k">C</span>: 2025 waren es 55,1 %.</p></div>':'';
  if(s.nucOk)finish(3);
  $('task').innerHTML=head(3,'Woher kam unser Strom 2025?')+'<p>Lest das Diagramm links und die beiden Kreise rechts unten.</p>'+q1+q2+q3+chk+q4+(st.done[3]?'<p class="win"><b>Stark!</b> Ihr könnt Daten zum Strommix auswerten.</p>':'')+'<div class="row">'+nextBtn(3)+'</div>';
  mcBind('top',QTOP,s,'top','s4top',r4);if(s.topOk)mcBind('fos',QFOS,s,'fos','s4fos',r4);if(s.fosOk)mcBind('grow',QGROW,s,'grow','s4grow',r4);if(s.growOk)mcBind('nuc',QNUC,s,'nuc','s4nuc',r4);
  bindNext();}

/* Station 5: Merksatz */
var WORDS=['nicht erneuerbar','regenerativ','umgewandelt','elektrische','entwertet','mehr als die Hälfte'];
var GAPS=[{id:'g1',pre:'Kohle, Erdgas, Erdöl und Uran sind',post:'Energiequellen. Ihre Vorräte sind begrenzt.',a:0},{id:'g2',pre:'Sonne, Wind, Wasser, Biomasse und Erdwärme sind',post:'Energiequellen. Sie stehen immer wieder zur Verfügung.',a:1},
  {id:'g3',pre:'Im Kraftwerk wird Energie nicht erzeugt, sondern',post:'.',a:2},{id:'g4',pre:'Der Generator wandelt Bewegungsenergie in',post:'Energie um.',a:3},
  {id:'g5',pre:'Ein Teil der Energie wird als Abwärme abgegeben. Die Energie wird',post:'.',a:4},{id:'g6',pre:'2025 kam',post:'unseres Stroms aus erneuerbaren Energien.',a:5}];
var MERK='<div class="merk"><h3>Merksatz: Woher kommt unser Strom?</h3><ol style="margin:0;padding-left:1.2em">'+GAPS.map(function(g){return '<li>'+g.pre+' <span class="k">'+WORDS[g.a]+'</span>'+(g.post==='.'?'.':' '+g.post)+'</li>';}).join('')+'</ol></div>';
function r5(){var s=st.s5;
  var gaps=s.ok?MERK:'<div class="q gap"><p><b>Lückentext:</b> Wählt das passende Wort.</p><ol>'+GAPS.map(function(g){var v=s.gaps[g.id];return '<li>'+g.pre+' <select class="sel" data-g="'+g.id+'"><option value="">…</option>'+WORDS.map(function(w,j){return '<option value="'+j+'"'+(v===j?' selected':'')+'>'+w+'</option>';}).join('')+'</select> '+(g.post==='.'?'.':g.post)+'</li>';}).join('')+'</ol>'+
    '<div class="row"><button class="btn pri" type="button" id="c5">Prüfen</button></div><p class="fb" id="fb5"></p></div>';
  var refl=s.ok?'<div class="q"><p><b>Was hat euch heute überrascht?</b> Schreibt einen Satz.</p><textarea class="free" id="refl" rows="2" placeholder="Uns hat überrascht, dass …">'+esc(s.refl)+'</textarea>'+(s.reflOk?'':'<div class="row"><button class="btn pri" type="button" id="c5r">Fertig</button></div>')+'<p class="fb" id="fb5r"></p></div>':'';
  if(s.reflOk)finish(4);
  $('task').innerHTML=head(4,'Das nehmen wir mit')+gaps+refl+(s.reflOk?resultsHTML():'')+(st.done[4]?'<p class="win"><b>Fertig!</b> Schnell gewesen? Probiert den Profi-Zusatz.</p>':'')+'<div class="row">'+nextBtn(4)+'</div>';
  Array.prototype.forEach.call(document.querySelectorAll('[data-g]'),function(sl){sl.addEventListener('change',function(){s.gaps[sl.dataset.g]=sl.value===''?null:+sl.value;sl.className='sel';save();});});
  if($('c5'))$('c5').addEventListener('click',function(){var fb=$('fb5'),miss=GAPS.filter(function(g){return s.gaps[g.id]==null;}).length;if(miss){fb.className='fb bad';fb.textContent='Es fehlen noch '+miss+' Wörter.';return;}
    var wrong=GAPS.filter(function(g){return s.gaps[g.id]!==g.a;});tryInc('s5gaps',!wrong.length,wrong.map(function(g){return g.id;}).join(','));
    GAPS.forEach(function(g){document.querySelector('[data-g="'+g.id+'"]').className='sel '+(s.gaps[g.id]===g.a?'ok':'bad');});
    if(!wrong.length){s.ok=true;save();r5();draw();return;}fb.className='fb bad';fb.textContent=wrong.length+(wrong.length>1?' Lücken stimmen':' Lücke stimmt')+' noch nicht. Jedes Wort passt genau einmal.';
    showHelp(fb,'s5gaps',function(){GAPS.forEach(function(g){s.gaps[g.id]=g.a;});save();r5();helpMsg('fb5','Die Lösung ist eingetragen. Lest sie durch und tippt auf „Prüfen“.');});});
  if($('refl')){$('refl').addEventListener('input',function(){s.refl=this.value;save();});if($('c5r'))$('c5r').addEventListener('click',function(){var fb=$('fb5r');if(s.refl.trim().length<15){fb.className='fb bad';fb.textContent='Schreibt einen ganzen Satz.';return;}s.reflOk=true;save();r5();draw();});}
  bindResults();bindNext();}

/* Profi-Zusatz */
function r6(){var s=st.s6;
  function box(id,q,unit,val,ok){return '<div class="q"><p>'+q+'</p><div class="row"><input class="num'+(ok?' ok':'')+'" id="'+id+'" inputmode="decimal" value="'+esc(val)+'"'+(ok?' disabled':'')+'><span>'+unit+'</span>'+(ok?'':'<button class="btn pri" type="button" id="b'+id+'">Prüfen</button>')+'</div><p class="fb" id="fb'+id+'"></p></div>';}
  $('task').innerHTML=head(5,'Wirkungsgrad berechnen')+'<p class="muted">Formel: Wirkungsgrad η = genutzte Energie : zugeführte Energie · 100 %</p>'+
    box('eta','<b>1.</b> Ein Kohlekraftwerk bekommt pro Sekunde <b>2500 MJ</b> chemische Energie aus der Kohle. Es gibt <b>1000 MJ</b> elektrische Energie ab. Wie groß ist der Wirkungsgrad?','%',s.eta,s.etaOk)+
    (s.etaOk?box('loss','<b>2.</b> Ein Gaskraftwerk hat einen Wirkungsgrad von <b>60 %</b>. Wie viel Energie wird von <b>1000 MJ</b> Brennstoffenergie als Abwärme entwertet?','MJ',s.loss,s.lossOk):'')+
    (s.lossOk?'<p class="win"><b>Profi!</b> Das Gaskraftwerk entwertet weniger Energie als das Kohlekraftwerk. Darum ist sein Wirkungsgrad besser.</p>':'');
  function chk(id,val,key,flag,okMsg,badMsg,sol){var b=$('b'+id);if($(id))$(id).addEventListener('input',function(){s[id]=this.value;save();});if(!b)return;b.addEventListener('click',function(){var v=num(s[id]),ok=Math.abs(v-val)<0.6,fb=$('fb'+id);tryInc(key,ok,s[id]);
    if(ok){s[flag]=true;save();r6();helpMsg('fb'+id,okMsg);return;}fb.className='fb bad';fb.textContent=badMsg(v);showHelp(fb,key,function(){s[id]=sol;s[flag]=true;save();r6();});});}
  chk('eta',40,'s6eta','etaOk','Richtig! 1000 MJ : 2500 MJ = 0,4 = 40 %.',function(v){return Math.abs(v-0.4)<0.01?'Fast! 0,4 ist richtig, gebt es aber in Prozent an.':'Teilt die genutzte Energie durch die zugeführte Energie.';},'40');
  chk('loss',400,'s6loss','lossOk','Richtig! 40 % von 1000 MJ = 400 MJ Abwärme.',function(v){return Math.abs(v-600)<1?'Das ist die genutzte elektrische Energie. Gefragt ist die Abwärme.':'Wenn 60 % genutzt werden, wie viel Prozent werden entwertet?';},'400');
  if(s.etaOk)helpMsg('fbeta','Richtig! 1000 MJ : 2500 MJ = 0,4 = 40 %.');if(s.lossOk)helpMsg('fbloss','Richtig! 40 % von 1000 MJ = 400 MJ Abwärme.');}

/* ---------- Ergebnisse als Text ---------- */
var TL=FIT.map(function(q,i){return ['s1'+q.id,'Fit-Check '+(i+1)+' · '+q.topic];}).concat([['s2sort','Energiequellen · Sortieren'],['s2gas','Energiequellen · Erdgas'],['s2bio','Energiequellen · Biomasse'],['s3chain','Kraftwerk · Energiekette'],['s3gen','Kraftwerk · Generator'],['s3heat','Kraftwerk · Abwärme'],['s3wind','Kraftwerk · Windkraftwerk'],['s4top','Strommix · größte Quelle'],['s4fos','Strommix · größte fossile Quelle'],['s4grow','Strommix · Entwicklung'],['s4nuc','Strommix · Kernenergie'],['s5gaps','Merksatz · Lückentext'],['s6eta','Profi · Wirkungsgrad'],['s6loss','Profi · Abwärme']]);
function resText(){var r=st.res||{},d=new Date(),L=[];
  L.push('STROM-SPUR · Woher kommt unsere tägliche Energie?');
  L.push('Name: '+(r.name||'')+'    Klasse: '+(r.klasse||'')+'    Datum: '+d.toLocaleDateString('de-DE')+', '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}));
  L.push('Geschafft: '+STATIONS.map(function(x,i){return x.name+(st.done[i]?' ✓':' –');}).join(' | '));L.push('');
  L.push('MEINE VERMUTUNG: '+(st.guess?guessName(st.guess):'keine gewählt')+(st.guess==='C'?'  → stimmt':'  → richtig ist C (55,1 %)'));L.push('');
  L.push('FIT-CHECK (Diagnose Jg. 8, erste Antwort zählt)');
  var first=0;FIT.forEach(function(q,i){var t=st.tries['s1'+q.id],w=t&&t.w&&t.w.length?q.o[t.w[0]]:null;if(t&&t.first)first++;L.push('  '+(i+1)+'. '+q.topic+': '+(!t?'nicht bearbeitet':t.first?'beim 1. Versuch richtig ✓':'zuerst falsch ✗ (gewählt: „'+strip(w||'?')+'“)'));});
  L.push('  Ergebnis: '+first+' von 6 beim ersten Versuch richtig');L.push('');
  L.push('STATION 2 · Energiequellen');L.push('  '+SRC.map(function(x){var v=st.s2.sort[x.id];return x.n+': '+(v==null?'–':['nicht erneuerbar','regenerativ'][v]+(v===x.a?' ✓':' ✗'));}).join(' | '));
  L.push('  Erdgas: '+segAns(QGAS,st.s2.gas));L.push('  Biomasse: '+segAns(QBIO,st.s2.bio));L.push('');
  L.push('STATION 3 · Kraftwerk');L.push('  Kette Kohlekraftwerk: chemische → '+CHAIN.map(function(c){var v=st.s3.chain[c.id];return v==null?'–':FORMS[v]+(v===c.a?' ✓':' ✗');}).join(' → '));
  L.push('  Generator: '+segAns(QGEN,st.s3.gen));L.push('  Abwärme: '+segAns(QHEAT,st.s3.heat));L.push('  Windkraftwerk: '+segAns(QWIND,st.s3.wind));L.push('');
  L.push('STATION 4 · Strommix');L.push('  Größte Quelle: '+segAns(QTOP,st.s4.top));L.push('  Größte fossile Quelle: '+segAns(QFOS,st.s4.fos));L.push('  Entwicklung: '+segAns(QGROW,st.s4.grow));L.push('  Kernenergie: '+segAns(QNUC,st.s4.nuc));L.push('');
  L.push('STATION 5 · Merksatz');L.push('  '+(st.s5.ok?'Lückentext gelöst ✓':'(Lückentext noch nicht gelöst)'));L.push('  Das hat uns überrascht: '+((st.s5.refl||'').trim()||'(leer)'));L.push('');
  L.push('VERSUCHE (wie oft geprüft bzw. eine Antwort gewählt wurde, bis es richtig war)');var tt=triesLines(L,TL,'s6');L.push('');
  L.push('PROFI-ZUSATZ ★');L.push('  Wirkungsgrad: '+(st.s6.eta?st.s6.eta+' %'+(st.s6.etaOk?'  ✓':'  ✗'):'(nicht bearbeitet)'));L.push('  Abwärme: '+(st.s6.loss?st.s6.loss+' MJ'+(st.s6.lossOk?'  ✓':'  ✗'):'(nicht bearbeitet)'));
  var data={v:1,name:r.name||'',klasse:r.klasse||'',ts:Date.now(),done:st.done,guess:st.guess,fit:FIT.map(function(q){var t=st.tries['s1'+q.id];return t?(t.first?1:0):null;}),tries:st.tries,refl:st.s5.refl||'',help:tt.help,mins:tt.mins,resets:resets()};
  var json=JSON.stringify(data);L.push('');L.push('Die beiden folgenden Zeilen sind für die Auswertung. Bitte nicht verändern.');L.push('#DATEN '+json);L.push('#PRUEF '+fnv('SS-v1|'+json));
  return L.join('\r\n');}

/* ---------- Gesamt ---------- */
var lastSc=null;
function render(){var sc=STATIONS[st.station].scene;if(sc!==lastSc){if(sc==='plant')st.ptype='kohle';lastSc=sc;}
  renderRoute();renderCtl();[r1,r2,r3,r4,r5,r6][st.station]();resize();}
bindReset();
window.addEventListener('resize',resize);
if(window.matchMedia){var mq=window.matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',draw);}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
load();if(!st.t0){st.t0=Date.now();save();}if(!unlocked(st.station))st.station=0;
render();
})();

</script>
