<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ladungslabor 4</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout wie „Optik-Werkstatt“: Kopfleiste mit Stationen-Weg · links Modell mit zwei Ansichten (fest) · rechts Steuerpult + Stationsaufgabe. */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface-2:#F3F5FA; --ink:#0B1442; --ink-soft:#4E5677; --line:#CBD3E1;
  --navy:#020C45; --navy-ink:#FFFFFF; --accent:#E8892B; --accent-ink:#1B1300; --blue:#1C66C0; --blue-soft:#DCE8F7; --on-blue:#FFFFFF;
  --ok:#22865A; --ok-soft:#DDF2E7; --bad:#C8423D; --bad-soft:#F9E1DF; --pro:#6B3FB0; --pro-soft:#ECE4F8;
  --grid:#E3E8F0; --axis:#4A5068; --rail:#5B6278; --lens:#9CC3F0; --lens-edge:#3A6AA8; --ray1:#E8892B; --ray2:#1C66C0; --red:#E8432E;
  --room:#14161D; --display:#111111; --display-ink:#FFC94D;
  --f-display:"Lexend","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",Calibri,system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#060B26; --surface:#0E1640; --surface-2:#141D4F; --ink:#EEF1FA; --ink-soft:#A9B1D3; --line:#2B3672;
  --navy:#020722; --navy-ink:#FFFFFF; --accent:#F3A04F; --accent-ink:#1B1300; --blue:#6FA8F0; --blue-soft:#1A2A63; --on-blue:#06102E;
  --ok:#4CC48A; --ok-soft:#123A2C; --bad:#F07A73; --bad-soft:#40181C; --pro:#B89AF0; --pro-soft:#2A1E52;
  --grid:#1E2858; --axis:#AEB6D8; --rail:#8792C2; --lens:#3D6FB0; --lens-edge:#9CC3F0; --ray1:#F3A04F; --ray2:#6FA8F0; --red:#F2604D;
  --room:#05060A; --display:#000000; --display-ink:#FFC94D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060B26; --surface:#0E1640; --surface-2:#141D4F; --ink:#EEF1FA; --ink-soft:#A9B1D3; --line:#2B3672;
  --navy:#020722; --navy-ink:#FFFFFF; --accent:#F3A04F; --accent-ink:#1B1300; --blue:#6FA8F0; --blue-soft:#1A2A63; --on-blue:#06102E;
  --ok:#4CC48A; --ok-soft:#123A2C; --bad:#F07A73; --bad-soft:#40181C; --pro:#B89AF0; --pro-soft:#2A1E52;
  --grid:#1E2858; --axis:#AEB6D8; --rail:#8792C2; --lens:#3D6FB0; --lens-edge:#9CC3F0; --ray1:#F3A04F; --ray2:#6FA8F0; --red:#F2604D;
  --room:#05060A; --display:#000000; --display-ink:#FFC94D; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

header{background:var(--navy);color:var(--navy-ink);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hwrap{max-width:1360px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;flex-direction:column}
.brand b{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.2px}
.brand span{font-size:13px;color:#8DB7EE}
.route{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.stop{display:flex;align-items:center;gap:8px;border:2px solid #34428F;background:transparent;color:#fff;border-radius:999px;padding:5px 12px 5px 6px;font-size:14px;font-weight:700}
.stop .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#24317A;font-size:13px}
.stop.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stop.on .n{background:rgba(0,0,0,.18);color:var(--accent-ink)}
.stop.done .n{background:var(--ok);color:#fff}
.stop.pro{border-style:dashed;border-color:#8E74D6}
.stop.pro.on{background:#B89AF0;border-color:#B89AF0;color:#1A0F33;border-style:solid}
.stop:disabled{opacity:.45;cursor:not-allowed}
.reset{background:transparent;border:1.5px solid #34428F;color:#B9C6EE;border-radius:999px;padding:5px 10px;font-size:13px}

main{max-width:1360px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.plot{position:sticky;top:env(safe-area-inset-top,0px);padding:10px;display:flex;flex-direction:column;gap:10px}
@media (max-width:900px){.plot{position:static}}
canvas{display:block;width:100%;border-radius:10px;touch-action:none}
.views{display:grid;grid-template-columns:repeat(2,minmax(0,250px));justify-content:center;gap:14px}
.view{display:flex;flex-direction:column;gap:4px;min-width:0}
.view canvas{aspect-ratio:1/1;max-width:100%;background:var(--room)}
.view small{font-size:13px;color:var(--ink-soft);text-align:center}
.view small b{color:var(--ink)}

.side{display:flex;flex-direction:column;gap:16px;min-width:0}
h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0 0 4px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0}
.eyebrow{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--blue);font-weight:700;margin:0 0 2px}
.eyebrow.pro{color:var(--pro)}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--ink-soft);font-size:15px}

/* Steuerpult */
.ctl{display:flex;flex-direction:column;gap:6px}
.lift{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:stretch}
.disp{background:var(--display);color:var(--display-ink);font-family:var(--f-mono);border-radius:12px;padding:6px 10px;text-align:center;box-shadow:inset 0 0 0 3px #333;display:flex;flex-direction:column;justify-content:center}
.disp small{font-size:11px;letter-spacing:2px;color:#9a9a9a}
.disp span{font-size:28px;letter-spacing:1px;font-variant-numeric:tabular-nums}
.disp.g{color:#9FD0FF}
.keys{display:flex;gap:8px;align-items:center}
.key{width:56px;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);font-size:22px;font-weight:700}
.key:active{background:var(--accent);color:var(--accent-ink)}
input[type=range]{width:100%;accent-color:var(--accent);height:30px}
input[type=range].gr{accent-color:var(--blue)}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.locked{font-size:15px;color:var(--ink-soft);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.chk{display:flex;align-items:center;gap:10px;font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--blue)}
.sep{border:0;border-top:1.5px dashed var(--line);margin:8px 0}

.num{width:4.6em;text-align:center;border:2px solid var(--line);border-radius:8px;padding:5px 2px;background:var(--surface);font-variant-numeric:tabular-nums}
.num.ok{border-color:var(--ok);background:var(--ok-soft)}
.num.bad{border-color:var(--bad);background:var(--bad-soft)}
.sel{font:inherit;border:2px solid var(--line);border-radius:8px;padding:4px 4px;background:var(--surface);max-width:100%}
.sel.ok{border-color:var(--ok);background:var(--ok-soft)}
.sel.bad{border-color:var(--bad);background:var(--bad-soft)}
.btn{border:none;border-radius:999px;padding:10px 18px;font-weight:700;font-size:16px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--surface);border:1.5px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn.tip{background:transparent;border:1.5px dashed var(--blue);color:var(--blue);padding:7px 14px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.choice{display:flex;flex-direction:column;gap:8px}
.choice.grid2{display:grid;grid-template-columns:1fr 1fr}
@media (max-width:440px){.choice.grid2{grid-template-columns:1fr}}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.opt b{font-family:var(--f-display)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.gopt{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center}
.gopt .L{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-family:var(--f-display);grid-row:1/3}
.gopt span{font-size:15px}
.seg{display:inline-flex;flex-wrap:wrap;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:7px 14px;font-weight:700}
.seg button.sel{background:var(--blue);color:var(--on-blue)}
.seg button.ok{background:var(--ok);color:#fff}
.seg button.bad{background:var(--bad);color:#fff}
.fb{font-weight:700;min-height:1.4em}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.note{border-left:4px solid var(--accent);background:var(--surface-2);padding:10px 12px;border-radius:0 10px 10px 0;font-size:15px}
.hint{border:1.5px dashed var(--blue);background:var(--blue-soft);border-radius:10px;padding:10px 12px;font-size:15px}
.win{border:2px solid var(--ok);background:var(--ok-soft);border-radius:12px;padding:12px}
.guess{border:2px solid var(--pro);background:var(--pro-soft);border-radius:12px;padding:12px}
.q{display:flex;flex-direction:column;gap:6px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.q p b{font-family:var(--f-display);font-weight:600}
.gap ol{padding-left:1.2em;margin:0}
.gap li{margin-bottom:10px}
.dots{display:flex;gap:6px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:block}
.dots i.on{background:var(--ok);border-color:var(--ok)}
.merk{border:2px solid var(--blue);border-radius:12px;padding:14px;background:var(--surface)}
.merk h3{color:var(--blue);margin-bottom:6px}
.merk .k{color:var(--blue);font-weight:700}
textarea.free{width:100%;border:2px solid var(--line);border-radius:10px;padding:8px;background:var(--surface);color:var(--ink)}
.bz{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}
.badge{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-family:var(--f-display)}
.tw{overflow-x:auto}
table.mt{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:15.5px}
table.mt th,table.mt td{border:1.5px solid var(--line);padding:6px 6px;text-align:center}
table.mt th{background:var(--surface-2);font-weight:700}
table.mt th small{display:block;font-weight:400;color:var(--ink-soft);font-size:12px}
table.mt tr.cur td{background:var(--blue-soft)}
table.mt tr.done td{background:var(--ok-soft)}
table.mt tr.lock td{color:var(--ink-soft)}
table.mt td.v b{font-size:16px}
.chart{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--ink-soft);padding:0 6px 4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---- Ergebnisse abgeben ---- */
.abg-btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700}
.abg-ov{position:fixed;inset:0;background:rgba(2,8,40,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto;z-index:50}
.abg-box{background:var(--surface);color:var(--ink);border-radius:16px;max-width:560px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.abg-box h2{margin:0}
.abg-box ol{margin:0;padding-left:1.3em}
.abg-box li{margin-bottom:6px}
.abg-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.abg-in{border:2px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);color:var(--ink);font:inherit}
.abg-copy{background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;padding:12px 22px;font-weight:700;font-size:18px}
.abg-close{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:700;color:var(--ink)}
.abg-fb{font-weight:700;min-height:1.4em}
.abg-fb.ok{color:var(--ok)} .abg-fb.bad{color:var(--bad)}
.abg-txt{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;border:2px solid var(--line);border-radius:10px;padding:8px;background:var(--surface-2);color:var(--ink)}
</style>
<style>
.ctlrow{display:flex;flex-direction:column;gap:4px}
.ctlrow > span{font-size:13px;color:var(--ink-soft);font-weight:700;letter-spacing:.5px}
.seg.full{display:flex}
.seg.full button{flex:1}
.status{font-weight:700;border-radius:10px;padding:8px 12px;font-size:15px;text-align:center}
.status.ok{background:var(--ok-soft);color:var(--ok)} .status.bad{background:var(--bad-soft);color:var(--bad)} .status.info{background:var(--surface-2);color:var(--ink-soft)}
.patient{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2)}
.patient .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-family:var(--f-display);color:#fff;grid-row:1/3}
.pic{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.pic svg{width:100%;max-width:84px;height:auto}
.choice.grid4{display:grid;grid-template-columns:repeat(4,1fr)}
@media (max-width:440px){.choice.grid4{grid-template-columns:1fr 1fr}}

.choice.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.choice.grid3 .opt{padding:8px 8px;font-size:14px;display:flex;align-items:center;gap:6px}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.25);flex:none}
.tick{color:var(--ok);font-weight:700}
.chip{display:inline-block;border:1.5px solid var(--line);border-radius:999px;padding:1px 8px;font-size:13px;margin:2px 0;color:var(--ink-soft)}
.chip.on{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:700}
.seg.long{display:flex;flex-direction:column;border-radius:12px}
.seg.long button{text-align:left;border-top:1px solid var(--line);font-weight:600}
.seg.long button:first-child{border-top:none}
@media (max-width:440px){.choice.grid3{grid-template-columns:1fr 1fr}}
/* ---- Start-Dialog ---- */
.abg-ov{position:fixed;inset:0;background:rgba(2,8,40,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto;z-index:50}
.abg-box{background:var(--surface);color:var(--ink);border-radius:16px;max-width:560px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.abg-box h2{margin:0}
.abg-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.abg-in{border:2px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);color:var(--ink);font:inherit}
.abg-copy{background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;padding:12px 22px;font-weight:700;font-size:18px}
.abg-fb{font-weight:700;min-height:1.4em}
.abg-fb.ok{color:var(--ok)} .abg-fb.bad{color:var(--bad)}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand"><b>Ladungslabor 4</b><span>Warum leiten Metalle?</span></div>
    <nav class="route" id="route" aria-label="Stationen"></nav>
    <button class="abg-btn" id="abgBtn" type="button">Ergebnisse abgeben</button><button class="reset" id="reset" type="button">Neu starten</button>
  </div>
</header>
<main>
  <section class="card plot" aria-label="Modell">
    <canvas id="cv" aria-label="Modell: Leiter-Test, Metallgitter oder Metallstab"></canvas>
    <div class="views">
      <div class="view"><canvas id="cvA"></canvas><small id="capA"></small></div>
      <div class="view"><canvas id="cvB"></canvas><small id="capB"></small></div>
    </div>
  </section>
  <aside class="side">
    <section class="card" id="ctlCard"><p class="eyebrow">Steuerpult</p><div id="ctl" class="ctl"></div></section>
    <section class="card stack" id="task"></section>
  </aside>
</main>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var APP='Ladungslabor 4';
var STATIONS=[
  {key:'s1',name:'Leiter-Test',scene:'test'},
  {key:'s2',name:'Blick ins Metall',scene:'grid'},
  {key:'s3',name:'Ladung im Metall',scene:'bar'},
  {key:'s4',name:'Merksatz',scene:'grid'},
  {key:'s5',name:'Profi-Zusatz',pro:true,scene:'bar'}
];
var st={station:0,done:[false,false,false,false,false],guess:null,
  s1:{obs:{},obsOk:false,gem:null,gemOk:false,tested:{}},
  s2:{obs:{},obsOk:false,rumpf:null,rumpfOk:false},
  s3:{obsA:{},aOk:false,obsB:{},bOk:false,hand:null,handOk:false,own:'',ok:false,touched:false,handed:false},
  s4:{gaps:{},ok:false,refl:'',kabel:null,kabelOk:false},
  s5:{},res:{},tries:{},help:{},t0:null,log:[]};
/* ---------- Speicher ---------- */
var KEY='ladungslabor-4-v1',RKEY='ladungslabor-4-resets';
function save(){try{localStorage.setItem(KEY,JSON.stringify({station:st.station,done:st.done,guess:st.guess,s1:st.s1,s2:st.s2,s3:st.s3,s4:st.s4,s5:st.s5,res:st.res,tries:st.tries,help:st.help,t0:st.t0,log:st.log}));}catch(e){}}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||'null');if(!x)return;
  st.station=x.station||0;if(x.done)st.done=x.done;while(st.done.length<5)st.done.push(false);st.guess=x.guess||null;
  ['s1','s2','s3','s4','s5'].forEach(function(k){if(x[k])st[k]=Object.assign(st[k],x[k]);});
  if(x.res)st.res=x.res;if(x.tries)st.tries=x.tries;if(x.help)st.help=x.help;if(x.t0)st.t0=x.t0;if(x.log)st.log=x.log;}catch(e){}}
function tryInc(k,ok,val){var t=st.tries[k]||(st.tries[k]={n:0,ok:false,first:null});if(t.ok)return;t.n++;if(t.first===null)t.first=!!ok;if(ok)t.ok=true;else if(val!=null&&val!==''){t.w=t.w||[];if(t.w.length<12)t.w.push(val);}save();}
function stuck(k){var t=st.tries[k];return !!(t&&!t.ok&&t.n>=3);}
function showHelp(fb,k,fn){if(!fb||!stuck(k))return;var id='hb_'+k;if(document.getElementById(id))return;var b=document.createElement('button');b.type='button';b.id=id;b.className='btn tip';b.style.marginTop='6px';b.textContent='Ich komme nicht weiter: Lösung zeigen';
  b.addEventListener('click',function(){st.help[k]=true;save();fn();});var wrap=document.createElement('div');wrap.className='row';wrap.appendChild(b);(fb.parentNode.classList&&fb.parentNode.classList.contains('row')?fb.parentNode:fb).insertAdjacentElement('afterend',wrap);}
function helpMsg(id,t){var f=$(id);if(f){f.className='fb ok';f.textContent=t;}}
function fnv(str){var h=0x811c9dc5;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return ('0000000'+h.toString(16)).slice(-8);}
function resets(){try{return +(localStorage.getItem(RKEY)||0);}catch(e){return 0;}}
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}

function col(n){return getComputedStyle(document.documentElement).getPropertyValue('--'+n).trim();}

var cv=$('cv'),ctx=cv.getContext('2d'),W=0,H=0;

  cv.style.height=h+'px';cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);W=w;H=h;sizeView($('cvA'));sizeView($('cvB'));draw();}

function tag(c,t,x,y,color,align){c.font='bold 13px '+ff();c.textBaseline='middle';c.textAlign=align||'center';var w=c.measureText(t).width,x0=align==='left'?x:align==='right'?x-w:x-w/2;

function zoom(cnv,f,back){var x=cnv.getContext('2d'),w=cnv.width;paper(x,w,back);x.save();x.translate(w/2,w/2);x.scale(w/f.s,w/f.s);x.translate(-f.x,-f.y);paint(x,true);x.restore();
  x.strokeStyle='rgba(58,106,168,.6)';x.lineWidth=w*0.02;x.beginPath();x.arc(w/2,w/2,w*0.47,0,Math.PI*2);x.stroke();}
function vtext(x,w,lines){var y=w*0.1;lines.forEach(function(l){x.font=(l.b?'bold ':'')+Math.round(w*(l.s||0.075))+'px '+ff();x.fillStyle=l.c||'#1A1F36';x.textAlign=l.a||'left';x.textBaseline='top';
  var words=String(l.t).split(' '),line='',maxw=w*0.84,xx=l.a==='center'?w/2:w*0.08;words.forEach(function(wd){var t=line?line+' '+wd:wd;if(x.measureText(t).width>maxw&&line){x.fillText(line,xx,y);y+=w*(l.s||0.075)*1.25;line=wd;}else line=t;});x.fillText(line,xx,y);y+=w*(l.s||0.075)*1.25+w*(l.gap||0.03);});}

/* ---------- Modell (nicht gespeichert) ----------
   Leiter-Test: geladene Kugel (Elektronenüberschuss) wird über einen Stab in der Hand berührt.
   Gittermodell: positive Atomrümpfe sitzen fest im Gitter, freie Elektronen bewegen sich dazwischen.
   Metallstab: Elektronen werden von einem negativen Stab weggeschoben (Influenz), zusätzliche Elektronen verteilen sich und fließen über die Hand ab. */
var M={},T=0;
var MATS=[['cu','Kupfer',1,'#C8763C'],['fe','Eisen',1,'#8A8F98'],['al','Aluminium',1,'#B9C0CB'],['ku','Kunststoff',0,'#E8C33A'],['ho','Holz (trocken)',0,'#A9784A'],['gl','Glas',0,'#A8DDEA']];
function mat(k){return MATS.filter(function(m){return m[0]===k;})[0]||MATS[0];}
var TR=17,Q0=6,BN=24,GRID=[],RUMPF=[];
(function(){for(var r=0;r<4;r++)for(var c=0;c<7;c++)GRID.push([110+c*70,92+r*66]);
  for(var r2=0;r2<3;r2++)for(var c2=0;c2<8;c2++)RUMPF.push([229+c2*44,156+r2*34]);})();
function rng(s){return function(){s=(s*9301+49297)%233280;return s/233280;};}
function freshModel(){var r=rng(11);
  M={test:{mat:'cu',q:Q0,conn:0,on:false,fly:[],acc:0},
     grid:{mat:'me',view:'gitter',track:false,trail:[],el:[]},
     bar:{mode:'near',k:0,el:[],ball:Q0,hand:false}};
  GRID.forEach(function(p,i){var a=r()*6.28;M.grid.el.push({x:p[0]+28*Math.cos(a),y:p[1]+28*Math.sin(a),vx:Math.cos(a)*70,vy:Math.sin(a)*70,h:i,ph:a});});
  for(var i=0;i<BN;i++)M.bar.el.push({x:212+(i+.5)/BN*336,y:142+r()*96,u:(i+.5)/BN,v:r(),ph:r()*6.28,leave:false});
}
freshModel();
function sgnTxt(q){return q>0?'+'+q:(q<0?'–'+(-q):'0');}
function chargeWord(q){return q>0?'positiv geladen':(q<0?'negativ geladen':'ungeladen');}
function qCol(q){return q===0?'#22865A':(q>0?'#C8423D':'#1C66C0');}

/* ---------- Zeichnen ---------- */
function scene(){return STATIONS[st.station].scene;}
function darkScene(){return false;}
function bg(){return col('surface');}
function draw(){if(!W)return;
  ctx.fillStyle=bg();ctx.fillRect(0,0,W,H);
  var k=Math.min(W/640,H/372);ctx.save();ctx.translate((W-640*k)/2,(H-372*k)/2);ctx.scale(k,k);paint(ctx,false);ctx.restore();
  ctx.font='11px '+ff();ctx.fillStyle=col('ink-soft');ctx.textAlign='right';ctx.textBaseline='bottom';ctx.fillText('Modell, nicht maßstäblich',W-8,H-6);
  drawViews();updStatus();}
function paint(c,lupe){var sc=scene();if(sc==='test')drawTest(c,lupe);else if(sc==='grid')drawGrid(c,lupe);else drawBar(c,lupe);}
function electron(c,x,y,r,hl){c.fillStyle=hl?'#F5B82E':'#2F6FD3';c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();if(hl){c.strokeStyle='#8A5A00';c.lineWidth=2;c.stroke();}
  c.fillStyle=hl?'#1A1F36':'#fff';c.font='bold '+Math.round(r*1.5)+'px '+ff();c.textAlign='center';c.textBaseline='middle';c.fillText('–',x,y+0.5);}
function rumpf(c,x,y,r){c.fillStyle='#F6C3BF';c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();c.strokeStyle='#E8322B';c.lineWidth=2;c.stroke();
  c.fillStyle='#B3261E';c.font='bold '+Math.round(r*1.1)+'px '+ff();c.textAlign='center';c.textBaseline='middle';c.fillText('+',x,y+1);}
function rrect(c,x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h);}
function hand(c,x,y){c.fillStyle='#F1C7A3';c.strokeStyle='#B07A52';c.lineWidth=2;rrect(c,x,y-26,54,52,14);c.fill();c.stroke();
  for(var i=0;i<4;i++){rrect(c,x+46,y-24+i*12,22,10,5);c.fill();c.stroke();}
  c.font='bold 14px '+ff();c.fillStyle=col('ink');c.textAlign='center';c.textBaseline='top';c.fillText('Hand',x+30,y+32);}

/* Station 1: Leiter-Test */
var RODY=180,RODH=34,RODLEN=300;
function rodL(){return 214-52*M.test.conn;}
function drawTest(c,lupe){var t=M.test,m=mat(t.mat),cx=110,cy=RODY,R=52,L=rodL();
  /* Stativ */
  c.fillStyle='#C9CED8';c.fillRect(cx-5,cy+R-2,10,110);c.fillRect(cx-40,cy+R+104,80,10);
  /* Kugel */
  var gr=c.createRadialGradient(cx-18,cy-18,6,cx,cy,R);gr.addColorStop(0,'#F4F6FA');gr.addColorStop(1,'#9AA3B5');c.fillStyle=gr;c.beginPath();c.arc(cx,cy,R,0,Math.PI*2);c.fill();
  for(var i=0;i<t.q;i++){var a=-Math.PI/2+i*2*Math.PI/Q0+0.3;electron(c,cx+Math.cos(a)*(R-14),cy+Math.sin(a)*(R-14),9);}
  /* Stab */
  c.fillStyle=m[3];rrect(c,L,RODY-RODH/2,RODLEN,RODH,8);c.fill();c.strokeStyle='rgba(0,0,0,.25)';c.lineWidth=1.5;c.stroke();
  if(lupe){c.save();rrect(c,L,RODY-RODH/2,RODLEN,RODH,8);c.clip();
    for(var k=0;k<24;k++)for(var r2=0;r2<2;r2++){var x=L+8+k*12.4,y=RODY-7+r2*14;
      if(m[2]){c.fillStyle='#F6C3BF';c.beginPath();c.arc(x,y,3,0,7);c.fill();c.strokeStyle='#E8322B';c.lineWidth=.8;c.stroke();}
      else{c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.arc(x,y,3,0,7);c.fill();c.fillStyle='#2F6FD3';c.beginPath();c.arc(x+Math.cos(T*3+k+r2)*4.5,y+Math.sin(T*3+k+r2)*4.5,1.6,0,7);c.fill();}}
    if(m[2])for(var j=0;j<40;j++){var xx=L+((j*37+T*30*((j%3)+1))%RODLEN),yy=RODY+Math.sin(j*1.7+T*2)*12;c.fillStyle='#2F6FD3';c.beginPath();c.arc(xx,yy,1.8,0,7);c.fill();}
    c.restore();}
  else{c.font='bold 15px '+ff();c.fillStyle=t.mat==='cu'||t.mat==='ho'?'#fff':'#1A1F36';c.textAlign='center';c.textBaseline='middle';c.fillText(m[1]+'stab',L+RODLEN/2,RODY);}
  t.fly.forEach(function(f){electron(c,L+f.t*(RODLEN+20),RODY+Math.sin(f.t*12)*5,8);});
  hand(c,L+RODLEN-6,RODY);
  if(!lupe){c.font='bold 15px '+ff();c.fillStyle=col('ink');c.textAlign='center';c.textBaseline='bottom';c.fillText('geladene Kugel',cx,cy-R-10);
    c.font='bold 17px '+ff();c.fillStyle=qCol(-t.q);c.textBaseline='top';c.fillText(t.q?t.q+' Elektronen zu viel':'ungeladen',cx+20,cy-R-58);
    c.font='13px '+ff();c.fillStyle=col('ink-soft');c.textAlign='left';c.fillText('Die Kugel steht auf einem Fuß aus Kunststoff.',300,300);
    c.fillText(t.conn>=1?'Der Stab berührt die Kugel.':'Der Stab berührt die Kugel noch nicht.',300,320);}
}

/* Station 2: Gittermodell */
function gridFree(){return M.grid.mat==='me'&&M.grid.view==='gitter';}
function drawGrid(c,lupe){var G=M.grid,me=G.mat==='me',free=gridFree();
  c.fillStyle=me?'#E6EAF1':'#FFF1C2';rrect(c,66,48,508,292,18);c.fill();c.strokeStyle=me?'#9AA3B5':'#E0B83A';c.lineWidth=2.5;c.stroke();
  if(!lupe){c.font='bold 16px '+ff();c.fillStyle=col('ink');c.textAlign='left';c.textBaseline='bottom';
    c.fillText(me?(free?'Kupfer im Gittermodell':'Einzelne Kupferatome'):'Kunststoff (vereinfacht)',70,40);}
  GRID.forEach(function(p,i){var j=Math.sin(T*9+i*1.3)*1.6,x=p[0]+j,y=p[1]+Math.cos(T*8+i)*1.6;
    if(!free){c.strokeStyle='rgba(47,111,211,.35)';c.setLineDash([3,4]);c.lineWidth=1.5;c.beginPath();c.arc(p[0],p[1],27,0,Math.PI*2);c.stroke();c.setLineDash([]);}
    rumpf(c,x,y,15);});
  if(G.trail.length>1){c.strokeStyle='rgba(245,184,46,.85)';c.lineWidth=3;c.beginPath();c.moveTo(G.trail[0][0],G.trail[0][1]);G.trail.forEach(function(q){c.lineTo(q[0],q[1]);});c.stroke();}
  G.el.forEach(function(e,i){electron(c,e.x,e.y,8,G.track&&i===TR);});
  if(!lupe){var ly=356;c.textBaseline='middle';c.textAlign='left';c.font='14px '+ff();
    rumpf(c,84,ly,10);c.textAlign='left';c.font='14px '+ff();c.fillStyle=col('ink');c.fillText(free?'Atomrumpf (+), sitzt fest':'Kern mit inneren Elektronen (+)',100,ly);
    electron(c,340,ly,8,false);c.textAlign='left';c.font='14px '+ff();c.fillStyle=col('ink');c.fillText(free?'freies Elektron (–)':'äußeres Elektron (–), gebunden',354,ly);}
}
function updGrid(dt){var G=M.grid,free=gridFree();
  G.el.forEach(function(e){var h=GRID[e.h];
    if(free){e.x+=e.vx*dt;e.y+=e.vy*dt;
      if(Math.random()<dt*1.4){var a=Math.random()*6.28,s=55+Math.random()*55;e.vx=Math.cos(a)*s;e.vy=Math.sin(a)*s;}
      if(e.x<78){e.x=78;e.vx=Math.abs(e.vx);}if(e.x>562){e.x=562;e.vx=-Math.abs(e.vx);}if(e.y<60){e.y=60;e.vy=Math.abs(e.vy);}if(e.y>328){e.y=328;e.vy=-Math.abs(e.vy);}
      var cc=Math.max(0,Math.min(6,Math.round((e.x-110)/70))),rr=Math.max(0,Math.min(3,Math.round((e.y-92)/66))),p=GRID[rr*7+cc],dx=e.x-p[0],dy=e.y-p[1],d=Math.sqrt(dx*dx+dy*dy)||1;
      if(d<24){e.x=p[0]+dx/d*24;e.y=p[1]+dy/d*24;var dot=(e.vx*dx+e.vy*dy)/d;if(dot<0){e.vx-=2*dot*dx/d;e.vy-=2*dot*dy/d;}}}
    else{e.ph+=dt*2.2;var tx=h[0]+Math.cos(e.ph)*27,ty=h[1]+Math.sin(e.ph)*27,f=Math.min(1,dt*4);e.x+=(tx-e.x)*f;e.y+=(ty-e.y)*f;}});
  if(G.track){G.trail.push([G.el[TR].x,G.el[TR].y]);if(G.trail.length>140)G.trail.shift();}else G.trail=[];}

/* Station 3: Metallstab */
function barTarget(e){if(e.leave)return [640,190];var k=M.bar.mode==='near'?M.bar.k/4:0,ex=1+k*2.2,f=1-Math.pow(1-e.u,ex);return [212+f*336,142+e.v*96];}
function assignU(){var a=M.bar.el.filter(function(e){return !e.leave;});a.sort(function(p,q){return p.x-q.x;});a.forEach(function(e,i){e.u=(i+.5)/a.length;});}
function barCounts(){var L=0,R=0;M.bar.el.forEach(function(e){if(e.leave)return;if(barTarget(e)[0]<379)L++;else R++;});return {L:12-L,R:12-R,n:L+R};}
function updBar(dt){var B=M.bar,f=Math.min(1,dt*3);if(B.touch>0)B.touch=Math.max(0,B.touch-dt*0.8);
  if(B.hand&&B.mode==='touch'){var act=B.el.filter(function(e){return !e.leave;});if(act.length>BN){act.sort(function(p,q){return q.x-p.x;});for(var i=0;i<act.length-BN;i++)act[i].leave=true;assignU();}}
  B.el.forEach(function(e){var t=barTarget(e);e.x+=(t[0]-e.x)*f;e.y+=(t[1]-e.y)*f;});
  var before=B.el.length;B.el=B.el.filter(function(e){return !(e.leave&&e.x>596);});if(B.el.length!==before)kickStatus();}
function drawBar(c,lupe){var B=M.bar,C=barCounts();
  if(B.mode==='near'){var end=196-(4-B.k)*34;c.fillStyle='#E8C33A';rrect(c,end-170,172,170,36,8);c.fill();c.strokeStyle='rgba(0,0,0,.25)';c.lineWidth=1.5;c.stroke();
    for(var i=0;i<6;i++){c.fillStyle='#1C66C0';c.font='bold 20px '+ff();c.textAlign='center';c.textBaseline='middle';c.fillText('–',end-150+i*26,190);}
    if(!lupe){c.font='bold 14px '+ff();c.fillStyle=col('ink');c.textAlign='center';c.textBaseline='bottom';c.fillText('negativ geladener Stab',Math.max(90,end-85),164);}}
  else{var bx=150+22*Math.min(1,(B.touch||0)*2),by=190;var gr=c.createRadialGradient(bx-10,by-10,4,bx,by,34);gr.addColorStop(0,'#F4F6FA');gr.addColorStop(1,'#9AA3B5');c.fillStyle=gr;c.beginPath();c.arc(bx,by,34,0,Math.PI*2);c.fill();
    for(var j=0;j<B.ball;j++){var a=j*2*Math.PI/Q0;electron(c,bx+Math.cos(a)*20,by+Math.sin(a)*20,7);}
    c.fillStyle='#C9CED8';c.fillRect(bx-4,by+34,8,70);
    if(!lupe){c.font='bold 14px '+ff();c.fillStyle=col('ink');c.textAlign='center';c.textBaseline='bottom';c.fillText('Kugel',bx,by-40);if(B.touch>0.1){c.fillStyle=col('ok');c.fillText('berührt!',bx,by-58);}
      c.font='13px '+ff();c.fillStyle=qCol(-B.ball);c.textBaseline='top';c.fillText(B.ball?B.ball+' zu viel':'ungeladen',bx,by+108);}
    if(B.hand)hand(c,560,190);}
  c.fillStyle='#E6EAF1';rrect(c,206,132,348,116,14);c.fill();c.strokeStyle='#9AA3B5';c.lineWidth=2.5;c.stroke();
  RUMPF.forEach(function(p,i){rumpf(c,p[0]+Math.sin(T*9+i)*1.2,p[1],12);});
  B.el.forEach(function(e,i){electron(c,e.x+Math.sin(T*3+e.ph)*3,e.y+Math.cos(T*2.6+e.ph)*3,7);});
  if(!lupe){c.font='bold 15px '+ff();c.fillStyle=col('ink');c.textAlign='center';c.textBaseline='bottom';c.fillText('Metallstab (Kupfer)',380,124);
    c.strokeStyle=col('line');c.setLineDash([4,4]);c.lineWidth=1.5;c.beginPath();c.moveTo(380,252);c.lineTo(380,272);c.stroke();c.setLineDash([]);
    [[C.L,293,'linkes Ende'],[C.R,467,'rechtes Ende']].forEach(function(o){c.font='13px '+ff();c.fillStyle=col('ink-soft');c.textBaseline='top';c.fillText(o[2],o[1],258);
      c.font='bold 18px '+ff();c.fillStyle=qCol(o[0]);c.fillText(sgnTxt(o[0]),o[1],278);});
    var tot=C.L+C.R;c.font='bold 15px '+ff();c.fillStyle=qCol(tot);c.fillText('ganzer Stab: '+sgnTxt(tot)+' · '+chargeWord(tot),380,312);}
}
function kickStatus(){updStatus();}

  if(sc==='test'){zoom(A,{x:rodL()+150,y:RODY,s:120},bg());gauge(B,M.test.q);$('capA').innerHTML='<b>Lupe:</b> Blick in den Stab';$('capB').innerHTML='<b>Ladungsanzeige</b> der Kugel';}
  else if(sc==='grid'){zoom(A,{x:285,y:158,s:150},bg());var x=B.getContext('2d'),w=B.width,me=M.grid.mat==='me';paper(x,w);
    vtext(x,w,[{t:'Ladungskonto',s:0.085,b:true},{t:(gridFree()?'Atomrümpfe: ':'Positive Ladung: ')+GRID.length+' × +',s:0.062,b:true,c:'#C8423D'},{t:(gridFree()?'Freie Elektronen: ':'Gebundene Elektronen: ')+GRID.length+' × –',s:0.062,b:true,c:'#1C66C0'},
      {t:'Zusammen: 0 · ungeladen',s:0.07,b:true,c:'#22865A'},{t:gridFree()?'Die Elektronen sind frei beweglich.':'Die Elektronen bleiben bei ihren Atomen.',s:0.06,c:'#4E5677'}]);
    $('capA').innerHTML='<b>Lupe:</b> Ausschnitt';$('capB').innerHTML='<b>Ladungskonto</b>';}
  else{zoom(A,{x:250,y:190,s:140},bg());var C=barCounts(),x2=B.getContext('2d'),w2=B.width;paper(x2,w2);
    vtext(x2,w2,[{t:'Ladungskonto',s:0.085,b:true},{t:'Atomrümpfe: 24 × +',s:0.062,c:'#C8423D',b:true},{t:'Elektronen im Stab: '+C.n+' × –',s:0.062,c:'#1C66C0',b:true},
      {t:'Linkes Ende: '+sgnTxt(C.L),s:0.066,b:true,c:qCol(C.L)},{t:'Rechtes Ende: '+sgnTxt(C.R),s:0.066,b:true,c:qCol(C.R)},{t:'Ganzer Stab: '+sgnTxt(C.L+C.R),s:0.072,b:true,c:qCol(C.L+C.R)}]);
    $('capA').innerHTML='<b>Lupe:</b> linkes Ende';$('capB').innerHTML='<b>Ladungskonto</b>';}
}
function gauge(B,q){var x=B.getContext('2d'),w=B.width;paper(x,w,'#FFFFFF');var cx=w/2,cy=w*0.62,R=w*0.38;
  x.lineWidth=w*0.05;x.strokeStyle='#E3E8F0';x.beginPath();x.arc(cx,cy,R,Math.PI,2*Math.PI);x.stroke();
  x.strokeStyle='#2F6FD3';x.beginPath();x.arc(cx,cy,R,Math.PI,Math.PI+Math.PI*q/Q0);if(q>0)x.stroke();
  var a=Math.PI+Math.PI*q/Q0;x.strokeStyle='#1A1F36';x.lineWidth=w*0.018;x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+Math.cos(a)*R*0.92,cy+Math.sin(a)*R*0.92);x.stroke();
  x.fillStyle='#1A1F36';x.beginPath();x.arc(cx,cy,w*0.03,0,7);x.fill();
  x.font=Math.round(w*0.055)+'px '+ff();x.fillStyle='#4E5677';x.textAlign='center';x.textBaseline='top';x.fillText('0',cx-R,cy+w*0.04);x.fillText('stark',cx+R,cy+w*0.04);
  x.font='bold '+Math.round(w*0.07)+'px '+ff();x.fillStyle=qCol(-q);x.fillText(q?q+' Elektronen zu viel':'ungeladen',cx,cy+w*0.15);}
function statusInfo(){var sc=scene();
  if(sc==='test'){var t=M.test,m=mat(t.mat);if(t.conn<1)return ['info',t.q?'Wähle einen Stoff und lege den Stab an die Kugel.':'Die Kugel ist ungeladen. Lade sie neu auf.'];

  if(sc==='test'){var tt=M.test,goal=tt.on?1:0;if(tt.conn!==goal){tt.conn=goal>tt.conn?Math.min(1,tt.conn+dt*2.5):Math.max(0,tt.conn-dt*2.5);if(tt.conn===1)testDone();}

    function blobSave(){try{var b=new Blob(['﻿'+txt],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},4000);
      msg(true,'Datei „'+name+'“ wird gespeichert. Falls nichts passiert: „Text kopieren“ benutzen.');}catch(e){msg(false,'Speichern klappt hier nicht. Benutzt „Text kopieren“.');}}
    var c=window.claude;
    if(c&&c.use){c.use('downloads').then(function(d){if(!d){blobSave();return;}
        d.save({filename:name,data:txt}).then(function(){msg(true,'Gespeichert als „'+name+'“. Jetzt bei IServ hochladen!');},function(err){
          if(err&&err.code==='declined')msg(false,'Speichern abgebrochen. Ihr könnt es nochmal versuchen.');else msg(false,'Speichern klappt hier nicht. Benutzt „Text kopieren“.');});},blobSave);}
    else blobSave();});
}

  ov.innerHTML='<div class="abg-box" role="dialog" aria-modal="true" aria-labelledby="stH"><p class="eyebrow">Wie verhalten sich ruhende Ladungen? · Stunde 4</p><h2 id="stH">Willkommen im Ladungslabor 4!</h2>'+

    '<p class="muted">Arbeitet ihr zu zweit? Dann tragt beide Namen ein.</p>'+

    '<div class="abg-row"><label for="stKl">Klasse</label><input class="abg-in" id="stKl" autocomplete="off" style="width:6em" value="'+esc(r.klasse)+'" placeholder="7a"></div>'+

/* ---------- Ergebnisse abgeben (jederzeit) ---------- */
(function(){
  var APP='Ladungslabor 4';
  var AKEY=(typeof KEY!=='undefined'?KEY:APP)+'-abgabe';
  function lget(){try{return JSON.parse(localStorage.getItem(AKEY)||'{}')||{};}catch(e){return {};}}
  function lset(o){try{localStorage.setItem(AKEY,JSON.stringify(o));}catch(e){}}
  var A=lget();if(!A.t0){A.t0=Date.now();lset(A);}
  function e(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
  
  function abgText(A){st.res=st.res||{};st.res.name=A.name;st.res.klasse=A.klasse;try{save();}catch(err){}
    var n=0;STATIONS.forEach(function(x,i){if(st.done[i])n++;});
    return resText().replace('\r\nGeschafft: ','\r\nGeschafft ('+n+' von '+STATIONS.length+'): ');}

  var ov=document.createElement('div');ov.className='abg-ov';ov.hidden=true;
  ov.innerHTML='<div class="abg-box" role="dialog" aria-modal="true" aria-labelledby="abgH">'+
    '<h2 id="abgH">Ergebnisse abgeben</h2>'+
    '<ol><li>Tragt eure <b>Namen</b> und eure <b>Klasse</b> ein.</li>'+
    '<li>Tippt auf <b>„Datei herunterladen“</b>. Auf dem iPad fragt Safari nach: Tippt auf <b>„Laden“</b>. Die Datei liegt dann in der App <b>Dateien</b> im Ordner <b>Downloads</b>.</li>'+
    '<li>Öffnet <b>IServ → Aufgaben → „'+e(APP)+'“</b>, ladet die Datei hoch (aus <b>Dateien → Downloads</b>) und tippt auf <b>Abgeben</b>.</li></ol>'+
    '<p class="muted">Ihr könnt auch abgeben, wenn ihr noch nicht fertig seid. In der Datei steht, wie weit ihr gekommen seid.</p>'+
    '<div class="abg-row"><label for="abgName">Namen</label><input class="abg-in" id="abgName" autocomplete="off" style="width:12em">'+
    '<label for="abgKl">Klasse</label><input class="abg-in" id="abgKl" autocomplete="off" style="width:5em"></div>'+
    '<div class="abg-row"><button class="abg-copy" type="button" id="abgDl">Datei herunterladen</button>'+
    '<button class="abg-close" type="button" id="abgClose">Schließen</button></div>'+
    '<p class="muted" style="font-size:14px">Klappt das Herunterladen nicht? Dann <button type="button" id="abgCopy" style="background:none;border:none;padding:0;color:var(--blue);text-decoration:underline;font:inherit;cursor:pointer">kopiert den Text</button> und fragt eure Lehrkraft.</p>'+
    '<p class="abg-fb" id="abgFb"></p>'+
    '<textarea class="abg-txt" id="abgTxt" rows="10" readonly hidden></textarea></div>';
  document.body.appendChild(ov);
  var $n=ov.querySelector('#abgName'),$k=ov.querySelector('#abgKl'),$t=ov.querySelector('#abgTxt'),$f=ov.querySelector('#abgFb');
  function msg(ok,t){$f.className='abg-fb '+(ok?'ok':'bad');$f.textContent=t;}
  function open(){A=lget();if(!A.name&&typeof st!=='undefined'&&st.res&&st.res.name){A.name=st.res.name;A.klasse=A.klasse||st.res.klasse||'';}$n.value=A.name||'';$k.value=A.klasse||'';$t.hidden=true;msg(true,'');ov.hidden=false;setTimeout(function(){($n.value?ov.querySelector('#abgDl'):$n).focus();},30);}
  function close(){ov.hidden=true;}
  function upd(){A.name=$n.value.trim();A.klasse=$k.value.trim();lset(A);}
  $n.addEventListener('input',upd);$k.addEventListener('input',upd);
  ov.querySelector('#abgClose').addEventListener('click',close);
  ov.addEventListener('click',function(ev){if(ev.target===ov)close();});
  document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&!ov.hidden)close();});
  ov.querySelector('#abgCopy').addEventListener('click',function(){
    upd();if(!A.name){msg(false,'Tragt zuerst eure Namen ein.');$n.focus();return;}
    var txt=abgText(A);$t.value=txt;
    function sel(){$t.hidden=false;$t.focus();$t.select();msg(true,'Der Text ist markiert. Tippe lange darauf und wähle „Kopieren“.');}
    try{navigator.clipboard.writeText(txt).then(function(){msg(true,'Text kopiert.');},sel);}catch(err){sel();}
  });
  ov.querySelector('#abgDl').addEventListener('click',function(){
    upd();if(!A.name){msg(false,'Tragt zuerst eure Namen ein.');$n.focus();return;}
    var txt=abgText(A).replace(/\r?\n/g,'\r\n'),name=resFile();
    try{var bl=new Blob(['\ufeff'+txt],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(bl),a=document.createElement('a');
      a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},10000);
      msg(true,'Die Datei „'+name+'“ wird heruntergeladen. Ladet sie jetzt in IServ bei der Aufgabe „'+APP+'“ hoch.');}
    catch(err){msg(false,'Herunterladen klappt hier nicht. Kopiert stattdessen den Text.');}
  });
  document.getElementById('abgBtn').addEventListener('click',open);
})();
})();
