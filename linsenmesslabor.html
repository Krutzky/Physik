<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linsen-Messlabor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout wie „Linsen-Labor“: Kopfleiste mit Stationen-Weg · links optische Bank + Dia- und Schirm-Ansicht mit Lineal (fest) · rechts Steuerpult + Stationsaufgabe. */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface-2:#F3F5FA; --ink:#0B1442; --ink-soft:#4E5677; --line:#CBD3E1;
  --navy:#020C45; --navy-ink:#FFFFFF; --accent:#E8892B; --accent-ink:#1B1300; --blue:#1C66C0; --blue-soft:#DCE8F7; --on-blue:#FFFFFF;
  --ok:#22865A; --ok-soft:#DDF2E7; --bad:#C8423D; --bad-soft:#F9E1DF; --pro:#6B3FB0; --pro-soft:#ECE4F8;
  --grid:#E3E8F0; --axis:#4A5068; --rail:#5B6278; --lens:#9CC3F0; --lens-edge:#3A6AA8; --ray1:#E8892B; --ray2:#1C66C0; --red:#E8432E;
  --room:#14161D; --display:#111111; --display-ink:#FFC94D;
  --f-display:"Lexend","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",Calibri,system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#060B26; --surface:#0E1640; --surface-2:#141D4F; --ink:#EEF1FA; --ink-soft:#A9B1D3; --line:#2B3672;
  --navy:#020722; --navy-ink:#FFFFFF; --accent:#F3A04F; --accent-ink:#1B1300; --blue:#6FA8F0; --blue-soft:#1A2A63; --on-blue:#06102E;
  --ok:#4CC48A; --ok-soft:#123A2C; --bad:#F07A73; --bad-soft:#40181C; --pro:#B89AF0; --pro-soft:#2A1E52;
  --grid:#1E2858; --axis:#AEB6D8; --rail:#8792C2; --lens:#3D6FB0; --lens-edge:#9CC3F0; --ray1:#F3A04F; --ray2:#6FA8F0; --red:#F2604D;
  --room:#05060A; --display:#000000; --display-ink:#FFC94D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060B26; --surface:#0E1640; --surface-2:#141D4F; --ink:#EEF1FA; --ink-soft:#A9B1D3; --line:#2B3672;
  --navy:#020722; --navy-ink:#FFFFFF; --accent:#F3A04F; --accent-ink:#1B1300; --blue:#6FA8F0; --blue-soft:#1A2A63; --on-blue:#06102E;
  --ok:#4CC48A; --ok-soft:#123A2C; --bad:#F07A73; --bad-soft:#40181C; --pro:#B89AF0; --pro-soft:#2A1E52;
  --grid:#1E2858; --axis:#AEB6D8; --rail:#8792C2; --lens:#3D6FB0; --lens-edge:#9CC3F0; --ray1:#F3A04F; --ray2:#6FA8F0; --red:#F2604D;
  --room:#05060A; --display:#000000; --display-ink:#FFC94D; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

header{background:var(--navy);color:var(--navy-ink);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hwrap{max-width:1360px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;flex-direction:column}
.brand b{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.2px}
.brand span{font-size:13px;color:#8DB7EE}
.route{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.stop{display:flex;align-items:center;gap:8px;border:2px solid #34428F;background:transparent;color:#fff;border-radius:999px;padding:5px 12px 5px 6px;font-size:14px;font-weight:700}
.stop .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#24317A;font-size:13px}
.stop.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stop.on .n{background:rgba(0,0,0,.18);color:var(--accent-ink)}
.stop.done .n{background:var(--ok);color:#fff}
.stop.pro{border-style:dashed;border-color:#8E74D6}
.stop.pro.on{background:#B89AF0;border-color:#B89AF0;color:#1A0F33;border-style:solid}
.stop:disabled{opacity:.45;cursor:not-allowed}
.reset{background:transparent;border:1.5px solid #34428F;color:#B9C6EE;border-radius:999px;padding:5px 10px;font-size:13px}

main{max-width:1360px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.plot{position:sticky;top:env(safe-area-inset-top,0px);padding:10px;display:flex;flex-direction:column;gap:10px}
@media (max-width:900px){.plot{position:static}}
canvas{display:block;width:100%;border-radius:10px;touch-action:none}
.views{display:grid;grid-template-columns:repeat(2,minmax(0,250px));justify-content:center;gap:14px}
.view{display:flex;flex-direction:column;gap:4px;min-width:0}
.view canvas{aspect-ratio:1/1;max-width:100%;background:var(--room)}
.view small{font-size:13px;color:var(--ink-soft);text-align:center}
.view small b{color:var(--ink)}

.side{display:flex;flex-direction:column;gap:16px;min-width:0}
h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0 0 4px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0}
.eyebrow{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--blue);font-weight:700;margin:0 0 2px}
.eyebrow.pro{color:var(--pro)}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--ink-soft);font-size:15px}

/* Steuerpult */
.ctl{display:flex;flex-direction:column;gap:6px}
.lift{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:stretch}
.disp{background:var(--display);color:var(--display-ink);font-family:var(--f-mono);border-radius:12px;padding:6px 10px;text-align:center;box-shadow:inset 0 0 0 3px #333;display:flex;flex-direction:column;justify-content:center}
.disp small{font-size:11px;letter-spacing:2px;color:#9a9a9a}
.disp span{font-size:28px;letter-spacing:1px;font-variant-numeric:tabular-nums}
.disp.g{color:#9FD0FF}
.keys{display:flex;gap:8px;align-items:center}
.key{width:56px;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);font-size:22px;font-weight:700}
.key:active{background:var(--accent);color:var(--accent-ink)}
input[type=range]{width:100%;accent-color:var(--accent);height:30px}
input[type=range].gr{accent-color:var(--blue)}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.locked{font-size:15px;color:var(--ink-soft);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.chk{display:flex;align-items:center;gap:10px;font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--blue)}
.sep{border:0;border-top:1.5px dashed var(--line);margin:8px 0}

.num{width:4.6em;text-align:center;border:2px solid var(--line);border-radius:8px;padding:5px 2px;background:var(--surface);font-variant-numeric:tabular-nums}
.num.ok{border-color:var(--ok);background:var(--ok-soft)}
.num.bad{border-color:var(--bad);background:var(--bad-soft)}
.sel{font:inherit;border:2px solid var(--line);border-radius:8px;padding:4px 4px;background:var(--surface);max-width:100%}
.sel.ok{border-color:var(--ok);background:var(--ok-soft)}
.sel.bad{border-color:var(--bad);background:var(--bad-soft)}
.btn{border:none;border-radius:999px;padding:10px 18px;font-weight:700;font-size:16px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--surface);border:1.5px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn.tip{background:transparent;border:1.5px dashed var(--blue);color:var(--blue);padding:7px 14px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.choice{display:flex;flex-direction:column;gap:8px}
.choice.grid2{display:grid;grid-template-columns:1fr 1fr}
@media (max-width:440px){.choice.grid2{grid-template-columns:1fr}}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.opt b{font-family:var(--f-display)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.gopt{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center}
.gopt .L{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-family:var(--f-display);grid-row:1/3}
.gopt span{font-size:15px}
.seg{display:inline-flex;flex-wrap:wrap;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:7px 14px;font-weight:700}
.seg button.sel{background:var(--blue);color:var(--on-blue)}
.seg button.ok{background:var(--ok);color:#fff}
.seg button.bad{background:var(--bad);color:#fff}
.fb{font-weight:700;min-height:1.4em}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.note{border-left:4px solid var(--accent);background:var(--surface-2);padding:10px 12px;border-radius:0 10px 10px 0;font-size:15px}
.hint{border:1.5px dashed var(--blue);background:var(--blue-soft);border-radius:10px;padding:10px 12px;font-size:15px}
.win{border:2px solid var(--ok);background:var(--ok-soft);border-radius:12px;padding:12px}
.guess{border:2px solid var(--pro);background:var(--pro-soft);border-radius:12px;padding:12px}
.q{display:flex;flex-direction:column;gap:6px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.q p b{font-family:var(--f-display);font-weight:600}
.gap ol{padding-left:1.2em;margin:0}
.gap li{margin-bottom:10px}
.dots{display:flex;gap:6px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:block}
.dots i.on{background:var(--ok);border-color:var(--ok)}
.merk{border:2px solid var(--blue);border-radius:12px;padding:14px;background:var(--surface)}
.merk h3{color:var(--blue);margin-bottom:6px}
.merk .k{color:var(--blue);font-weight:700}
textarea.free{width:100%;border:2px solid var(--line);border-radius:10px;padding:8px;background:var(--surface);color:var(--ink)}
.bz{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}
.badge{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-family:var(--f-display)}
.tw{overflow-x:auto}
table.mt{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:15.5px}
table.mt th,table.mt td{border:1.5px solid var(--line);padding:6px 6px;text-align:center}
table.mt th{background:var(--surface-2);font-weight:700}
table.mt th small{display:block;font-weight:400;color:var(--ink-soft);font-size:12px}
table.mt tr.cur td{background:var(--blue-soft)}
table.mt tr.done td{background:var(--ok-soft)}
table.mt tr.lock td{color:var(--ink-soft)}
table.mt td.v b{font-size:16px}
.chart{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--ink-soft);padding:0 6px 4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---- Ergebnisse abgeben ---- */
.abg-btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700}
.abg-ov{position:fixed;inset:0;background:rgba(2,8,40,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto;z-index:50}
.abg-box{background:var(--surface);color:var(--ink);border-radius:16px;max-width:560px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.abg-box h2{margin:0}
.abg-box ol{margin:0;padding-left:1.3em}
.abg-box li{margin-bottom:6px}
.abg-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.abg-in{border:2px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);color:var(--ink);font:inherit}
.abg-copy{background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;padding:12px 22px;font-weight:700;font-size:18px}
.abg-close{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:700;color:var(--ink)}
.abg-fb{font-weight:700;min-height:1.4em}
.abg-fb.ok{color:var(--ok)} .abg-fb.bad{color:var(--bad)}
.abg-txt{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;border:2px solid var(--line);border-radius:10px;padding:8px;background:var(--surface-2);color:var(--ink)}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand"><b>Linsen-Messlabor</b><span>Wovon hängen Lage und Größe des Bildes ab?</span></div>
    <nav class="route" id="route" aria-label="Stationen"></nav>
    <button class="abg-btn" id="abgBtn" type="button">Ergebnisse abgeben</button><button class="reset" id="reset" type="button">Neu starten</button>
  </div>
</header>

<main>
  <section class="card plot" aria-label="Optische Bank">
    <canvas id="cv" aria-label="Optische Bank mit Leuchte, Dia, Sammellinse und Schirm (Seitenansicht)"></canvas>
    <div class="views">
      <div class="view"><canvas id="cvDia" aria-label="Das Dia von vorne, mit Lineal"></canvas><small><b>Dia</b> (Gegenstand) mit Lineal</small></div>
      <div class="view"><canvas id="cvScr" aria-label="Was auf dem Schirm zu sehen ist, mit Lineal"></canvas><small><b>Schirm</b> mit Lineal <span id="scrScale"></span></small></div>
    </div>
  </section>

  <aside class="side">
    <section class="card" id="ctlCard">
      <p class="eyebrow">Steuerpult</p>
      <div id="ctlOn" class="ctl">
        <div class="lift">
          <div class="disp g"><small>DIA VOR DER LINSE</small><span id="dispG">30 cm</span></div>
          <div class="keys">
            <button class="key" id="gl" type="button" aria-label="Dia 1 cm näher an die Linse">◀</button>
            <button class="key" id="gr" type="button" aria-label="Dia 1 cm weiter weg">▶</button>
          </div>
        </div>
        <input type="range" class="gr" id="g" min="5" max="50" step="1" value="30" aria-label="Regler: Abstand Dia–Linse">
        <div class="scale"><span>5 cm (nah)</span><span>50 cm (weit)</span></div>
        <hr class="sep">
        <div class="lift">
          <div class="disp"><small>SCHIRM HINTER DER LINSE</small><span id="dispS">40,0 cm</span></div>
          <div class="keys">
            <button class="key" id="sl" type="button" aria-label="Schirm 0,5 cm näher an die Linse">◀</button>
            <button class="key" id="sr" type="button" aria-label="Schirm 0,5 cm weiter weg">▶</button>
          </div>
        </div>
        <input type="range" id="s" min="5" max="65" step="0.5" value="40" aria-label="Regler: Abstand Linse–Schirm">
        <div class="scale"><span>5 cm (nah)</span><span>65 cm (weit)</span></div>
        <p class="muted" id="fTxt">Die Brennweite der Linse ist <b>f = 10 cm</b>.</p>
        <label class="chk" id="raysRow"><input type="checkbox" id="tRays"> Röntgenblick: Lichtstrahlen zeigen</label>
        <label class="chk" id="lensRow" hidden><input type="checkbox" id="tLens"> Dickere Linse einsetzen (f = 5 cm)</label>
      </div>
      <p class="locked" id="ctlOff" hidden></p>
    </section>

    <section class="card stack" id="task"></section>
  </aside>
</main>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var F=10, A=3, GH=1, FR=1.5;           /* Brennweite, Linsenradius, halbe Höhe des L (G = 2 cm), halbe Dia-Größe (cm) */
var G_CM=2*GH;
var STATIONS=[
  {key:'s1',name:'Begriffe'},
  {key:'s2',name:'Messen'},
  {key:'s3',name:'Je-desto'},
  {key:'s4',name:'Merksatz'},
  {key:'s5',name:'Profi-Zusatz',pro:true}
];
var ROWS=[40,30,20,15,12];
var GUESS=[
  {k:'A',t:'Das Bild wird <b>größer</b>. Der Schirm muss <b>weiter weg</b>.'},
  {k:'B',t:'Das Bild wird <b>größer</b>. Der Schirm muss <b>näher an die Linse</b>.'},
  {k:'C',t:'Das Bild wird <b>kleiner</b>. Der Schirm muss <b>weiter weg</b>.'},
  {k:'D',t:'Am Bild ändert sich <b>nichts</b>.'}
];

var st={station:0,done:[false,false,false,false,false],s:40,g:30,rays:false,thick:false,guess:null,
  s1:{map:{},mapOk:false,G:'',gOk:false,f:null,fOk:false},
  s2:{row:0,vals:{},tip:0},
  s3:{jd:{},jdOk:false,gl:null,glOk:false,own:'',ok:false},
  s4:{gaps:{},ok:false,kino:null,kinoOk:false,refl:''},
  s5:{a:null,b:null},res:{},tries:{},t0:null};

/* ---------- Speicher (nur Bequemlichkeit) ---------- */
var KEY='linsen-messlabor-v1';
function save(){try{localStorage.setItem(KEY,JSON.stringify({station:st.station,done:st.done,guess:st.guess,s1:st.s1,s2:st.s2,s3:st.s3,s4:st.s4,s5:st.s5,res:st.res,tries:st.tries,t0:st.t0}));}catch(e){}}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||'null');if(!x)return;
  st.station=x.station||0;if(x.done)st.done=x.done;while(st.done.length<5)st.done.push(false);st.guess=x.guess||null;
  ['s1','s2','s3','s4','s5'].forEach(function(k){if(x[k])st[k]=Object.assign(st[k],x[k]);});
  if(x.res)st.res=x.res;if(x.tries)st.tries=x.tries;if(x.t0)st.t0=x.t0;}catch(e){}}

/* ---------- Versuche zählen ---------- */
var RKEY='linsen-messlabor-resets';
function tryInc(k,ok,val){var t=st.tries[k]||(st.tries[k]={n:0,ok:false,first:null});if(t.ok)return;t.n++;if(t.first===null)t.first=!!ok;if(ok)t.ok=true;else if(val!=null&&val!==''){t.w=t.w||[];if(t.w.length<12)t.w.push(val);}save();}
function fnv(str){var h=0x811c9dc5;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return ('0000000'+h.toString(16)).slice(-8);}
function resets(){try{return +(localStorage.getItem(RKEY)||0);}catch(e){return 0;}}

/* ---------- Physik ---------- */
function binv(g){return 1/F-1/g;}
function bOf(g){var v=binv(g);return v>1e-9?1/v:Infinity;}
function isSharp(g,s){var b=bOf(g);return isFinite(b)&&Math.abs(s-b)<=0.5;}
function Btrue(g){var b=bOf(g);return isFinite(b)?G_CM*b/g:Infinity;}
function fmt(v,d){var p=Math.pow(10,d||0);return String(Math.round(v*p)/p).replace('.',',');}
function fmtS(v){return (Math.round(v*2)/2).toFixed(1).replace('.',',');}
function num(t){if(t==null)return NaN;t=String(t).trim().replace(',','.').replace(/\s*cm$/i,'');return t===''?NaN:parseFloat(t);}

/* ---------- Farben & Schrift ---------- */
function col(n){return getComputedStyle(document.documentElement).getPropertyValue('--'+n).trim();}
function font(px,b){return (b?'bold ':'')+px+'px '+getComputedStyle(document.body).fontFamily;}

/* ---------- Optische Bank (Seitenansicht) ---------- */
var cv=$('cv'),ctx=cv.getContext('2d'),W=0,H=0,VS=1,AY=0;
var X0=-60,X1=69,PADL=14,PADR=14;
function X(x){return PADL+(x-X0)/(X1-X0)*(W-PADL-PADR);}
function Y(y){return AY-y*VS;}
function resize(){
  var w=cv.getBoundingClientRect().width||640;
  var h=Math.round(Math.max(260,Math.min(w*0.55,420)));
  var dpr=window.devicePixelRatio||1;
  cv.style.height=h+'px';cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);

  /* senkrechtes Lineal, 0 bei yZero (Pixel, nach unten), Teilung in mm */

    P5.map(function(p){var v=st.s5[p.id];return '<div class="q"><h3>'+p.title+'</h3><p>'+p.task+'</p><p><b>'+p.q+'</b></p><div class="choice" data-p="'+p.id+'">'+p.o.map(function(o,j){return '<button type="button" class="opt'+(v===j?(j===p.a?' ok':' bad'):'')+'" data-j="'+j+'">'+o+'</button>';}).join('')+'</div><p class="fb'+(v===p.a?' ok':(v!=null?' bad':''))+'" id="fp'+p.id+'">'+(v==null?'':(v===p.a?p.ok:p.bad))+'</p></div>';}).join('')+
    (st.done[4]?'<p class="win"><b>Profi-Level geschafft!</b> Erkläre einem Mitschüler eins der beiden Experimente.</p>':'')+resultsHTML();
  Array.prototype.forEach.call(document.querySelectorAll('.choice[data-p]'),function(box){var p=P5.filter(function(x){return x.id===box.dataset.p;})[0];

/* ---------- Ergebnisse speichern (für IServ) ---------- */
function resText(){
  var r=st.res||{},d=new Date(),L=[];
  L.push('LINSEN-MESSLABOR · Wovon hängen Lage und Größe des Bildes ab?');
  L.push('Name: '+(r.name||'')+'    Klasse: '+(r.klasse||'')+'    Datum: '+d.toLocaleDateString('de-DE')+', '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}));
  L.push('Geschafft: '+STATIONS.map(function(x,i){return x.name+(st.done[i]?' ✓':' –');}).join(' | '));
  L.push('');
  L.push('MEINE VERMUTUNG: '+(st.guess?guessName(st.guess):'keine gewählt')+(st.guess==='A'?'  → stimmt':'  → richtig ist A'));
  L.push('');
  L.push('STATION 1 · Begriffe');
  L.push('  Zuordnung der Größen: '+(st.s1.mapOk?'richtig ✓':'noch nicht gelöst'));
  L.push('  Gegenstandsgröße gemessen: G = '+(st.s1.G||'–')+' cm'+(st.s1.gOk?'  ✓':''));
  L.push('  Feste Größe der Linse: '+(st.s1.f==null?'(keine Antwort)':QF.o[st.s1.f])+(st.s1.fOk?'  ✓':''));
  L.push('');
  L.push('STATION 2 · Messtabelle (G = 2 cm)');
  L.push('  g in cm | b in cm | B in cm');
  ROWS.forEach(function(g,i){var v=st.s2.vals[i]||{};L.push('  '+g+' | '+(v.ok?fmt(v.b,1):'–')+' | '+(v.ok?fmt(v.B,1):'–'));});
  L.push('  Tipps benutzt: '+(st.s2.tip||0));
  L.push('');
  L.push('STATION 3 · Je-desto');
  if(st.s3.jdOk)JD.forEach(function(j){L.push('  '+j.pre+j.o[j.a]+j.post);});else L.push('  (Je-desto-Sätze noch nicht gelöst)');
  L.push('  Bild genauso groß wie das Dia bei: '+(st.s3.glOk?'g = 20 cm ✓':'(noch nicht beantwortet)'));
  L.push('  Mein eigener Je-desto-Satz: '+((st.s3.own||'').trim()||'(leer)'));
  L.push('');
  L.push('STATION 4 · Merksatz');
  if(st.s4.ok){var tmp=document.createElement('div');tmp.innerHTML=MERK;L.push('  '+tmp.textContent.replace('Merksatz: Lage und Größe des Bildes','Lage und Größe des Bildes: '));}
  else L.push('  (Lückentext noch nicht gelöst)');
  L.push('  Meine Begründung, warum A richtig ist: '+((st.s4.refl||'').trim()||'(leer)'));
  L.push('  Kino-AG: '+(st.s4.kino==null?'(keine Antwort)':KINO.o[st.s4.kino]+(st.s4.kino===KINO.a?'  ✓':'  ✗')));
  L.push('');
  L.push('VERSUCHE (wie oft geprüft bzw. eine Antwort gewählt wurde, bis es richtig war)');
  var TL=[['s1begr','Station 1 · Begriffe zuordnen'],['s1G','Station 1 · Dia-Größe messen'],['s1f','Station 1 · Feste Größe der Linse'],
    ['s2r1','Station 2 · Messung g = 40 cm'],['s2r2','Station 2 · Messung g = 30 cm'],['s2r3','Station 2 · Messung g = 20 cm'],['s2r4','Station 2 · Messung g = 15 cm'],['s2r5','Station 2 · Messung g = 12 cm'],
    ['s3jd','Station 3 · Je-desto-Sätze'],['s3gleich','Station 3 · Gleich groß'],['s4gaps','Station 4 · Merksatz-Lückentext'],['s4kino','Station 4 · Kino-AG'],['s5a','Profi · Dia im Brennpunkt'],['s5b','Profi · Dicke Linse']];
  var tot=0,first=0;
  TL.forEach(function(x){var t=st.tries[x[0]];if(!t){if(x[0].charAt(1)!=='5')L.push('  '+x[1]+': nicht bearbeitet');return;}if(x[0].charAt(1)!=='5'){tot++;if(t.first)first++;}
    L.push('  '+x[1]+': '+t.n+(t.n===1?' Versuch':' Versuche')+(t.ok?(t.first?'  → beim 1. Versuch richtig':'  → gelöst'):'  → noch nicht gelöst'));});
  L.push('  Beim 1. Versuch richtig: '+first+' von '+tot+' bearbeiteten Aufgaben');
  var mins0=st.t0?Math.round((Date.now()-st.t0)/60000):null;
  if(mins0!=null)L.push('  Bearbeitungszeit seit dem Start: '+mins0+' min');
  L.push('  „Neu starten“ gedrückt (auf diesem Gerät): '+resets()+'-mal');
  L.push('');
  L.push('PROFI-ZUSATZ ★');
  P5.forEach(function(x){var v=st.s5[x.id];L.push('  '+x.title+': '+(v==null?'(nicht bearbeitet)':x.o[v]+(v===x.a?'  ✓':'  ✗')));});
  var rows=ROWS.map(function(g,i){var v=st.s2.vals[i];return v&&v.ok?[g,v.b,v.B]:null;});
  var data={v:1,name:r.name||'',klasse:r.klasse||'',ts:Date.now(),done:st.done,guess:st.guess,tries:st.tries,tips:{s2:st.s2.tip||0},
    rows:rows,G:st.s1.G||'',own:st.s3.own||'',refl:st.s4.refl||'',kino:st.s4.kino,s5:st.s5,mins:mins0,resets:resets()};
  var json=JSON.stringify(data);
  L.push('');L.push('Die beiden folgenden Zeilen sind für die Auswertung. Bitte nicht verändern.');
  L.push('#DATEN '+json);L.push('#PRUEF '+fnv('LM-v1|'+json));
  return L.join('\r\n');
}
function resFile(){var r=st.res||{};var n=((r.name||'Name')+'_'+(r.klasse||'')).replace(/[^A-Za-z0-9ÄÖÜäöüß_-]+/g,'_').replace(/_+$/,'');return 'Linsen-Messlabor_'+n+'.txt';}
function resultsHTML(){var r=st.res||{};
  return '<div class="merk stack" id="resBox" style="border-color:var(--accent)"><h3 style="color:var(--ink)">Ergebnisse speichern</h3>'+
   '<p class="muted">Tragt eure Namen ein und speichert die Ergebnisse als Textdatei. Ladet die Datei danach bei <b>IServ</b> in der Aufgabe „Linsen-Messlabor“ hoch.</p>'+
   '<div class="row"><label for="resName">Name(n)</label><input class="num" style="width:13em;text-align:left;padding-inline:8px" id="resName" autocomplete="off" value="'+esc(r.name)+'">'+
   '<label for="resKlasse">Klasse</label><input class="num" style="width:5em" id="resKlasse" autocomplete="off" value="'+esc(r.klasse||'7d')+'"></div>'+
   '<div class="row"><button class="btn pri" type="button" id="resSave">Als Textdatei speichern</button><button class="btn sec" type="button" id="resCopy">Text kopieren</button><button class="btn tip" type="button" id="resShow">Text anzeigen</button></div>'+
   '<p class="fb" id="resFb"></p><textarea class="free" id="resTxt" rows="12" readonly hidden style="font-family:var(--f-mono);font-size:13px"></textarea>'+
   '<p class="muted"><b>So geht’s bei IServ:</b> Aufgaben → „Linsen-Messlabor“ öffnen → Datei hochladen → in <b>Dateien → Downloads</b> die gespeicherte Datei auswählen → Abgeben.</p></div>';}
function bindResults(){
  if(!$('resBox'))return;st.res=st.res||{};
  function upd(){st.res.name=$('resName').value.trim();st.res.klasse=$('resKlasse').value.trim();save();if(!$('resTxt').hidden)$('resTxt').value=resText();}
  $('resName').addEventListener('input',upd);$('resKlasse').addEventListener('input',upd);
  function msg(ok,t){var f=$('resFb');f.className='fb '+(ok?'ok':'bad');f.textContent=t;}
  function need(){if(!st.res.name){msg(false,'Tragt zuerst eure Namen ein.');$('resName').focus();return false;}return true;}
  $('resShow').addEventListener('click',function(){var t=$('resTxt');t.hidden=!t.hidden;if(!t.hidden)t.value=resText();this.textContent=t.hidden?'Text anzeigen':'Text ausblenden';});
  $('resCopy').addEventListener('click',function(){if(!need())return;var txt=resText(),t=$('resTxt');t.hidden=false;t.value=txt;$('resShow').textContent='Text ausblenden';
    function sel(){t.focus();t.select();msg(true,'Text markiert. Kopiere ihn mit Strg+C (Tablet: gedrückt halten → Kopieren).');}
    try{navigator.clipboard.writeText(txt).then(function(){msg(true,'Kopiert! Ihr könnt den Text jetzt bei IServ einfügen.');},sel);}catch(e){sel();}});
  $('resSave').addEventListener('click',function(){if(!need())return;var txt=resText(),name=resFile();
    function blobSave(){try{var b=new Blob(['﻿'+txt],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},4000);
      msg(true,'Datei „'+name+'“ wird gespeichert. Falls nichts passiert: „Text kopieren“ benutzen.');}catch(e){msg(false,'Speichern klappt hier nicht. Benutzt „Text kopieren“.');}}
    var c=window.claude;
    if(c&&c.use){c.use('downloads').then(function(d){if(!d){blobSave();return;}
        d.save({filename:name,data:txt}).then(function(){msg(true,'Gespeichert als „'+name+'“. Jetzt bei IServ hochladen!');},function(err){
          if(err&&err.code==='declined')msg(false,'Speichern abgebrochen. Ihr könnt es nochmal versuchen.');
          else msg(false,'Speichern klappt hier nicht. Benutzt „Text kopieren“.');});},blobSave);}
    else blobSave();});
}

/* ---------- Ergebnisse abgeben (jederzeit) ---------- */
(function(){
  var APP='Linsen-Messlabor';
  var AKEY=(typeof KEY!=='undefined'?KEY:APP)+'-abgabe';
  function lget(){try{return JSON.parse(localStorage.getItem(AKEY)||'{}')||{};}catch(e){return {};}}
  function lset(o){try{localStorage.setItem(AKEY,JSON.stringify(o));}catch(e){}}
  var A=lget();if(!A.t0){A.t0=Date.now();lset(A);}
  function e(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
  
  function abgText(A){st.res=st.res||{};st.res.name=A.name;st.res.klasse=A.klasse;try{save();}catch(err){}
    var n=0;STATIONS.forEach(function(x,i){if(st.done[i])n++;});
    return resText().replace('\r\nGeschafft: ','\r\nGeschafft ('+n+' von '+STATIONS.length+'): ');}

  var ov=document.createElement('div');ov.className='abg-ov';ov.hidden=true;
  ov.innerHTML='<div class="abg-box" role="dialog" aria-modal="true" aria-labelledby="abgH">'+
    '<h2 id="abgH">Ergebnisse abgeben</h2>'+
    '<ol><li>Tragt eure <b>Namen</b> und eure <b>Klasse</b> ein.</li>'+
    '<li>Tippt auf <b>„Datei herunterladen“</b>. Auf dem iPad fragt Safari nach: Tippt auf <b>„Laden“</b>. Die Datei liegt dann in der App <b>Dateien</b> im Ordner <b>Downloads</b>.</li>'+
    '<li>Öffnet <b>IServ → Aufgaben → „'+e(APP)+'“</b>, ladet die Datei hoch (aus <b>Dateien → Downloads</b>) und tippt auf <b>Abgeben</b>.</li></ol>'+
    '<p class="muted">Ihr könnt auch abgeben, wenn ihr noch nicht fertig seid. In der Datei steht, wie weit ihr gekommen seid.</p>'+
    '<div class="abg-row"><label for="abgName">Namen</label><input class="abg-in" id="abgName" autocomplete="off" style="width:12em">'+
    '<label for="abgKl">Klasse</label><input class="abg-in" id="abgKl" autocomplete="off" style="width:5em"></div>'+
    '<div class="abg-row"><button class="abg-copy" type="button" id="abgDl">Datei herunterladen</button>'+
    '<button class="abg-close" type="button" id="abgClose">Schließen</button></div>'+
    '<p class="muted" style="font-size:14px">Klappt das Herunterladen nicht? Dann <button type="button" id="abgCopy" style="background:none;border:none;padding:0;color:var(--blue);text-decoration:underline;font:inherit;cursor:pointer">kopiert den Text</button> und fragt eure Lehrkraft.</p>'+
    '<p class="abg-fb" id="abgFb"></p>'+
    '<textarea class="abg-txt" id="abgTxt" rows="10" readonly hidden></textarea></div>';
  document.body.appendChild(ov);
  var $n=ov.querySelector('#abgName'),$k=ov.querySelector('#abgKl'),$t=ov.querySelector('#abgTxt'),$f=ov.querySelector('#abgFb');
  function msg(ok,t){$f.className='abg-fb '+(ok?'ok':'bad');$f.textContent=t;}
  function open(){A=lget();$n.value=A.name||'';$k.value=A.klasse||'';$t.hidden=true;msg(true,'');ov.hidden=false;setTimeout(function(){($n.value?ov.querySelector('#abgDl'):$n).focus();},30);}
  function close(){ov.hidden=true;}
  function upd(){A.name=$n.value.trim();A.klasse=$k.value.trim();lset(A);}
  $n.addEventListener('input',upd);$k.addEventListener('input',upd);
  ov.querySelector('#abgClose').addEventListener('click',close);
  ov.addEventListener('click',function(ev){if(ev.target===ov)close();});
  document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&!ov.hidden)close();});
  ov.querySelector('#abgCopy').addEventListener('click',function(){
    upd();if(!A.name){msg(false,'Tragt zuerst eure Namen ein.');$n.focus();return;}
    var txt=abgText(A);$t.value=txt;
    function sel(){$t.hidden=false;$t.focus();$t.select();msg(true,'Der Text ist markiert. Tippe lange darauf und wähle „Kopieren“.');}
    try{navigator.clipboard.writeText(txt).then(function(){msg(true,'Text kopiert.');},sel);}catch(err){sel();}
  });
  ov.querySelector('#abgDl').addEventListener('click',function(){
    upd();if(!A.name){msg(false,'Tragt zuerst eure Namen ein.');$n.focus();return;}
    var txt=abgText(A).replace(/\r?\n/g,'\r\n'),name=resFile();
    try{var bl=new Blob(['\ufeff'+txt],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(bl),a=document.createElement('a');
      a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},10000);
      msg(true,'Die Datei „'+name+'“ wird heruntergeladen. Ladet sie jetzt in IServ bei der Aufgabe „'+APP+'“ hoch.');}
    catch(err){msg(false,'Herunterladen klappt hier nicht. Kopiert stattdessen den Text.');}
  });
  document.getElementById('abgBtn').addEventListener('click',open);
})();
})();
