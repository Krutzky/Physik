<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Optik-Werkstatt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout wie „Linsen-Labor“: Kopfleiste mit Stationen-Weg · links optische Bank + Dia- und Schirm-Ansicht mit Lineal (fest) · rechts Steuerpult + Stationsaufgabe. */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface-2:#F3F5FA; --ink:#0B1442; --ink-soft:#4E5677; --line:#CBD3E1;
  --navy:#020C45; --navy-ink:#FFFFFF; --accent:#E8892B; --accent-ink:#1B1300; --blue:#1C66C0; --blue-soft:#DCE8F7; --on-blue:#FFFFFF;
  --ok:#22865A; --ok-soft:#DDF2E7; --bad:#C8423D; --bad-soft:#F9E1DF; --pro:#6B3FB0; --pro-soft:#ECE4F8;
  --grid:#E3E8F0; --axis:#4A5068; --rail:#5B6278; --lens:#9CC3F0; --lens-edge:#3A6AA8; --ray1:#E8892B; --ray2:#1C66C0; --red:#E8432E;
  --room:#14161D; --display:#111111; --display-ink:#FFC94D;
  --f-display:"Lexend","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",Calibri,system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#060B26; --surface:#0E1640; --surface-2:#141D4F; --ink:#EEF1FA; --ink-soft:#A9B1D3; --line:#2B3672;
  --navy:#020722; --navy-ink:#FFFFFF; --accent:#F3A04F; --accent-ink:#1B1300; --blue:#6FA8F0; --blue-soft:#1A2A63; --on-blue:#06102E;
  --ok:#4CC48A; --ok-soft:#123A2C; --bad:#F07A73; --bad-soft:#40181C; --pro:#B89AF0; --pro-soft:#2A1E52;
  --grid:#1E2858; --axis:#AEB6D8; --rail:#8792C2; --lens:#3D6FB0; --lens-edge:#9CC3F0; --ray1:#F3A04F; --ray2:#6FA8F0; --red:#F2604D;
  --room:#05060A; --display:#000000; --display-ink:#FFC94D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060B26; --surface:#0E1640; --surface-2:#141D4F; --ink:#EEF1FA; --ink-soft:#A9B1D3; --line:#2B3672;
  --navy:#020722; --navy-ink:#FFFFFF; --accent:#F3A04F; --accent-ink:#1B1300; --blue:#6FA8F0; --blue-soft:#1A2A63; --on-blue:#06102E;
  --ok:#4CC48A; --ok-soft:#123A2C; --bad:#F07A73; --bad-soft:#40181C; --pro:#B89AF0; --pro-soft:#2A1E52;
  --grid:#1E2858; --axis:#AEB6D8; --rail:#8792C2; --lens:#3D6FB0; --lens-edge:#9CC3F0; --ray1:#F3A04F; --ray2:#6FA8F0; --red:#F2604D;
  --room:#05060A; --display:#000000; --display-ink:#FFC94D; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

header{background:var(--navy);color:var(--navy-ink);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hwrap{max-width:1360px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;flex-direction:column}
.brand b{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.2px}
.brand span{font-size:13px;color:#8DB7EE}
.route{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.stop{display:flex;align-items:center;gap:8px;border:2px solid #34428F;background:transparent;color:#fff;border-radius:999px;padding:5px 12px 5px 6px;font-size:14px;font-weight:700}
.stop .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#24317A;font-size:13px}
.stop.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stop.on .n{background:rgba(0,0,0,.18);color:var(--accent-ink)}
.stop.done .n{background:var(--ok);color:#fff}
.stop.pro{border-style:dashed;border-color:#8E74D6}
.stop.pro.on{background:#B89AF0;border-color:#B89AF0;color:#1A0F33;border-style:solid}
.stop:disabled{opacity:.45;cursor:not-allowed}
.reset{background:transparent;border:1.5px solid #34428F;color:#B9C6EE;border-radius:999px;padding:5px 10px;font-size:13px}

main{max-width:1360px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.plot{position:sticky;top:env(safe-area-inset-top,0px);padding:10px;display:flex;flex-direction:column;gap:10px}
@media (max-width:900px){.plot{position:static}}
canvas{display:block;width:100%;border-radius:10px;touch-action:none}
.views{display:grid;grid-template-columns:repeat(2,minmax(0,250px));justify-content:center;gap:14px}
.view{display:flex;flex-direction:column;gap:4px;min-width:0}
.view canvas{aspect-ratio:1/1;max-width:100%;background:var(--room)}
.view small{font-size:13px;color:var(--ink-soft);text-align:center}
.view small b{color:var(--ink)}

.side{display:flex;flex-direction:column;gap:16px;min-width:0}
h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0 0 4px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0}
.eyebrow{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--blue);font-weight:700;margin:0 0 2px}
.eyebrow.pro{color:var(--pro)}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--ink-soft);font-size:15px}

/* Steuerpult */
.ctl{display:flex;flex-direction:column;gap:6px}
.lift{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:stretch}
.disp{background:var(--display);color:var(--display-ink);font-family:var(--f-mono);border-radius:12px;padding:6px 10px;text-align:center;box-shadow:inset 0 0 0 3px #333;display:flex;flex-direction:column;justify-content:center}
.disp small{font-size:11px;letter-spacing:2px;color:#9a9a9a}
.disp span{font-size:28px;letter-spacing:1px;font-variant-numeric:tabular-nums}
.disp.g{color:#9FD0FF}
.keys{display:flex;gap:8px;align-items:center}
.key{width:56px;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);font-size:22px;font-weight:700}
.key:active{background:var(--accent);color:var(--accent-ink)}
input[type=range]{width:100%;accent-color:var(--accent);height:30px}
input[type=range].gr{accent-color:var(--blue)}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.locked{font-size:15px;color:var(--ink-soft);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.chk{display:flex;align-items:center;gap:10px;font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--blue)}
.sep{border:0;border-top:1.5px dashed var(--line);margin:8px 0}

.num{width:4.6em;text-align:center;border:2px solid var(--line);border-radius:8px;padding:5px 2px;background:var(--surface);font-variant-numeric:tabular-nums}
.num.ok{border-color:var(--ok);background:var(--ok-soft)}
.num.bad{border-color:var(--bad);background:var(--bad-soft)}
.sel{font:inherit;border:2px solid var(--line);border-radius:8px;padding:4px 4px;background:var(--surface);max-width:100%}
.sel.ok{border-color:var(--ok);background:var(--ok-soft)}
.sel.bad{border-color:var(--bad);background:var(--bad-soft)}
.btn{border:none;border-radius:999px;padding:10px 18px;font-weight:700;font-size:16px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--surface);border:1.5px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn.tip{background:transparent;border:1.5px dashed var(--blue);color:var(--blue);padding:7px 14px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.choice{display:flex;flex-direction:column;gap:8px}
.choice.grid2{display:grid;grid-template-columns:1fr 1fr}
@media (max-width:440px){.choice.grid2{grid-template-columns:1fr}}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.opt b{font-family:var(--f-display)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.gopt{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center}
.gopt .L{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-family:var(--f-display);grid-row:1/3}
.gopt span{font-size:15px}
.seg{display:inline-flex;flex-wrap:wrap;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:7px 14px;font-weight:700}
.seg button.sel{background:var(--blue);color:var(--on-blue)}
.seg button.ok{background:var(--ok);color:#fff}
.seg button.bad{background:var(--bad);color:#fff}
.fb{font-weight:700;min-height:1.4em}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.note{border-left:4px solid var(--accent);background:var(--surface-2);padding:10px 12px;border-radius:0 10px 10px 0;font-size:15px}
.hint{border:1.5px dashed var(--blue);background:var(--blue-soft);border-radius:10px;padding:10px 12px;font-size:15px}
.win{border:2px solid var(--ok);background:var(--ok-soft);border-radius:12px;padding:12px}
.guess{border:2px solid var(--pro);background:var(--pro-soft);border-radius:12px;padding:12px}
.q{display:flex;flex-direction:column;gap:6px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.q p b{font-family:var(--f-display);font-weight:600}
.gap ol{padding-left:1.2em;margin:0}
.gap li{margin-bottom:10px}
.dots{display:flex;gap:6px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:block}
.dots i.on{background:var(--ok);border-color:var(--ok)}
.merk{border:2px solid var(--blue);border-radius:12px;padding:14px;background:var(--surface)}
.merk h3{color:var(--blue);margin-bottom:6px}
.merk .k{color:var(--blue);font-weight:700}
textarea.free{width:100%;border:2px solid var(--line);border-radius:10px;padding:8px;background:var(--surface);color:var(--ink)}
.bz{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}
.badge{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-family:var(--f-display)}
.tw{overflow-x:auto}
table.mt{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:15.5px}
table.mt th,table.mt td{border:1.5px solid var(--line);padding:6px 6px;text-align:center}
table.mt th{background:var(--surface-2);font-weight:700}
table.mt th small{display:block;font-weight:400;color:var(--ink-soft);font-size:12px}
table.mt tr.cur td{background:var(--blue-soft)}
table.mt tr.done td{background:var(--ok-soft)}
table.mt tr.lock td{color:var(--ink-soft)}
table.mt td.v b{font-size:16px}
.chart{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--ink-soft);padding:0 6px 4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---- Ergebnisse abgeben ---- */
.abg-btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700}
.abg-ov{position:fixed;inset:0;background:rgba(2,8,40,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto;z-index:50}
.abg-box{background:var(--surface);color:var(--ink);border-radius:16px;max-width:560px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.abg-box h2{margin:0}
.abg-box ol{margin:0;padding-left:1.3em}
.abg-box li{margin-bottom:6px}
.abg-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.abg-in{border:2px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);color:var(--ink);font:inherit}
.abg-copy{background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;padding:12px 22px;font-weight:700;font-size:18px}
.abg-close{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:700;color:var(--ink)}
.abg-fb{font-weight:700;min-height:1.4em}
.abg-fb.ok{color:var(--ok)} .abg-fb.bad{color:var(--bad)}
.abg-txt{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;border:2px solid var(--line);border-radius:10px;padding:8px;background:var(--surface-2);color:var(--ink)}
</style>
<style>
.ctlrow{display:flex;flex-direction:column;gap:4px}
.ctlrow > span{font-size:13px;color:var(--ink-soft);font-weight:700;letter-spacing:.5px}
.seg.full{display:flex}
.seg.full button{flex:1}
.status{font-weight:700;border-radius:10px;padding:8px 12px;font-size:15px;text-align:center}
.status.ok{background:var(--ok-soft);color:var(--ok)} .status.bad{background:var(--bad-soft);color:var(--bad)} .status.info{background:var(--surface-2);color:var(--ink-soft)}
.patient{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2)}
.patient .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-family:var(--f-display);color:#fff;grid-row:1/3}
.pic{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.pic svg{width:100%;max-width:84px;height:auto}
.choice.grid4{display:grid;grid-template-columns:repeat(4,1fr)}
@media (max-width:440px){.choice.grid4{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand"><b>Optik-Werkstatt</b><span>Wie helfen uns Linsen beim Sehen?</span></div>
    <nav class="route" id="route" aria-label="Stationen"></nav>
    <button class="abg-btn" id="abgBtn" type="button">Ergebnisse abgeben</button><button class="reset" id="reset" type="button">Neu starten</button>
  </div>
</header>

<main>
  <section class="card plot" aria-label="Modell">
    <canvas id="cv" aria-label="Modell: Lupe oder Auge (Seitenansicht)"></canvas>
    <div class="views">
      <div class="view"><canvas id="cvA"></canvas><small id="capA"></small></div>
      <div class="view"><canvas id="cvB"></canvas><small id="capB"></small></div>
    </div>
  </section>

  <aside class="side">
    <section class="card" id="ctlCard">
      <p class="eyebrow">Steuerpult</p>
      <div id="ctl" class="ctl"></div>
    </section>
    <section class="card stack" id="task"></section>
  </aside>
</main>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var F=10, AL=4, GH=2;  /* Lupe: Brennweite, Linsenradius, Höhe des Gegenstands (cm) */
var STATIONS=[
  {key:'s1',name:'Lupe',scene:'lupe'},
  {key:'s2',name:'Auge',scene:'eye'},
  {key:'s3',name:'Brillen',scene:'glass'},
  {key:'s4',name:'Merksatz',scene:'glass'},
  {key:'s5',name:'Profi-Zusatz',pro:true,scene:'lupe'}
];
/* Augen: Länge Linse–Netzhaut L, Brennweiten-Bereich der Augenlinse (cm, Modell nicht maßstäblich) */
var EYES={
  normal:{name:'normales Auge',L:2.3,fmin:2.06,fmax:2.36},
  lena:{name:'Lena',L:2.45,fmin:2.08,fmax:2.30,col:'#1C66C0',ini:'L',txt:'Lena (13): „Die Tafel ist total verschwommen. Mein Handy sehe ich scharf.“'},
  becker:{name:'Herr Becker',L:2.2,fmin:2.12,fmax:2.30,col:'#B05A12',ini:'B',txt:'Herr Becker (68): „Die Zeitung verschwimmt. Straßenschilder sehe ich scharf.“'}
};
var OBJ={far:{g:600,t:'Tafel',d:'6 m'},near:{g:25,t:'Buch',d:'25 cm'}};
var GL={none:{D:0,t:'keine Brille'},plus:{D:3,t:'Sammellinse'},minus:{D:-3,t:'Zerstreuungslinse'}};

var st={station:0,done:[false,false,false,false,false],guess:null,
  g:5,rays:false,screen:false, w:0,obj:'far', pat:'lena',glass:'none',
  s1:{real:{},realOk:false,kreuz:{},kreuzOk:false,virt:null,virtOk:false,own:'',ok:false},
  s2:{map:{},mapOk:false,schirm:null,schirmOk:false,fern:false,nah:false,tip:0,akk:null,akkOk:false,bild:null,bildOk:false},
  s3:{lena:null,lenaB:null,beck:null,beckB:null,names:{},namesOk:false,tip:0},
  s4:{gaps:{},ok:false,refl:'',tom:null,tomOk:false},
  s5:{a:null,b:null},res:{},tries:{},help:{},t0:null};

/* ---------- Speicher ---------- */
var KEY='optik-werkstatt-v1';
function save(){try{localStorage.setItem(KEY,JSON.stringify({station:st.station,done:st.done,guess:st.guess,s1:st.s1,s2:st.s2,s3:st.s3,s4:st.s4,s5:st.s5,res:st.res,tries:st.tries,help:st.help,t0:st.t0}));}catch(e){}}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||'null');if(!x)return;
  st.station=x.station||0;if(x.done)st.done=x.done;while(st.done.length<5)st.done.push(false);st.guess=x.guess||null;
  ['s1','s2','s3','s4','s5'].forEach(function(k){if(x[k])st[k]=Object.assign(st[k],x[k]);});
  if(x.res)st.res=x.res;if(x.tries)st.tries=x.tries;if(x.help)st.help=x.help;if(x.t0)st.t0=x.t0;}catch(e){}}
var RKEY='optik-werkstatt-resets';
function tryInc(k,ok,val){var t=st.tries[k]||(st.tries[k]={n:0,ok:false,first:null});if(t.ok)return;t.n++;if(t.first===null)t.first=!!ok;if(ok)t.ok=true;else if(val!=null&&val!==''){t.w=t.w||[];if(t.w.length<12)t.w.push(val);}save();}
/* Hilfe: nach 3 Fehlversuchen kann die Lösung angezeigt werden */
function stuck(k){var t=st.tries[k];return !!(t&&!t.ok&&t.n>=3);}
function showHelp(fb,k,fn){if(!fb||!stuck(k))return;var id='hb_'+k;if(document.getElementById(id))return;var b=document.createElement('button');b.type='button';b.id=id;b.className='btn tip';b.style.marginTop='6px';b.textContent='Ich komme nicht weiter: Lösung zeigen';
  b.addEventListener('click',function(){st.help[k]=true;save();fn();});var wrap=document.createElement('div');wrap.className='row';wrap.appendChild(b);(fb.parentNode.classList&&fb.parentNode.classList.contains('row')?fb.parentNode:fb).insertAdjacentElement('afterend',wrap);}
function helpMsg(id,t){var f=$(id);if(f){f.className='fb ok';f.textContent=t;}}
function fnv(str){var h=0x811c9dc5;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return ('0000000'+h.toString(16)).slice(-8);}
function resets(){try{return +(localStorage.getItem(RKEY)||0);}catch(e){return 0;}}

/* ---------- Physik ---------- */
function lupeB(g){var v=1/F-1/g;return Math.abs(v)<1e-9?Infinity:1/v;}           /* b<0: virtuelles Bild */
function eyeF(){var E=EYES.normal;return E.fmax-(E.fmax-E.fmin)*st.w/100;}
function eyeState(){ /* liefert {E,g,D,f,b,rel} */
  var sc=STATIONS[st.station].scene,E,D=0,f;
  var g=OBJ[st.obj].g;
  if(sc==='eye'){E=EYES.normal;f=eyeF();}
  else{E=EYES[st.pat];D=GL[st.glass].D;var need=1/(1/E.L+1/g-D/100);f=Math.max(E.fmin,Math.min(E.fmax,need));}
  var b=1/(1/f+D/100-1/g);
  return {E:E,g:g,D:D,f:f,b:b,rel:1-E.L/b};
}
function eyeSharp(es){return Math.abs(es.rel)<0.006;}
function fmt(v,d){var p=Math.pow(10,d||0);return String(Math.round(v*p)/p).replace('.',',');}

/* ---------- Zeichnen: Grundlagen ---------- */
function col(n){return getComputedStyle(document.documentElement).getPropertyValue('--'+n).trim();}
function font(px,b){return (b?'bold ':'')+px+'px '+getComputedStyle(document.body).fontFamily;}
var cv=$('cv'),ctx=cv.getContext('2d'),W=0,H=0;
function line(x1,y1,x2,y2,c,w,dash,alpha){ctx.save();ctx.globalAlpha=alpha==null?1:alpha;ctx.strokeStyle=c;ctx.lineWidth=w||2;ctx.setLineDash(dash||[]);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();}
function dotPx(x,y,c,r){ctx.beginPath();ctx.arc(x,y,r||5,0,Math.PI*2);ctx.fillStyle=c;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=col('surface');ctx.stroke();}
function tag(t,x,y,c,align){ctx.font=font(13,true);ctx.textBaseline='middle';ctx.textAlign=align||'center';var w=ctx.measureText(t).width,x0=align==='left'?x:align==='right'?x-w:x-w/2;
  ctx.fillStyle=col('surface');ctx.globalAlpha=.92;ctx.fillRect(x0-4,y-10,w+8,20);ctx.globalAlpha=1;ctx.fillStyle=c;ctx.fillText(t,x,y);}
function badge(n,x,y){ctx.beginPath();ctx.arc(x,y,12,0,Math.PI*2);ctx.fillStyle=col('ink');ctx.fill();ctx.fillStyle=col('surface');ctx.font=font(14,true);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(n),x,y+1);}
function arrow(x1,y1,x2,y2,c,w,dash){line(x1,y1,x2,y2,c,w,dash);var a=Math.atan2(y2-y1,x2-x1),s=10;ctx.save();ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-s*Math.cos(a-0.45),y2-s*Math.sin(a-0.45));ctx.lineTo(x2-s*Math.cos(a+0.45),y2-s*Math.sin(a+0.45));ctx.closePath();ctx.fill();ctx.restore();}
function resize(){
  var w=cv.getBoundingClientRect().width||640,h=Math.round(Math.max(260,Math.min(w*0.56,420))),dpr=window.devicePixelRatio||1;
  cv.style.height=h+'px';cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);W=w;H=h;
  sizeView($('cvA'));sizeView($('cvB'));draw();
}
function draw(){if(!W)return;var sc=STATIONS[st.station].scene;ctx.fillStyle=col('surface');ctx.fillRect(0,0,W,H);if(sc==='lupe')drawLupe();else drawEye(sc);}

/* ---------- Szene Lupe ---------- */
var LX0=-40,LX1=42,LVS=1,LAY=0;
function LX(x){return 14+(x-LX0)/(LX1-LX0)*(W-28);}
function LY(y){return LAY-y*LVS;}
function drawLupe(){
  LVS=(H-70)/18;LAY=36+9*LVS;var g=st.g,b=lupeB(g),yi=isFinite(b)?GH*(-b/g):Infinity;
  line(LX(LX0+1),LAY,LX(LX1-1),LAY,col('axis'),1.2,[6,6],.7);
  [-F,F].forEach(function(fx){dotPx(LX(fx),LAY,col('axis'),3.5);ctx.fillStyle=col('axis');ctx.font=font(13,true);ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText('F',LX(fx),LAY+6);});
  /* Linse */
  var hw=Math.max(6,W*0.012),top=LY(AL),bot=LY(-AL),cx=LX(0);
  ctx.beginPath();ctx.moveTo(cx,top);ctx.quadraticCurveTo(cx+hw*2,LAY,cx,bot);ctx.quadraticCurveTo(cx-hw*2,LAY,cx,top);ctx.closePath();
  ctx.fillStyle=col('lens');ctx.globalAlpha=.75;ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle=col('lens-edge');ctx.lineWidth=2;ctx.stroke();
  ctx.font=font(12,true);ctx.fillStyle=col('ink');ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText('Lupe (Sammellinse)',cx,bot+6);
  /* Auge */
  var ex=LX(LX1-4);ctx.save();ctx.beginPath();ctx.ellipse(ex,LAY,16,11,0,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle=col('ink');ctx.lineWidth=2;ctx.stroke();
  ctx.beginPath();ctx.arc(ex-5,LAY,6,0,Math.PI*2);ctx.fillStyle='#3A6AA8';ctx.fill();ctx.beginPath();ctx.arc(ex-6,LAY,2.5,0,Math.PI*2);ctx.fillStyle='#111';ctx.fill();ctx.restore();
  ctx.font=font(12,true);ctx.fillStyle=col('ink-soft');ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText('Auge',ex,LAY+16);
  /* Schirm */
  if(st.screen){var sx=LX(20);ctx.fillStyle=col('surface-2');ctx.strokeStyle=col('axis');ctx.lineWidth=1.5;ctx.fillRect(sx,LY(6),7,12*LVS);ctx.strokeRect(sx,LY(6),7,12*LVS);
    var sharp=isFinite(b)&&b>0&&Math.abs(b-20)<1.2;ctx.save();ctx.globalAlpha=sharp?1:.35;ctx.fillStyle='#FFC94D';var hh=sharp?Math.abs(yi):5;ctx.fillRect(sx-4,LY(Math.min(6,hh)),5,Math.min(12,2*hh)*LVS);ctx.restore();
    tag(sharp?'Bild auf dem Schirm':'nur heller Fleck, kein Bild',sx+12,LY(6)-12,sharp?col('ok'):col('bad'),'left');}
  /* Gegenstand */
  arrow(LX(-g),LAY,LX(-g),LY(GH),col('red'),4);
  ctx.font=font(12,true);ctx.fillStyle=col('red');ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText('Gegenstand',LX(-g),LAY+20);
  /* Abstände */
  var dy=LY(-6.5);if(LX(0)-LX(-g)>40){line(LX(-g),dy,LX(0),dy,col('blue'),1.4);line(LX(-g),dy-5,LX(-g),dy+5,col('blue'),1.4);line(LX(0),dy-5,LX(0),dy+5,col('blue'),1.4);tag('g = '+fmt(g,1)+' cm',(LX(-g)+LX(0))/2,dy,col('blue'));}
  /* Strahlen */
  if(st.rays){
    var c=col('ray1'),tip=[-g,GH];
    function clipTo(x0,y0,dx,dy2,xmax){var t=(xmax-x0)/dx;var y=y0+dy2*t;if(Math.abs(y)>8.8){t=(Math.sign(y)*8.8-y0)/dy2;}return [x0+dx*t,y0+dy2*t];}
    /* Parallelstrahl */
    line(LX(tip[0]),LY(GH),LX(0),LY(GH),c,2);var e1=clipTo(0,GH,F,-GH,LX1-6);line(LX(0),LY(GH),LX(e1[0]),LY(e1[1]),c,2);
    /* Mittelpunktstrahl */
    var e2=clipTo(-g,GH,g,-GH,LX1-6);line(LX(-g),LY(GH),LX(e2[0]),LY(e2[1]),c,2);
    if(isFinite(b)&&b<0){ /* virtuell: Rückverlängerung */
      var bx=Math.max(b,LX0+1),k1=(bx-0)/F,k2=(bx+g)/g;
      line(LX(0),LY(GH),LX(bx),LY(GH-GH*k1),col('pro'),2,[6,5]);
      line(LX(-g),LY(GH),LX(bx),LY(GH-GH*k2),col('pro'),2,[6,5]);
      if(b>LX0+1){var yy=Math.min(yi,8.8);arrow(LX(b),LAY,LX(b),LY(yy),col('pro'),4,[7,5]);tag('virtuelles Bild',LX(b),LY(Math.min(yy,8))-12,col('pro'));}
      else tag('virtuelles Bild weit links →',LX(LX0+2)+6,LY(8),col('pro'),'left');
    } else if(isFinite(b)&&b>0){
      if(b<LX1-6){var y2=Math.max(yi,-8.8);arrow(LX(b),LAY,LX(b),LY(y2),col('red'),4);tag('reelles Bild',LX(b),LY(y2)+14,col('red'));}
      else tag('reelles Bild weit rechts',LX(LX1-8),LY(-8),col('red'),'right');
    } else tag('Strahlen laufen parallel: kein Bild',LX(10),LY(7.5),col('bad'));
  }
  renderLupeViews(g,b);
}

/* ---------- Szene Auge ---------- */
var S=1,EX=0,EAY=0;
function E2X(x){return EX+x*S;}function E2Y(y){return EAY-y*S;}
function drawEye(sc){
  var es=eyeState(),E=es.E,L=E.L;
  S=Math.min((W*0.40)/3.2,(H-60)/3.2);EX=W*0.56;EAY=H/2-4;
  /* Augapfel */
  var cxE=(L-0.5)/2,rx=(L+0.5)/2,ry=1.3;
  ctx.save();ctx.beginPath();ctx.ellipse(E2X(cxE),EAY,rx*S,ry*S,0,0,Math.PI*2);ctx.fillStyle=col('surface-2');ctx.fill();ctx.strokeStyle=col('axis');ctx.lineWidth=2;ctx.stroke();ctx.restore();
  /* Netzhaut */
  ctx.save();ctx.beginPath();ctx.ellipse(E2X(cxE),EAY,rx*S,ry*S,0,-0.95,0.95);ctx.strokeStyle='#D9534F';ctx.lineWidth=6;ctx.stroke();ctx.restore();
  /* Sehnerv */
  ctx.fillStyle='#E9B949';ctx.fillRect(E2X(L)-2,EAY+0.15*S,0.9*S,0.32*S);
  /* Hornhaut */
  ctx.save();ctx.beginPath();ctx.ellipse(E2X(-0.38),EAY,0.28*S,0.85*S,0,Math.PI/2,Math.PI*1.5);ctx.strokeStyle='#7FB3E6';ctx.lineWidth=3;ctx.stroke();ctx.restore();
  /* Iris */
  ctx.fillStyle='#3A6AA8';ctx.fillRect(E2X(-0.12),E2Y(1.0),0.1*S,0.55*S);ctx.fillRect(E2X(-0.12),E2Y(-0.45),0.1*S,0.55*S);
  /* Augenlinse: Dicke nach Brennweite */
  var tt=0.10+0.20*Math.max(0,Math.min(1,(2.36-es.f)/0.30));
  ctx.beginPath();ctx.ellipse(E2X(0.12),EAY,tt*S,0.48*S,0,0,Math.PI*2);ctx.fillStyle=col('lens');ctx.globalAlpha=.85;ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle=col('lens-edge');ctx.lineWidth=2;ctx.stroke();
  line(W*0.02,EAY,E2X(L+0.9),EAY,col('axis'),1,[5,6],.5);
  /* Gegenstand (nicht maßstäblich) */
  var far=st.obj==='far',ox=far?W*0.05:W*0.24,oh=far?0.55*S:0.45*S;
  arrow(ox,EAY,ox,EAY-oh,col('red'),4);
  ctx.font=font(12,true);ctx.fillStyle=col('ink');ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(OBJ[st.obj].t+' ('+OBJ[st.obj].d+')',ox,EAY+8);
  if(far){ctx.fillStyle=col('ink-soft');ctx.font=font(16,true);ctx.fillText('≈',(ox+E2X(-1.6))/2,EAY-8);}
  /* Brille */
  var gx=-1.05;
  if(sc==='glass'&&st.glass!=='none'){var gpx=E2X(gx),gh=0.75*S,bw=st.glass==='plus'?0.16*S:0.05*S;ctx.save();ctx.beginPath();
    if(st.glass==='plus'){ctx.moveTo(gpx,EAY-gh);ctx.quadraticCurveTo(gpx+bw*2.2,EAY,gpx,EAY+gh);ctx.quadraticCurveTo(gpx-bw*2.2,EAY,gpx,EAY-gh);}
    else{ctx.moveTo(gpx-0.12*S,EAY-gh);ctx.lineTo(gpx+0.12*S,EAY-gh);ctx.quadraticCurveTo(gpx+0.02*S,EAY,gpx+0.12*S,EAY+gh);ctx.lineTo(gpx-0.12*S,EAY+gh);ctx.quadraticCurveTo(gpx-0.02*S,EAY,gpx-0.12*S,EAY-gh);}
    ctx.closePath();ctx.fillStyle='#CFE3F7';ctx.fill();ctx.strokeStyle='#5E7FA8';ctx.lineWidth=2;ctx.stroke();ctx.restore();
    ctx.font=font(12,true);ctx.fillStyle=col('ink-soft');ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText('Brille',gpx,EAY-gh-4);}
  /* Strahlen (ab Linse physikalisch, Abweichung zur Netzhaut 3-fach überzeichnet) */
  var bd=L+(es.b-L)*3,yi=far?-0.22:-0.32,c=col('ray1'),tipX=ox,tipY=EAY-oh;
  [-0.32,0,0.32].forEach(function(h){
    var lx=E2X(0.12),ly=E2Y(h*0.9+(far?0.08:0.1));
    if(sc==='glass'&&st.glass!=='none'){var gpx2=E2X(gx),gy=E2Y(h*1.25+(far?0.1:0.14));line(tipX,tipY,gpx2,gy,c,1.8);line(gpx2,gy,lx,ly,c,1.8);}
    else line(tipX,tipY,lx,ly,c,1.8);
    var ix=E2X(bd),iy=E2Y(yi),rx2=E2X(L);
    if(bd<=L){line(lx,ly,ix,iy,c,1.8);var t=(rx2-lx)/(ix-lx);line(ix,iy,lx+(ix-lx)*t,ly+(iy-ly)*t,c,1.8);}
    else{var t2=(rx2-lx)/(ix-lx);var px=lx+(ix-lx)*t2,py=ly+(iy-ly)*t2;line(lx,ly,px,py,c,1.8);line(px,py,ix,iy,c,1.6,[4,4],.8);}
  });
  var sharp=eyeSharp(es);
  dotPx(E2X(bd),E2Y(yi),sharp?col('ok'):col('ray1'),5);
  var msg=sharp?'Bild scharf auf der Netzhaut ✓':(es.b<L?'Bild entsteht VOR der Netzhaut':'Bild entsteht HINTER der Netzhaut');
  tag(msg,W/2,22,sharp?col('ok'):col('bad'));
  ctx.font=font(11);ctx.fillStyle=col('ink-soft');ctx.textAlign='right';ctx.textBaseline='bottom';ctx.fillText('Modell, nicht maßstäblich',W-8,H-6);
  /* Teile nummerieren (Station 2) */
  if(STATIONS[st.station].key==='s2'&&!st.s2.mapOk){
    badge(1,E2X(L)+16,E2Y(0.95));badge(2,E2X(0.12),E2Y(-0.75));badge(3,E2X(L+0.75),E2Y(-0.75));badge(4,E2X(-0.55),E2Y(1.05));badge(5,E2X(-0.07),E2Y(1.25));
  } else if(STATIONS[st.station].key==='s2'){
    tag('Netzhaut',E2X(L)+10,E2Y(1.05),col('ink'),'left');tag('Augenlinse',E2X(0.12),E2Y(-0.8),col('ink'));
  }
  renderEyeViews(es,sc);
}

/* ---------- Ansichten ---------- */
function sizeView(c){var w=c.getBoundingClientRect().width||220,dpr=window.devicePixelRatio||1;c.width=Math.round(w*dpr);c.height=Math.round(w*dpr);c._dpr=dpr;}
function lShape(c2){c2.fillStyle='#E8432E';c2.fillRect(-0.62,-1,0.42,2);c2.fillRect(-0.62,-1,1.24,0.42);}
function paper(x,w,colr){x.setTransform(1,0,0,1,0,0);x.fillStyle=colr||'#FFF3D6';x.fillRect(0,0,w,w);}
function drawL(c,scale,rot,blur,bg,bright){
  var x=c.getContext('2d'),w=c.width,ppc=w/6;paper(x,w,bg);
  x.save();if(blur>0.3&&'filter' in x)x.filter='blur('+(blur*(c._dpr||1)).toFixed(1)+'px)';
  x.globalAlpha=bright==null?1:bright;x.setTransform(ppc*scale*(rot?-1:1),0,0,-ppc*scale*(rot?-1:1),w/2,w/2);lShape(x);x.restore();x.filter='none';
}
function renderLupeViews(g,b){
  $('capA').innerHTML='<b>Gegenstand</b> ohne Lupe';$('capB').innerHTML='<b>Blick durch die Lupe</b>';
  drawL($('cvA'),1,false,0);
  var c=$('cvB');
  if(Math.abs(g-F)<0.6){drawL(c,8,false,14);return;}
  if(g<F){var m=Math.min(9,F/(F-g));drawL(c,m,false,0);}
  else{var m2=Math.min(9,F/(g-F));drawL(c,m2,true,Math.abs(g-F)<2?6:0);}
  var x=c.getContext('2d');x.setTransform(1,0,0,1,0,0);x.strokeStyle='rgba(58,106,168,.6)';x.lineWidth=6*(c._dpr||1);x.beginPath();x.arc(c.width/2,c.width/2,c.width*0.47,0,Math.PI*2);x.stroke();
}
function renderEyeViews(es,sc){
  var who=sc==='glass'?EYES[st.pat].name:'die Person';
  $('capA').innerHTML='<b>Bild auf der Netzhaut</b>';$('capB').innerHTML='<b>So sieht es '+(sc==='glass'?esc(who):'die Person')+'</b>';
  var bl=Math.min(18,Math.abs(es.rel)*260);
  drawL($('cvA'),0.75,true,bl*0.6,'#3a1f22',1);
  drawL($('cvB'),1.6,false,bl,'#FFF3D6',1);
}

/* ---------- Steuerpult ---------- */
function segHTML(id,opts,cur){return '<span class="seg full" id="'+id+'">'+opts.map(function(o){return '<button type="button" data-v="'+o[0]+'" class="'+(o[0]===cur?'sel':'')+'">'+o[1]+'</button>';}).join('')+'</span>';}
function bindSeg(id,fn){var el=$(id);if(!el)return;Array.prototype.forEach.call(el.children,function(b){b.addEventListener('click',function(){Array.prototype.forEach.call(el.children,function(x){x.className=x===b?'sel':'';});fn(b.dataset.v);});});}
function renderCtl(){
  var sc=STATIONS[st.station].scene,h='';
  if(sc==='lupe'){
    h='<div class="lift"><div class="disp g"><small>GEGENSTAND VOR DER LUPE</small><span id="dispG">'+fmt(st.g,1)+' cm</span></div><div class="keys"><button class="key" id="gl" type="button" aria-label="0,5 cm näher">◀</button><button class="key" id="gr" type="button" aria-label="0,5 cm weiter weg">▶</button></div></div>'+
      '<input type="range" class="gr" id="gS" min="2" max="25" step="0.5" value="'+st.g+'" aria-label="Abstand Gegenstand–Lupe"><div class="scale"><span>2 cm</span><span>25 cm</span></div>'+
      '<p class="muted">Brennweite der Lupe: <b>f = 10 cm</b></p>'+
      '<label class="chk"><input type="checkbox" id="tRays"'+(st.rays?' checked':'')+'> Röntgenblick: Lichtstrahlen zeigen</label>'+
      '<label class="chk"><input type="checkbox" id="tScr"'+(st.screen?' checked':'')+'> Schirm hinter die Lupe stellen</label>';
  } else if(sc==='eye'){
    var es=eyeState();
    h='<div class="ctlrow"><span>WAS SCHAUT DAS AUGE AN?</span>'+segHTML('sObj',[['far','Tafel (6 m)'],['near','Buch (25 cm)']],st.obj)+'</div>'+
      '<div class="lift"><div class="disp"><small>AUGENLINSE GEWÖLBT</small><span id="dispW">'+st.w+' %</span></div><div class="keys"><button class="key" id="wl" type="button" aria-label="flacher">◀</button><button class="key" id="wr" type="button" aria-label="dicker">▶</button></div></div>'+
      '<input type="range" id="wS" min="0" max="100" step="1" value="'+st.w+'" aria-label="Wölbung der Augenlinse"><div class="scale"><span>flach (dünn)</span><span>stark gewölbt (dick)</span></div>'+
      '<p class="status '+(eyeSharp(es)?'ok':'info')+'" id="eyeStat">'+(eyeSharp(es)?'scharf ✓':'noch unscharf')+'</p>';
  } else {
    h='<div class="ctlrow"><span>PATIENT</span>'+segHTML('sPat',[['lena','Lena (13)'],['becker','Herr Becker (68)']],st.pat)+'</div>'+
      '<div class="ctlrow"><span>WAS SCHAUT SIE / ER AN?</span>'+segHTML('sObj',[['far','Tafel (6 m)'],['near','Zeitung (25 cm)']],st.obj)+'</div>'+
      '<div class="ctlrow"><span>BRILLE AUFSETZEN</span>'+segHTML('sGl',[['none','keine'],['plus','Sammellinse'],['minus','Zerstreuungslinse']],st.glass)+'</div>'+
      '<p class="muted">Das Auge stellt von selbst so gut scharf, wie es kann.</p>';
  }
  $('ctl').innerHTML=h;
  if(sc==='lupe'){
    function setG(v){st.g=Math.max(2,Math.min(25,Math.round(v*2)/2));$('gS').value=st.g;$('dispG').textContent=fmt(st.g,1)+' cm';draw();}
    $('gS').addEventListener('input',function(){setG(parseFloat(this.value));});$('gl').addEventListener('click',function(){setG(st.g-.5);});$('gr').addEventListener('click',function(){setG(st.g+.5);});
    $('tRays').addEventListener('change',function(){st.rays=this.checked;draw();});$('tScr').addEventListener('change',function(){st.screen=this.checked;draw();});
  } else if(sc==='eye'){
    function setW(v){st.w=Math.max(0,Math.min(100,Math.round(v)));$('wS').value=st.w;$('dispW').textContent=st.w+' %';var es=eyeState(),s=eyeSharp(es),e=$('eyeStat');e.className='status '+(s?'ok':'info');e.textContent=s?'scharf ✓':'noch unscharf';draw();}
    $('wS').addEventListener('input',function(){setW(parseFloat(this.value));});$('wl').addEventListener('click',function(){setW(st.w-1);});$('wr').addEventListener('click',function(){setW(st.w+1);});
    bindSeg('sObj',function(v){st.obj=v;setW(st.w);});
  } else {
    bindSeg('sPat',function(v){st.pat=v;draw();});bindSeg('sObj',function(v){st.obj=v;draw();});bindSeg('sGl',function(v){st.glass=v;draw();});
  }
}

/* ---------- Stationen-Weg ---------- */
function unlocked(i){return i===0||st.done[i-1];}
function renderRoute(){
  var h='';STATIONS.forEach(function(s,i){var cls='stop'+(s.pro?' pro':'')+(i===st.station?' on':'')+(st.done[i]?' done':'');
    h+='<button type="button" class="'+cls+'" data-i="'+i+'"'+(unlocked(i)?'':' disabled')+'><span class="n">'+(st.done[i]?'✓':(s.pro?'★':(i+1)))+'</span>'+s.name+'</button>';});
  $('route').innerHTML=h;
  Array.prototype.forEach.call($('route').querySelectorAll('.stop'),function(b){b.addEventListener('click',function(){go(+b.dataset.i);});});
}
function go(i){if(!unlocked(i))return;st.station=i;save();render();window.scrollTo({top:0,behavior:'smooth'});}
function finish(i){if(!st.done[i]){st.done[i]=true;save();renderRoute();}}
function nextBtn(i){if(!st.done[i]||i>=STATIONS.length-1)return '';var n=STATIONS[i+1];return '<button class="btn pri" type="button" id="nextSt">'+(n.pro?'Zu den Profi-Aufgaben ★':'Weiter zu Station '+(i+2)+': '+n.name)+' →</button>';}
function bindNext(){var b=$('nextSt');if(b)b.addEventListener('click',function(){go(st.station+1);});}
function tipBox(list,n){var h='';for(var i=0;i<n&&i<list.length;i++)h+='<p class="hint"><b>Tipp '+(i+1)+':</b> '+list[i]+'</p>';return h;}
function esc(t){return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
/* Multiple Choice: Frage mit Antwortknöpfen; cb(j) bei Klick */
function mcHTML(id,q,opts,val,ans,grid){return '<div class="q"><p><b>'+q+'</b></p><div class="choice'+(grid?' grid2':'')+'" data-mc="'+id+'">'+opts.map(function(o,j){return '<button type="button" class="opt'+(val===j?(j===ans?' ok':' bad'):'')+'" data-j="'+j+'">'+o+'</button>';}).join('')+'</div><p class="fb" id="fb_'+id+'"></p></div>';}
function bindMC(id,ans,key,okMsg,badMsgs,onOk,store){
  var box=document.querySelector('[data-mc="'+id+'"]');if(!box)return;
  Array.prototype.forEach.call(box.children,function(b){b.addEventListener('click',function(){var j=+b.dataset.j;tryInc(key,j===ans,j);store(j);save();
    Array.prototype.forEach.call(box.children,function(x,i){x.className='opt'+(i===j?(j===ans?' ok':' bad'):'');});
    var fb=$('fb_'+id);if(j===ans){fb.className='fb ok';fb.textContent=okMsg;if(onOk)onOk();}else{fb.className='fb bad';fb.textContent=(typeof badMsgs==='string')?badMsgs:(badMsgs[j]||'Noch nicht. Probiere es im Modell aus.');}});});
}
function showFb(id,ok,msg){var f=$('fb_'+id);if(f){f.className='fb '+(ok?'ok':'bad');f.textContent=msg;}}
/* Segment-Fragen (mehrere Teilfragen, gemeinsam prüfen) */
function segQHTML(list,store,locked){return list.map(function(q){var v=store[q.id];return '<div class="q"><p>'+q.q+'</p><span class="seg" data-sq="'+q.id+'">'+q.o.map(function(o,j){return '<button type="button" data-j="'+j+'" class="'+(v===j?(locked?'ok':'sel'):'')+'">'+o+'</button>';}).join('')+'</span></div>';}).join('');}
function bindSegQ(store,locked){Array.prototype.forEach.call(document.querySelectorAll('[data-sq]'),function(sg){Array.prototype.forEach.call(sg.children,function(b){b.addEventListener('click',function(){if(locked())return;store[sg.dataset.sq]=+b.dataset.j;save();Array.prototype.forEach.call(sg.children,function(x){x.className=x===b?'sel':'';});});});});}
function checkSegQ(list,store,key,fbId,onHelp){var fb=$(fbId),miss=0,wrong=[];
  list.forEach(function(q){var v=store[q.id],sg=document.querySelector('[data-sq="'+q.id+'"]');if(v==null){miss++;return;}var ok=v===q.a;sg.children[v].className=ok?'ok':'bad';if(!ok)wrong.push(q);});
  if(miss){fb.className='fb bad';fb.textContent='Es fehlen noch '+miss+' Antworten.';return false;}
  tryInc(key,!wrong.length,wrong.map(function(q){return q.id;}).join(','));
  if(wrong.length){fb.className='fb bad';fb.textContent=wrong[0].w;if(onHelp)showHelp(fb,key,function(){list.forEach(function(q){store[q.id]=q.a;});save();onHelp();helpMsg(fbId,'Die Lösung ist markiert. Lies sie dir durch und tippe auf „Prüfen“.');});return false;}return true;}

    '<div class="abg-row"><label for="abgName">Namen</label><input class="abg-in" id="abgName" autocomplete="off" style="width:12em">'+
    '<label for="abgKl">Klasse</label><input class="abg-in" id="abgKl" autocomplete="off" style="width:5em"></div>'+
    '<div class="abg-row"><button class="abg-copy" type="button" id="abgDl">Datei herunterladen</button>'+
    '<button class="abg-close" type="button" id="abgClose">Schließen</button></div>'+
    '<p class="muted" style="font-size:14px">Klappt das Herunterladen nicht? Dann <button type="button" id="abgCopy" style="background:none;border:none;padding:0;color:var(--blue);text-decoration:underline;font:inherit;cursor:pointer">kopiert den Text</button> und fragt eure Lehrkraft.</p>'+
    '<p class="abg-fb" id="abgFb"></p>'+
    '<textarea class="abg-txt" id="abgTxt" rows="10" readonly hidden></textarea></div>';
  document.body.appendChild(ov);
  var $n=ov.querySelector('#abgName'),$k=ov.querySelector('#abgKl'),$t=ov.querySelector('#abgTxt'),$f=ov.querySelector('#abgFb');
  function msg(ok,t){$f.className='abg-fb '+(ok?'ok':'bad');$f.textContent=t;}
  function open(){A=lget();$n.value=A.name||'';$k.value=A.klasse||'';$t.hidden=true;msg(true,'');ov.hidden=false;setTimeout(function(){($n.value?ov.querySelector('#abgDl'):$n).focus();},30);}
  function close(){ov.hidden=true;}
  function upd(){A.name=$n.value.trim();A.klasse=$k.value.trim();lset(A);}
  $n.addEventListener('input',upd);$k.addEventListener('input',upd);
  ov.querySelector('#abgClose').addEventListener('click',close);
  ov.addEventListener('click',function(ev){if(ev.target===ov)close();});
  document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&!ov.hidden)close();});
  ov.querySelector('#abgCopy').addEventListener('click',function(){
    upd();if(!A.name){msg(false,'Tragt zuerst eure Namen ein.');$n.focus();return;}
    var txt=abgText(A);$t.value=txt;
    function sel(){$t.hidden=false;$t.focus();$t.select();msg(true,'Der Text ist markiert. Tippe lange darauf und wähle „Kopieren“.');}
    try{navigator.clipboard.writeText(txt).then(function(){msg(true,'Text kopiert.');},sel);}catch(err){sel();}
  });
  ov.querySelector('#abgDl').addEventListener('click',function(){
    upd();if(!A.name){msg(false,'Tragt zuerst eure Namen ein.');$n.focus();return;}
    var txt=abgText(A).replace(/\r?\n/g,'\r\n'),name=resFile();
    try{var bl=new Blob(['\ufeff'+txt],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(bl),a=document.createElement('a');
      a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},10000);
      msg(true,'Die Datei „'+name+'“ wird heruntergeladen. Ladet sie jetzt in IServ bei der Aufgabe „'+APP+'“ hoch.');}
    catch(err){msg(false,'Herunterladen klappt hier nicht. Kopiert stattdessen den Text.');}
  });
  document.getElementById('abgBtn').addEventListener('click',open);
})();
})();
</script>
</body>
