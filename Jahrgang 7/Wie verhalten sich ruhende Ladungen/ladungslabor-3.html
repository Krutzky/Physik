<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ladungslabor 3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout wie „Optik-Werkstatt“: Kopfleiste mit Stationen-Weg · links Modell mit zwei Ansichten (fest) · rechts Steuerpult + Stationsaufgabe. */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface-2:#F3F5FA; --ink:#0B1442; --ink-soft:#4E5677; --line:#CBD3E1;
  --navy:#020C45; --navy-ink:#FFFFFF; --accent:#E8892B; --accent-ink:#1B1300; --blue:#1C66C0; --blue-soft:#DCE8F7; --on-blue:#FFFFFF;
  --ok:#22865A; --ok-soft:#DDF2E7; --bad:#C8423D; --bad-soft:#F9E1DF; --pro:#6B3FB0; --pro-soft:#ECE4F8;
  --grid:#E3E8F0; --axis:#4A5068; --rail:#5B6278; --lens:#9CC3F0; --lens-edge:#3A6AA8; --ray1:#E8892B; --ray2:#1C66C0; --red:#E8432E;
  --room:#14161D; --display:#111111; --display-ink:#FFC94D;
  --f-display:"Lexend","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",Calibri,system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#060B26; --surface:#0E1640; --surface-2:#141D4F; --ink:#EEF1FA; --ink-soft:#A9B1D3; --line:#2B3672;
  --navy:#020722; --navy-ink:#FFFFFF; --accent:#F3A04F; --accent-ink:#1B1300; --blue:#6FA8F0; --blue-soft:#1A2A63; --on-blue:#06102E;
  --ok:#4CC48A; --ok-soft:#123A2C; --bad:#F07A73; --bad-soft:#40181C; --pro:#B89AF0; --pro-soft:#2A1E52;
  --grid:#1E2858; --axis:#AEB6D8; --rail:#8792C2; --lens:#3D6FB0; --lens-edge:#9CC3F0; --ray1:#F3A04F; --ray2:#6FA8F0; --red:#F2604D;
  --room:#05060A; --display:#000000; --display-ink:#FFC94D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060B26; --surface:#0E1640; --surface-2:#141D4F; --ink:#EEF1FA; --ink-soft:#A9B1D3; --line:#2B3672;
  --navy:#020722; --navy-ink:#FFFFFF; --accent:#F3A04F; --accent-ink:#1B1300; --blue:#6FA8F0; --blue-soft:#1A2A63; --on-blue:#06102E;
  --ok:#4CC48A; --ok-soft:#123A2C; --bad:#F07A73; --bad-soft:#40181C; --pro:#B89AF0; --pro-soft:#2A1E52;
  --grid:#1E2858; --axis:#AEB6D8; --rail:#8792C2; --lens:#3D6FB0; --lens-edge:#9CC3F0; --ray1:#F3A04F; --ray2:#6FA8F0; --red:#F2604D;
  --room:#05060A; --display:#000000; --display-ink:#FFC94D; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

header{background:var(--navy);color:var(--navy-ink);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hwrap{max-width:1360px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;flex-direction:column}
.brand b{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.2px}
.brand span{font-size:13px;color:#8DB7EE}
.route{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.stop{display:flex;align-items:center;gap:8px;border:2px solid #34428F;background:transparent;color:#fff;border-radius:999px;padding:5px 12px 5px 6px;font-size:14px;font-weight:700}
.stop .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#24317A;font-size:13px}
.stop.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stop.on .n{background:rgba(0,0,0,.18);color:var(--accent-ink)}
.stop.done .n{background:var(--ok);color:#fff}
.stop.pro{border-style:dashed;border-color:#8E74D6}
.stop.pro.on{background:#B89AF0;border-color:#B89AF0;color:#1A0F33;border-style:solid}
.stop:disabled{opacity:.45;cursor:not-allowed}
.reset{background:transparent;border:1.5px solid #34428F;color:#B9C6EE;border-radius:999px;padding:5px 10px;font-size:13px}

main{max-width:1360px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.plot{position:sticky;top:env(safe-area-inset-top,0px);padding:10px;display:flex;flex-direction:column;gap:10px}
@media (max-width:900px){.plot{position:static}}
canvas{display:block;width:100%;border-radius:10px;touch-action:none}
.views{display:grid;grid-template-columns:repeat(2,minmax(0,250px));justify-content:center;gap:14px}
.view{display:flex;flex-direction:column;gap:4px;min-width:0}
.view canvas{aspect-ratio:1/1;max-width:100%;background:var(--room)}
.view small{font-size:13px;color:var(--ink-soft);text-align:center}
.view small b{color:var(--ink)}

.side{display:flex;flex-direction:column;gap:16px;min-width:0}
h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0 0 4px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0}
.eyebrow{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--blue);font-weight:700;margin:0 0 2px}
.eyebrow.pro{color:var(--pro)}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--ink-soft);font-size:15px}

/* Steuerpult */
.ctl{display:flex;flex-direction:column;gap:6px}
.lift{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:stretch}
.disp{background:var(--display);color:var(--display-ink);font-family:var(--f-mono);border-radius:12px;padding:6px 10px;text-align:center;box-shadow:inset 0 0 0 3px #333;display:flex;flex-direction:column;justify-content:center}
.disp small{font-size:11px;letter-spacing:2px;color:#9a9a9a}
.disp span{font-size:28px;letter-spacing:1px;font-variant-numeric:tabular-nums}
.disp.g{color:#9FD0FF}
.keys{display:flex;gap:8px;align-items:center}
.key{width:56px;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);font-size:22px;font-weight:700}
.key:active{background:var(--accent);color:var(--accent-ink)}
input[type=range]{width:100%;accent-color:var(--accent);height:30px}
input[type=range].gr{accent-color:var(--blue)}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.locked{font-size:15px;color:var(--ink-soft);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.chk{display:flex;align-items:center;gap:10px;font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--blue)}
.sep{border:0;border-top:1.5px dashed var(--line);margin:8px 0}

.num{width:4.6em;text-align:center;border:2px solid var(--line);border-radius:8px;padding:5px 2px;background:var(--surface);font-variant-numeric:tabular-nums}
.num.ok{border-color:var(--ok);background:var(--ok-soft)}
.num.bad{border-color:var(--bad);background:var(--bad-soft)}
.sel{font:inherit;border:2px solid var(--line);border-radius:8px;padding:4px 4px;background:var(--surface);max-width:100%}
.sel.ok{border-color:var(--ok);background:var(--ok-soft)}
.sel.bad{border-color:var(--bad);background:var(--bad-soft)}
.btn{border:none;border-radius:999px;padding:10px 18px;font-weight:700;font-size:16px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--surface);border:1.5px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn.tip{background:transparent;border:1.5px dashed var(--blue);color:var(--blue);padding:7px 14px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.choice{display:flex;flex-direction:column;gap:8px}
.choice.grid2{display:grid;grid-template-columns:1fr 1fr}
@media (max-width:440px){.choice.grid2{grid-template-columns:1fr}}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.opt b{font-family:var(--f-display)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.gopt{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center}
.gopt .L{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-family:var(--f-display);grid-row:1/3}
.gopt span{font-size:15px}
.seg{display:inline-flex;flex-wrap:wrap;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:7px 14px;font-weight:700}
.seg button.sel{background:var(--blue);color:var(--on-blue)}
.seg button.ok{background:var(--ok);color:#fff}
.seg button.bad{background:var(--bad);color:#fff}
.fb{font-weight:700;min-height:1.4em}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.note{border-left:4px solid var(--accent);background:var(--surface-2);padding:10px 12px;border-radius:0 10px 10px 0;font-size:15px}
.hint{border:1.5px dashed var(--blue);background:var(--blue-soft);border-radius:10px;padding:10px 12px;font-size:15px}
.win{border:2px solid var(--ok);background:var(--ok-soft);border-radius:12px;padding:12px}
.guess{border:2px solid var(--pro);background:var(--pro-soft);border-radius:12px;padding:12px}
.q{display:flex;flex-direction:column;gap:6px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.q p b{font-family:var(--f-display);font-weight:600}
.gap ol{padding-left:1.2em;margin:0}
.gap li{margin-bottom:10px}
.dots{display:flex;gap:6px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:block}
.dots i.on{background:var(--ok);border-color:var(--ok)}
.merk{border:2px solid var(--blue);border-radius:12px;padding:14px;background:var(--surface)}
.merk h3{color:var(--blue);margin-bottom:6px}
.merk .k{color:var(--blue);font-weight:700}
textarea.free{width:100%;border:2px solid var(--line);border-radius:10px;padding:8px;background:var(--surface);color:var(--ink)}
.bz{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}
.badge{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-family:var(--f-display)}
.tw{overflow-x:auto}
table.mt{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:15.5px}
table.mt th,table.mt td{border:1.5px solid var(--line);padding:6px 6px;text-align:center}
table.mt th{background:var(--surface-2);font-weight:700}
table.mt th small{display:block;font-weight:400;color:var(--ink-soft);font-size:12px}
table.mt tr.cur td{background:var(--blue-soft)}
table.mt tr.done td{background:var(--ok-soft)}
table.mt tr.lock td{color:var(--ink-soft)}
table.mt td.v b{font-size:16px}
.chart{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--ink-soft);padding:0 6px 4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---- Ergebnisse abgeben ---- */
.abg-btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700}
.abg-ov{position:fixed;inset:0;background:rgba(2,8,40,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto;z-index:50}
.abg-box{background:var(--surface);color:var(--ink);border-radius:16px;max-width:560px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.abg-box h2{margin:0}
.abg-box ol{margin:0;padding-left:1.3em}
.abg-box li{margin-bottom:6px}
.abg-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.abg-in{border:2px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);color:var(--ink);font:inherit}
.abg-copy{background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;padding:12px 22px;font-weight:700;font-size:18px}
.abg-close{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:700;color:var(--ink)}
.abg-fb{font-weight:700;min-height:1.4em}
.abg-fb.ok{color:var(--ok)} .abg-fb.bad{color:var(--bad)}
.abg-txt{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;border:2px solid var(--line);border-radius:10px;padding:8px;background:var(--surface-2);color:var(--ink)}
</style>
<style>
.ctlrow{display:flex;flex-direction:column;gap:4px}
.ctlrow > span{font-size:13px;color:var(--ink-soft);font-weight:700;letter-spacing:.5px}
.seg.full{display:flex}
.seg.full button{flex:1}
.status{font-weight:700;border-radius:10px;padding:8px 12px;font-size:15px;text-align:center}
.status.ok{background:var(--ok-soft);color:var(--ok)} .status.bad{background:var(--bad-soft);color:var(--bad)} .status.info{background:var(--surface-2);color:var(--ink-soft)}
.patient{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2)}
.patient .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-family:var(--f-display);color:#fff;grid-row:1/3}
.pic{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.pic svg{width:100%;max-width:84px;height:auto}
.choice.grid4{display:grid;grid-template-columns:repeat(4,1fr)}
@media (max-width:440px){.choice.grid4{grid-template-columns:1fr 1fr}}

/* ---- Start-Dialog ---- */
.abg-ov{position:fixed;inset:0;background:rgba(2,8,40,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto;z-index:50}
.abg-box{background:var(--surface);color:var(--ink);border-radius:16px;max-width:560px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.abg-box h2{margin:0}
.abg-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.abg-in{border:2px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);color:var(--ink);font:inherit}
.abg-copy{background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;padding:12px 22px;font-weight:700;font-size:18px}
.abg-fb{font-weight:700;min-height:1.4em}
.abg-fb.ok{color:var(--ok)} .abg-fb.bad{color:var(--bad)}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand"><b>Ladungslabor 3</b><span>Woher kommt die Ladung?</span></div>
    <nav class="route" id="route" aria-label="Stationen"></nav>
    <button class="abg-btn" id="abgBtn" type="button">Ergebnisse abgeben</button><button class="reset" id="reset" type="button">Neu starten</button>
  </div>
</header>
<main>
  <section class="card plot" aria-label="Modell">
    <canvas id="cv" aria-label="Modell: Atom, Reib-Maschine oder Detektiv-Fall"></canvas>
    <div class="views">
      <div class="view"><canvas id="cvA"></canvas><small id="capA"></small></div>
      <div class="view"><canvas id="cvB"></canvas><small id="capB"></small></div>
    </div>
  </section>
  <aside class="side">
    <section class="card" id="ctlCard"><p class="eyebrow">Steuerpult</p><div id="ctl" class="ctl"></div></section>
    <section class="card stack" id="task"></section>
  </aside>
</main>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var APP='Ladungslabor 3';
var STATIONS=[
  {key:'s1',name:'Atom-Baukasten',scene:'atom'},
  {key:'s2',name:'Reib-Maschine',scene:'rub'},
  {key:'s3',name:'Ladungs-Detektiv',scene:'game'},
  {key:'s4',name:'Merksatz',scene:'rub'},
  {key:'s5',name:'Profi-Zusatz',pro:true,scene:'atom'}
];
var st={station:0,done:[false,false,false,false,false],guess:null,
  s1:{m1:false,m2:false,m3:false,neu:null,neuOk:false,move:null,moveOk:false},
  s2:{obs:{},obsOk:false,sum:null,sumOk:false,own:'',ok:false},
  s3:{game:{i:0,score:0,streak:0,best:0,first:[]},bal:null,balOk:false,hair:null,hairOk:false},
  s4:{gaps:{},ok:false,refl:'',pulli:null,pulliOk:false},
  s5:{},res:{},tries:{},help:{},t0:null,log:[]};
/* ---------- Speicher ---------- */
var KEY='ladungslabor-3-v1',RKEY='ladungslabor-3-resets';
function save(){try{localStorage.setItem(KEY,JSON.stringify({station:st.station,done:st.done,guess:st.guess,s1:st.s1,s2:st.s2,s3:st.s3,s4:st.s4,s5:st.s5,res:st.res,tries:st.tries,help:st.help,t0:st.t0,log:st.log}));}catch(e){}}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||'null');if(!x)return;
  st.station=x.station||0;if(x.done)st.done=x.done;while(st.done.length<5)st.done.push(false);st.guess=x.guess||null;
  ['s1','s2','s3','s4','s5'].forEach(function(k){if(x[k])st[k]=Object.assign(st[k],x[k]);});
  if(x.res)st.res=x.res;if(x.tries)st.tries=x.tries;if(x.help)st.help=x.help;if(x.t0)st.t0=x.t0;if(x.log)st.log=x.log;}catch(e){}}
function tryInc(k,ok,val){var t=st.tries[k]||(st.tries[k]={n:0,ok:false,first:null});if(t.ok)return;t.n++;if(t.first===null)t.first=!!ok;if(ok)t.ok=true;else if(val!=null&&val!==''){t.w=t.w||[];if(t.w.length<12)t.w.push(val);}save();}
function stuck(k){var t=st.tries[k];return !!(t&&!t.ok&&t.n>=3);}
function showHelp(fb,k,fn){if(!fb||!stuck(k))return;var id='hb_'+k;if(document.getElementById(id))return;var b=document.createElement('button');b.type='button';b.id=id;b.className='btn tip';b.style.marginTop='6px';b.textContent='Ich komme nicht weiter: Lösung zeigen';
  b.addEventListener('click',function(){st.help[k]=true;save();fn();});var wrap=document.createElement('div');wrap.className='row';wrap.appendChild(b);(fb.parentNode.classList&&fb.parentNode.classList.contains('row')?fb.parentNode:fb).insertAdjacentElement('afterend',wrap);}
function helpMsg(id,t){var f=$(id);if(f){f.className='fb ok';f.textContent=t;}}
function fnv(str){var h=0x811c9dc5;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return ('0000000'+h.toString(16)).slice(-8);}
function resets(){try{return +(localStorage.getItem(RKEY)||0);}catch(e){return 0;}}
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}

function col(n){return getComputedStyle(document.documentElement).getPropertyValue('--'+n).trim();}
function ff(){return getComputedStyle(document.body).fontFamily;}
var cv=$('cv'),ctx=cv.getContext('2d'),W=0,H=0;
function resize(){var w=cv.getBoundingClientRect().width||640,h=Math.round(Math.max(260,Math.min(w*0.58,430))),dpr=window.devicePixelRatio||1;
  cv.style.height=h+'px';cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);W=w;H=h;sizeView($('cvA'));sizeView($('cvB'));draw();}
function sizeView(c){var w=c.getBoundingClientRect().width||220,dpr=window.devicePixelRatio||1;c.width=Math.round(w*dpr);c.height=Math.round(w*dpr);}

  c.font='bold 22px '+ff();c.fillStyle=col('ink');c.fillText(cd.t,92,76);

function statusInfo(){var sc=scene();
  if(sc==='atom'){var q=M.atom.p-M.atom.e;return [q===0?'ok':'info','Das Atom ist '+chargeWord(q)+(q?' (Ladung '+sgnTxt(q)+').':'. Gleich viele + und –.')];}

/* ---------- Animation ---------- */
var raf=0,lastT=0,reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function kick(){if(!raf){lastT=performance.now();raf=requestAnimationFrame(tick);}}
function tick(t){var dt=Math.min(0.05,(t-lastT)/1000);lastT=t;var moving=false;
  if(scene()==='atom'&&!reduce){ROT+=dt*0.5;moving=true;}
  if(M.atom.flash>0){M.atom.flash=Math.max(0,M.atom.flash-dt*1.5);moving=true;}
  if(M.rub.shake>0){M.rub.shake=Math.max(0,M.rub.shake-dt*2.5);moving=true;}
  if(M.rub.fly){M.rub.fly.t+=dt*1.8;if(M.rub.fly.t>=1)M.rub.fly=null;moving=true;}
  if(M.game.fbT>0){M.game.fbT=Math.max(0,M.game.fbT-dt*0.7);moving=true;}
  draw();if(moving)raf=requestAnimationFrame(tick);else raf=0;}

/* ---------- Aktionen ---------- */
function setP(v){if(pLocked()){M.atom.flash=1;kick();renderCtl();return;}M.atom.p=Math.max(1,Math.min(MAXP,v));kick();}
function setE(v){M.atom.e=Math.max(0,Math.min(MAXE,v));kick();}
function setN(v){var r=M.rub;v=Math.max(0,Math.min(MAXN,v));if(v>r.n){r.shake=1;r.n=v;r.fly={t:0};}else{r.n=v;r.fly=null;}kick();}
function answerCard(a){var g=st.s3.game=st.s3.game||{i:0,score:0,streak:0,best:0,first:[]};if(g.i>=CARDS.length)return;
  var cd=CARDS[g.i],ok=a===cd.a,firstTry=g.first[g.i]===undefined;
  if(firstTry)g.first[g.i]=ok;
  if(ok){if(firstTry){g.score++;g.streak++;g.best=Math.max(g.best,g.streak);}g.i++;M.game.fb='ok';}else{g.streak=0;M.game.fb='bad';}
  if(g.i>=CARDS.length&&g.score1==null)g.score1=g.score;
  M.game.fbT=1.2;save();kick();renderCtl();r3();}

function bindSlider(id,get,set,step,min,max,unit){function u(v){v=Math.max(min,Math.min(max,v));set(v);$(id+'S').value=v;$('disp'+id).textContent=v+(unit==null?'×':unit);draw();}
  $(id+'S').addEventListener('input',function(){u(parseFloat(this.value));});$(id+'m').addEventListener('click',function(){u(get()-step);});$(id+'p').addEventListener('click',function(){u(get()+step);});}
function renderCtl(){var sc=scene(),h='';var eb=$('ctlCard').querySelector('.eyebrow');
  if(needGuess()){eb.textContent='Bevor du startest';eb.classList.add('pro');$('ctl').innerHTML=guessBox();bindGuess();return;}
  eb.textContent='Steuerpult';eb.classList.remove('pro');
  if(sc==='atom'){var a=M.atom;h=slider('P','PROTONEN IM KERN (+)',String(a.p),1,MAXP,1,a.p,'1','8')+(pLocked()?'<p class="locked">Der Kern ist jetzt fest. Protonen können ein Atom nicht verlassen. Nur Elektronen können wandern.</p>':'')+
    slider('E','ELEKTRONEN IN DER HÜLLE (–)',String(a.e),0,MAXE,1,a.e,'0','10','g');}
  else if(sc==='rub'){var r=M.rub;h='<div class="ctlrow"><span>STOFFE</span>'+segHTML('sM',[['kw','Kunststoffstab + Wolltuch'],['gs','Glasstab + Seidentuch']],r.mat)+'</div>'+
    slider('N','SO OFT GERIEBEN',r.n+'×',0,MAXN,1,r.n,'0 (nicht gerieben)',MAXN+'×','g')+'<p class="muted" style="font-size:14px">Bei jedem Reibzug wandert im Modell ein Elektron.</p>';}
  else{var g=st.s3.game||{i:0},done=(g.i||0)>=CARDS.length;
    h=done?'<div class="row"><button class="btn sec" type="button" id="gAgain">Noch einmal spielen</button></div>':
      '<p class="muted">Fall '+((g.i||0)+1)+' von '+CARDS.length+'. Wie ist der Gegenstand geladen?</p><div class="choice">'+
      [['+','positiv geladen (mehr +)'],['-','negativ geladen (mehr –)'],['0','ungeladen (gleich viele)']].map(function(o){return '<button type="button" class="opt" data-a="'+o[0]+'"><b>'+o[1]+'</b></button>';}).join('')+'</div>';}
  h+='<p class="status info" id="stat"></p>';
  $('ctl').innerHTML=h;
  if(sc==='atom'){bindSlider('P',function(){return M.atom.p;},setP,1,1,MAXP,'');bindSlider('E',function(){return M.atom.e;},setE,1,0,MAXE,'');}
  else if(sc==='rub'){bindSeg('sM',function(v){M.rub.mat=v;M.rub.n=0;M.rub.fly=null;renderCtl();kick();});bindSlider('N',function(){return M.rub.n;},setN,1,0,MAXN,'×');}
  else{Array.prototype.forEach.call(document.querySelectorAll('#ctl .opt[data-a]'),function(b){b.addEventListener('click',function(){answerCard(b.dataset.a);});});
    var ag=$('gAgain');if(ag)ag.addEventListener('click',function(){var g=st.s3.game;g.i=0;g.streak=0;g.first=[];g.score=0;g.round=(g.round||1)+1;save();renderCtl();r3();kick();});}
  updStatus();
}

/* ---------- Vermutung ---------- */
function pic(kind){var inner='';
  if(kind==='eIn')inner='<rect x="14" y="44" width="30" height="12" rx="6" fill="#5A6578"/><circle cx="58" cy="30" r="8" fill="#2F6FD3"/><text x="58" y="34" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">–</text><path d="M52 34 Q44 40 40 44" stroke="#1A1F36" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>';
  else if(kind==='pOut')inner='<rect x="14" y="44" width="30" height="12" rx="6" fill="#5A6578"/><circle cx="58" cy="30" r="8" fill="#E8322B"/><text x="58" y="34" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">+</text><path d="M40 42 Q46 34 50 32" stroke="#1A1F36" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>';
  else if(kind==='neu')inner='<rect x="20" y="44" width="40" height="12" rx="6" fill="#5A6578"/><path d="M40 16 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#F5B82E"/>';
  else inner='<rect x="36" y="16" width="8" height="38" rx="4" fill="#F3F5FA" stroke="#4E5677" stroke-width="2.5"/><circle cx="40" cy="58" r="9" fill="#E8432E"/><rect x="38" y="30" width="4" height="26" fill="#E8432E"/>';
  return '<svg viewBox="0 0 80 80" aria-hidden="true"><defs><marker id="ah" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6z" fill="#1A1F36"/></marker></defs><rect x="4" y="4" width="72" height="72" rx="36" fill="#FFF3D6" stroke="#3A6AA8" stroke-width="4"/>'+inner+'</svg>';}
var GUESS=[{k:'A',t:'eIn',n:'Er hat negative Teilchen vom Tuch bekommen.'},{k:'B',t:'pOut',n:'Er hat positive Teilchen abgegeben.'},{k:'C',t:'neu',n:'Beim Reiben entsteht neue Ladung.'},{k:'D',t:'warm',n:'Die Wärme macht ihn negativ.'}];
function guessName(k){var g=GUESS.filter(function(x){return x.k===k;})[0];return g?g.k+' ('+g.n+')':'';}
function guessBox(){var tmp=st.guessTmp||null;
  return '<div class="guess stack"><p>Ein Kunststoffstab wird mit einem Wolltuch gerieben. Danach ist er <b>negativ</b> geladen. <b>Was ist beim Reiben passiert?</b></p><div class="choice grid4" id="gs">'+
    GUESS.map(function(o){return '<button type="button" class="opt pic'+(tmp===o.k?' sel':'')+'" data-k="'+o.k+'"><b>'+o.k+'</b>'+pic(o.t)+'<span style="font-size:13px">'+o.n+'</span></button>';}).join('')+
    '</div><p class="muted">Hier gibt es noch kein richtig oder falsch. Erst wenn du deine Vermutung festgelegt hast, geht es los.</p>'+
    '<div class="row"><button class="btn pri" type="button" id="gsOk"'+(tmp?'':' disabled')+'>Vermutung festlegen</button></div></div>';}
function bindGuess(){Array.prototype.forEach.call(document.querySelectorAll('#gs .opt'),function(b){b.addEventListener('click',function(){st.guessTmp=b.dataset.k;Array.prototype.forEach.call(document.querySelectorAll('#gs .opt'),function(x){x.classList.toggle('sel',x===b);});$('gsOk').disabled=false;});});
  $('gsOk').addEventListener('click',function(){if(!st.guessTmp)return;st.guess=st.guessTmp;save();render();});}
function needGuess(){return st.station===0&&!st.guess;}

/* ---------- Station 1: Atom-Baukasten ---------- */
var MISS=[
  {id:'m1',t:'Mission 1',q:'Baue ein <b>ungeladenes</b> Atom mit <b>3 Protonen</b>.',check:function(){return M.atom.p===3&&M.atom.e===3;},hint:function(){return M.atom.p!==3?'Stelle zuerst 3 Protonen ein.':'Ein ungeladenes Atom hat gleich viele + und –. Wie viele Elektronen brauchst du?';}},
  {id:'m2',t:'Mission 2',q:'Mach daraus ein <b>negativ</b> geladenes Atom mit der Ladung <b>–1</b>.',check:function(){return M.atom.p===3&&M.atom.e===4;},hint:function(){return M.atom.e<4?'Negativ heißt: mehr – als +. Gib ein Elektron dazu.':'Die Ladung soll genau –1 sein. Schau auf die Ladungs-Waage.';}},
  {id:'m3',t:'Mission 3',q:'Mach daraus ein <b>positiv</b> geladenes Atom mit der Ladung <b>+2</b>.',check:function(){return M.atom.p===3&&M.atom.e===1;},hint:function(){return 'Positiv heißt: weniger – als +. Nimm Elektronen weg, bis die Ladung +2 ist.';}}
];
var QNEU={q:'Wann ist ein Atom ungeladen?',o:['Wenn es gleich viele Protonen (+) und Elektronen (–) hat.','Wenn es gar keine Elektronen hat.','Wenn es mehr Protonen als Elektronen hat.'],a:0,
  ok:'Genau! Die positiven und negativen Ladungen gleichen sich aus. Nach außen ist das Atom ungeladen.',bad:['','Ohne Elektronen bleiben nur die + im Kern. Dann ist das Atom positiv.','Dann gibt es mehr + als –. Wie ist das Atom dann geladen?']};
var QMOVE={q:'In Mission 2 und 3 war der Kern fest. Was kann ein Atom also abgeben oder aufnehmen?',o:['nur Elektronen (–)','nur Protonen (+)','Protonen und Elektronen'],a:0,
  ok:'Richtig! Die Protonen sitzen fest im Kern. Nur die Elektronen in der Hülle können wandern.',bad:['','Konntest du in Mission 2 und 3 die Protonen verändern?','Die Protonen sitzen fest im Kern. Was konntest du noch verändern?']};
function r1(){var s=st.s1;
  if(needGuess()){$('task').innerHTML='<div><p class="eyebrow">Station 1 · Atom-Baukasten</p><h2>Woraus bestehen Ladungen?</h2></div><p class="note">Lege zuerst oben im Kasten <b>„Bevor du startest“</b> deine Vermutung fest. Danach erscheint das Steuerpult und es geht los.</p>';return;}
  var g='<div class="guess"><p class="eyebrow pro">Deine Vermutung</p><p><b>'+guessName(st.guess)+'</b>. In Station 4 prüfst du sie.</p></div>';
  var info='<div class="stack"><p>Alle Stoffe bestehen aus winzigen <b>Atomen</b>. Jedes Atom hat einen <b>Atomkern</b> mit positiven <b>Protonen (+)</b> und eine <b>Atomhülle</b> mit negativen <b>Elektronen (–)</b>. Baue selbst Atome!</p></div>';
  var stars=MISS.filter(function(m){return s[m.id];}).length;
  var mis=MISS.map(function(m,i){var open=i===0||s[MISS[i-1].id];if(!open)return '';
    return '<div class="q"><p class="eyebrow">'+m.t+(s[m.id]?' · geschafft ★':'')+'</p><p>'+m.q+'</p>'+(s[m.id]?'':'<div class="row"><button class="btn pri" type="button" data-m="'+i+'">Prüfen</button></div>')+'<p class="fb'+(s[m.id]?' ok':'')+'" id="fbm'+i+'">'+(s[m.id]?'Super gebaut!':'')+'</p></div>';}).join('');
  var neu=s.m3?mcHTML('neu',QNEU.q,QNEU.o,s.neu,QNEU.a):'';
  var mv=s.neuOk?mcHTML('move',QMOVE.q,QMOVE.o,s.move,QMOVE.a):'';
  $('task').innerHTML=g+'<div><p class="eyebrow">Station 1 · Atom-Baukasten</p><h2>Woraus bestehen Ladungen?</h2></div>'+info+'<p class="hint"><b>Missionen:</b> '+'★'.repeat(stars)+'☆'.repeat(3-stars)+'</p>'+mis+neu+mv+
    (st.done[0]?'<p class="win"><b>Klasse!</b> Ein Atom ist ungeladen, wenn es gleich viele + und – hat. Nur Elektronen können wandern.</p>':'')+'<div class="row">'+nextBtn(0)+'</div>';
  Array.prototype.forEach.call(document.querySelectorAll('[data-m]'),function(b){b.addEventListener('click',function(){var i=+b.dataset.m,m=MISS[i],ok=m.check();tryInc('s1'+m.id,ok,M.atom.p+'/'+M.atom.e);
    var fb=$('fbm'+i);if(ok){s[m.id]=true;save();renderCtl();r1();}else{fb.className='fb bad';fb.textContent=m.hint();
      showHelp(fb,'s1'+m.id,function(){M.atom.p=3;M.atom.e=[3,4,1][i];kick();renderCtl();helpMsg('fbm'+i,'Das Modell ist jetzt richtig eingestellt. Schau es dir an und tippe auf „Prüfen“.');});}});});
  if(s.m3){bindMC('neu',QNEU.a,'s1neu',QNEU.ok,QNEU.bad,function(){s.neuOk=true;save();r1();showFb('neu',true,QNEU.ok);},function(j){s.neu=j;});if(s.neuOk)showFb('neu',true,QNEU.ok);}
  if(s.neuOk){bindMC('move',QMOVE.a,'s1move',QMOVE.ok,QMOVE.bad,function(){s.moveOk=true;finish(0);save();r1();showFb('move',true,QMOVE.ok);},function(j){s.move=j;});if(s.moveOk)showFb('move',true,QMOVE.ok);}
  bindNext();
}

/* ---------- Station 2: Reib-Maschine ---------- */

  {id:'a',q:'1. <b>Kunststoffstab + Wolltuch</b>, 5-mal gerieben. Die Elektronen wandern …',o:['vom Tuch zum Stab','vom Stab zum Tuch','gar nicht'],a:0,w:'Wähle „Kunststoffstab + Wolltuch“, stelle 5 Reibzüge ein und beobachte, wohin die blauen Punkte fliegen.'},
  {id:'b',q:'2. Der Kunststoffstab hat jetzt <b>zu viele</b> Elektronen. Er ist …',o:['negativ geladen','positiv geladen','ungeladen'],a:0,w:'Schau auf das Ladungskonto: Mehr + oder mehr –?'},
  {id:'c',q:'3. Das Wolltuch hat jetzt <b>zu wenige</b> Elektronen. Es ist …',o:['negativ geladen','positiv geladen','ungeladen'],a:1,w:'Beim Tuch fehlen Elektronen. Es bleiben mehr + als – übrig.'},
  {id:'d',q:'4. <b>Glasstab + Seidentuch</b>, gerieben. Die Elektronen wandern …',o:['vom Glasstab zur Seide','von der Seide zum Glasstab','gar nicht'],a:0,w:'Wähle „Glasstab + Seidentuch“ und reibe. Wohin fliegen die blauen Punkte?'}
];
var QSUM={q:'Schau auf das Ladungskonto: Was zeigt die Zeile „Zusammen“?',o:['Zusammen sind Stab und Tuch immer ungeladen. Die Ladung wird beim Reiben nur getrennt, nicht neu erzeugt.','Beim Reiben entsteht immer mehr Ladung.','Die Ladung des Tuchs verschwindet.'],a:0,
  ok:'Richtig! Was der eine an Elektronen bekommt, fehlt dem anderen. Darum sind Stab und Tuch immer entgegengesetzt geladen.',bad:['','Reibe weiter und schau auf „Zusammen“. Ändert sich die Zahl?','Schau auf das Tuch im Ladungskonto: Ist seine Ladung weg?']};
var FACH3='<div class="merk"><h3>Fachbegriffe</h3><ul style="margin:0;padding-left:1.2em"><li><span class="k">Elektronenüberschuss</span>: zu viele Elektronen. Der Gegenstand ist <b>negativ</b> geladen.</li><li><span class="k">Elektronenmangel</span>: zu wenige Elektronen. Der Gegenstand ist <b>positiv</b> geladen.</li></ul></div>';
function r2(){var s=st.s2;
  var obs='<div class="stack"><p class="eyebrow">Teil A · Im Modell reiben</p><p>Links und rechts siehst du je acht Atome. Mit dem Regler reibst du die beiden Körper aneinander. Beobachte die <b>Elektronen</b> und das <b>Ladungskonto</b>.</p>'+segQHTML(OBS2,s.obs,s.obsOk)+
    (s.obsOk?'':'<div class="row"><button class="btn pri" type="button" id="c2">Prüfen</button></div>')+'<p class="fb" id="fb2"></p></div>';
  var sum=s.obsOk?FACH3+mcHTML('sum',QSUM.q,QSUM.o,s.sum,QSUM.a):'';
  var own=s.sumOk?'<div class="q"><p><b>Erkläre es einem Mitschüler:</b> Warum ist der Kunststoffstab nach dem Reiben negativ geladen? Benutze das Wort <b>Elektronen</b>.</p><textarea class="free" id="own" rows="3" placeholder="Der Kunststoffstab ist negativ geladen, weil …">'+esc(s.own)+'</textarea>'+(s.ok?'':'<div class="row"><button class="btn pri" type="button" id="c2o">Fertig</button></div>')+'<p class="fb" id="fb2o"></p></div>':'';
  $('task').innerHTML='<div><p class="eyebrow">Station 2 · Reib-Maschine</p><h2>Was passiert beim Reiben im Inneren?</h2></div>'+obs+sum+own+
    (st.done[1]?'<p class="win"><b>Stark!</b> Beim Reiben wandern Elektronen von einem Körper zum anderen.</p>':'')+'<div class="row">'+nextBtn(1)+'</div>';
  bindSegQ(s.obs,function(){return s.obsOk;});

  if(s.sumOk){$('own').addEventListener('input',function(){s.own=this.value;save();});
    if(!s.ok)$('c2o').addEventListener('click',function(){var fb=$('fb2o');var t=(s.own||'').trim();if(t.length<15){fb.className='fb bad';fb.textContent='Schreibe einen ganzen Satz.';return;}if(!/elektron/i.test(t)){fb.className='fb bad';fb.textContent='Benutze das Wort „Elektronen“.';return;}s.ok=true;finish(1);save();r2();});
    else helpMsg('fb2o','Gespeichert.');}

/* ---------- Station 3: Ladungs-Detektiv ---------- */

  ok:'Genau! Gleichnamige Ladungen stoßen sich ab, das weißt du aus Stunde 2. Jetzt weißt du auch, woher die Ladung kommt.',bad:['','Die Ballons stoßen sich ab. Sind sie dann gleich oder verschieden geladen?','Protonen sitzen fest im Kern. Was kann wandern?']};

    (done?'<p class="win"><b>'+(g.score||0)+' von '+CARDS.length+' Punkten.</b> '+((g.score||0)>=6?'Starke Detektivarbeit!':'Du kannst noch einmal spielen und deinen Bestwert verbessern.')+'</p>':'<p class="note">Fall '+((g.i||0)+1)+' von '+CARDS.length+' · Punkte: '+(g.score||0)+'</p>')+'</div>';

  bindNext();

  var refl=s.ok?'<div class="guess stack"><p class="eyebrow pro">Zurück zu deiner Vermutung</p>'+

  var ov=document.createElement('div');ov.className='abg-ov';ov.hidden=true;
  ov.innerHTML='<div class="abg-box" role="dialog" aria-modal="true" aria-labelledby="abgH">'+

    '<p class="muted" style="font-size:14px">Klappt das Herunterladen nicht? Dann <button type="button" id="abgCopy" style="background:none;border:none;padding:0;color:var(--blue);text-decoration:underline;font:inherit;cursor:pointer">kopiert den Text</button> und fragt eure Lehrkraft.</p>'+

  document.body.appendChild(ov);
  var $n=ov.querySelector('#abgName'),$k=ov.querySelector('#abgKl'),$t=ov.querySelector('#abgTxt'),$f=ov.querySelector('#abgFb');
  function msg(ok,t){$f.className='abg-fb '+(ok?'ok':'bad');$f.textContent=t;}
  function open(){A=lget();if(!A.name&&typeof st!=='undefined'&&st.res&&st.res.name){A.name=st.res.name;A.klasse=A.klasse||st.res.klasse||'';}$n.value=A.name||'';$k.value=A.klasse||'';$t.hidden=true;msg(true,'');ov.hidden=false;setTimeout(function(){($n.value?ov.querySelector('#abgDl'):$n).focus();},30);}
