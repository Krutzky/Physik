<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Regenbogen-Labor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout wie „Linsen-Labor“: Kopfleiste mit Stationen-Weg · links optische Bank + Dia- und Schirm-Ansicht mit Lineal (fest) · rechts Steuerpult + Stationsaufgabe. */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface-2:#F3F5FA; --ink:#0B1442; --ink-soft:#4E5677; --line:#CBD3E1;
  --navy:#020C45; --navy-ink:#FFFFFF; --accent:#E8892B; --accent-ink:#1B1300; --blue:#1C66C0; --blue-soft:#DCE8F7; --on-blue:#FFFFFF;
  --ok:#22865A; --ok-soft:#DDF2E7; --bad:#C8423D; --bad-soft:#F9E1DF; --pro:#6B3FB0; --pro-soft:#ECE4F8;
  --grid:#E3E8F0; --axis:#4A5068; --rail:#5B6278; --lens:#9CC3F0; --lens-edge:#3A6AA8; --ray1:#E8892B; --ray2:#1C66C0; --red:#E8432E;
  --room:#14161D; --display:#111111; --display-ink:#FFC94D;
  --f-display:"Lexend","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",Calibri,system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#060B26; --surface:#0E1640; --surface-2:#141D4F; --ink:#EEF1FA; --ink-soft:#A9B1D3; --line:#2B3672;
  --navy:#020722; --navy-ink:#FFFFFF; --accent:#F3A04F; --accent-ink:#1B1300; --blue:#6FA8F0; --blue-soft:#1A2A63; --on-blue:#06102E;
  --ok:#4CC48A; --ok-soft:#123A2C; --bad:#F07A73; --bad-soft:#40181C; --pro:#B89AF0; --pro-soft:#2A1E52;
  --grid:#1E2858; --axis:#AEB6D8; --rail:#8792C2; --lens:#3D6FB0; --lens-edge:#9CC3F0; --ray1:#F3A04F; --ray2:#6FA8F0; --red:#F2604D;
  --room:#05060A; --display:#000000; --display-ink:#FFC94D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060B26; --surface:#0E1640; --surface-2:#141D4F; --ink:#EEF1FA; --ink-soft:#A9B1D3; --line:#2B3672;
  --navy:#020722; --navy-ink:#FFFFFF; --accent:#F3A04F; --accent-ink:#1B1300; --blue:#6FA8F0; --blue-soft:#1A2A63; --on-blue:#06102E;
  --ok:#4CC48A; --ok-soft:#123A2C; --bad:#F07A73; --bad-soft:#40181C; --pro:#B89AF0; --pro-soft:#2A1E52;
  --grid:#1E2858; --axis:#AEB6D8; --rail:#8792C2; --lens:#3D6FB0; --lens-edge:#9CC3F0; --ray1:#F3A04F; --ray2:#6FA8F0; --red:#F2604D;
  --room:#05060A; --display:#000000; --display-ink:#FFC94D; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

header{background:var(--navy);color:var(--navy-ink);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hwrap{max-width:1360px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;flex-direction:column}
.brand b{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.2px}
.brand span{font-size:13px;color:#8DB7EE}
.route{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.stop{display:flex;align-items:center;gap:8px;border:2px solid #34428F;background:transparent;color:#fff;border-radius:999px;padding:5px 12px 5px 6px;font-size:14px;font-weight:700}
.stop .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#24317A;font-size:13px}
.stop.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stop.on .n{background:rgba(0,0,0,.18);color:var(--accent-ink)}
.stop.done .n{background:var(--ok);color:#fff}
.stop.pro{border-style:dashed;border-color:#8E74D6}
.stop.pro.on{background:#B89AF0;border-color:#B89AF0;color:#1A0F33;border-style:solid}
.stop:disabled{opacity:.45;cursor:not-allowed}
.reset{background:transparent;border:1.5px solid #34428F;color:#B9C6EE;border-radius:999px;padding:5px 10px;font-size:13px}

main{max-width:1360px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.plot{position:sticky;top:env(safe-area-inset-top,0px);padding:10px;display:flex;flex-direction:column;gap:10px}
@media (max-width:900px){.plot{position:static}}
canvas{display:block;width:100%;border-radius:10px;touch-action:none}
.views{display:grid;grid-template-columns:repeat(2,minmax(0,250px));justify-content:center;gap:14px}
.view{display:flex;flex-direction:column;gap:4px;min-width:0}
.view canvas{aspect-ratio:1/1;max-width:100%;background:var(--room)}
.view small{font-size:13px;color:var(--ink-soft);text-align:center}
.view small b{color:var(--ink)}

.side{display:flex;flex-direction:column;gap:16px;min-width:0}
h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0 0 4px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0}
.eyebrow{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--blue);font-weight:700;margin:0 0 2px}
.eyebrow.pro{color:var(--pro)}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--ink-soft);font-size:15px}

/* Steuerpult */
.ctl{display:flex;flex-direction:column;gap:6px}
.lift{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:stretch}
.disp{background:var(--display);color:var(--display-ink);font-family:var(--f-mono);border-radius:12px;padding:6px 10px;text-align:center;box-shadow:inset 0 0 0 3px #333;display:flex;flex-direction:column;justify-content:center}
.disp small{font-size:11px;letter-spacing:2px;color:#9a9a9a}
.disp span{font-size:28px;letter-spacing:1px;font-variant-numeric:tabular-nums}
.disp.g{color:#9FD0FF}
.keys{display:flex;gap:8px;align-items:center}
.key{width:56px;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);font-size:22px;font-weight:700}
.key:active{background:var(--accent);color:var(--accent-ink)}
input[type=range]{width:100%;accent-color:var(--accent);height:30px}
input[type=range].gr{accent-color:var(--blue)}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.locked{font-size:15px;color:var(--ink-soft);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.chk{display:flex;align-items:center;gap:10px;font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--blue)}
.sep{border:0;border-top:1.5px dashed var(--line);margin:8px 0}

.num{width:4.6em;text-align:center;border:2px solid var(--line);border-radius:8px;padding:5px 2px;background:var(--surface);font-variant-numeric:tabular-nums}
.num.ok{border-color:var(--ok);background:var(--ok-soft)}
.num.bad{border-color:var(--bad);background:var(--bad-soft)}
.sel{font:inherit;border:2px solid var(--line);border-radius:8px;padding:4px 4px;background:var(--surface);max-width:100%}
.sel.ok{border-color:var(--ok);background:var(--ok-soft)}
.sel.bad{border-color:var(--bad);background:var(--bad-soft)}
.btn{border:none;border-radius:999px;padding:10px 18px;font-weight:700;font-size:16px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--surface);border:1.5px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn.tip{background:transparent;border:1.5px dashed var(--blue);color:var(--blue);padding:7px 14px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.choice{display:flex;flex-direction:column;gap:8px}
.choice.grid2{display:grid;grid-template-columns:1fr 1fr}
@media (max-width:440px){.choice.grid2{grid-template-columns:1fr}}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.opt b{font-family:var(--f-display)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.gopt{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center}
.gopt .L{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-family:var(--f-display);grid-row:1/3}
.gopt span{font-size:15px}
.seg{display:inline-flex;flex-wrap:wrap;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:7px 14px;font-weight:700}
.seg button.sel{background:var(--blue);color:var(--on-blue)}
.seg button.ok{background:var(--ok);color:#fff}
.seg button.bad{background:var(--bad);color:#fff}
.fb{font-weight:700;min-height:1.4em}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.note{border-left:4px solid var(--accent);background:var(--surface-2);padding:10px 12px;border-radius:0 10px 10px 0;font-size:15px}
.hint{border:1.5px dashed var(--blue);background:var(--blue-soft);border-radius:10px;padding:10px 12px;font-size:15px}
.win{border:2px solid var(--ok);background:var(--ok-soft);border-radius:12px;padding:12px}
.guess{border:2px solid var(--pro);background:var(--pro-soft);border-radius:12px;padding:12px}
.q{display:flex;flex-direction:column;gap:6px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.q p b{font-family:var(--f-display);font-weight:600}
.gap ol{padding-left:1.2em;margin:0}
.gap li{margin-bottom:10px}
.dots{display:flex;gap:6px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:block}
.dots i.on{background:var(--ok);border-color:var(--ok)}
.merk{border:2px solid var(--blue);border-radius:12px;padding:14px;background:var(--surface)}
.merk h3{color:var(--blue);margin-bottom:6px}
.merk .k{color:var(--blue);font-weight:700}
textarea.free{width:100%;border:2px solid var(--line);border-radius:10px;padding:8px;background:var(--surface);color:var(--ink)}
.bz{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}
.badge{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-family:var(--f-display)}
.tw{overflow-x:auto}
table.mt{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:15.5px}
table.mt th,table.mt td{border:1.5px solid var(--line);padding:6px 6px;text-align:center}
table.mt th{background:var(--surface-2);font-weight:700}
table.mt th small{display:block;font-weight:400;color:var(--ink-soft);font-size:12px}
table.mt tr.cur td{background:var(--blue-soft)}
table.mt tr.done td{background:var(--ok-soft)}
table.mt tr.lock td{color:var(--ink-soft)}
table.mt td.v b{font-size:16px}
.chart{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--ink-soft);padding:0 6px 4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---- Ergebnisse abgeben ---- */
.abg-btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700}
.abg-ov{position:fixed;inset:0;background:rgba(2,8,40,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto;z-index:50}
.abg-box{background:var(--surface);color:var(--ink);border-radius:16px;max-width:560px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.abg-box h2{margin:0}
.abg-box ol{margin:0;padding-left:1.3em}
.abg-box li{margin-bottom:6px}
.abg-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.abg-in{border:2px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);color:var(--ink);font:inherit}
.abg-copy{background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;padding:12px 22px;font-weight:700;font-size:18px}
.abg-close{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:700;color:var(--ink)}
.abg-fb{font-weight:700;min-height:1.4em}
.abg-fb.ok{color:var(--ok)} .abg-fb.bad{color:var(--bad)}
.abg-txt{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;border:2px solid var(--line);border-radius:10px;padding:8px;background:var(--surface-2);color:var(--ink)}
</style>
<style>
.ctlrow{display:flex;flex-direction:column;gap:4px}
.ctlrow > span{font-size:13px;color:var(--ink-soft);font-weight:700;letter-spacing:.5px}
.seg.full{display:flex}
.seg.full button{flex:1}
.gopt{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center}
.gopt .L{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-family:var(--f-display)}
.gopt span{font-size:15px}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand"><b>Regenbogen-Labor</b><span>Wie entsteht ein Regenbogen?</span></div>
    <nav class="route" id="route" aria-label="Stationen"></nav>
    <button class="abg-btn" id="abgBtn" type="button">Ergebnisse abgeben</button><button class="reset" id="reset" type="button">Neu starten</button>
  </div>
</header>
<main>
  <section class="card plot" aria-label="Modell">
    <canvas id="cv" aria-label="Modell: Prisma, Regentropfen oder Landschaft"></canvas>
    <div class="views">
      <div class="view"><canvas id="cvA"></canvas><small id="capA"></small></div>
      <div class="view"><canvas id="cvB"></canvas><small id="capB"></small></div>
    </div>
  </section>
  <aside class="side">
    <section class="card" id="ctlCard"><p class="eyebrow">Steuerpult</p><div id="ctl" class="ctl"></div></section>
    <section class="card stack" id="task"></section>
  </aside>
</main>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var STATIONS=[
  {key:'s1',name:'Prisma',scene:'prism'},
  {key:'s2',name:'Regentropfen',scene:'drop'},
  {key:'s3',name:'Himmel',scene:'sky'},
  {key:'s4',name:'Merksatz',scene:'sky'},
  {key:'s5',name:'Profi-Zusatz',pro:true,scene:'drop'}
];
/* Farben: Name, Anzeige-Farbe, Brechzahl Glas (Unterschiede überzeichnet), Brechzahl Wasser (echt) */
var COLS=[
  {n:'Rot',c:'#E8322B',ng:1.500,nw:1.3310},
  {n:'Orange',c:'#F28C28',ng:1.510,nw:1.3325},
  {n:'Gelb',c:'#F5D42A',ng:1.520,nw:1.3335},
  {n:'Grün',c:'#3DB54A',ng:1.532,nw:1.3350},
  {n:'Blau',c:'#2F6FD3',ng:1.546,nw:1.3380},
  {n:'Violett',c:'#8A3FC7',ng:1.560,nw:1.3435}
];
var st={station:0,done:[false,false,false,false,false],guess:null,
  pAng:48,filter:'white', b:50,dfilter:'red',many:false,refl2:false, sun:20,obs:30,friend:false,
  s1:{real:{},realOk:false,kreuz:{},kreuzOk:false,why:null,whyOk:false,own:'',ok:false},
  s2:{path:null,pathOk:false,max:false,peak:null,peakOk:false,outer:null,outerOk:false,tip:0},
  s3:{sunq:null,sunqOk:false,high:null,highOk:false,walk:null,walkOk:false,friendq:null,friendqOk:false},
  s4:{gaps:{},ok:false,refl:'',hose:null,hoseOk:false},
  s5:{a:null,b:null},res:{},tries:{},help:{},t0:null};

/* ---------- Speicher ---------- */
var KEY='regenbogen-labor-v1',RKEY='regenbogen-labor-resets';
function save(){try{localStorage.setItem(KEY,JSON.stringify({station:st.station,done:st.done,guess:st.guess,s1:st.s1,s2:st.s2,s3:st.s3,s4:st.s4,s5:st.s5,res:st.res,tries:st.tries,help:st.help,t0:st.t0}));}catch(e){}}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||'null');if(!x)return;
  st.station=x.station||0;if(x.done)st.done=x.done;while(st.done.length<5)st.done.push(false);st.guess=x.guess||null;
  ['s1','s2','s3','s4','s5'].forEach(function(k){if(x[k])st[k]=Object.assign(st[k],x[k]);});
  if(x.res)st.res=x.res;if(x.tries)st.tries=x.tries;if(x.help)st.help=x.help;if(x.t0)st.t0=x.t0;}catch(e){}}
function tryInc(k,ok,val){var t=st.tries[k]||(st.tries[k]={n:0,ok:false,first:null});if(t.ok)return;t.n++;if(t.first===null)t.first=!!ok;if(ok)t.ok=true;else if(val!=null&&val!==''){t.w=t.w||[];if(t.w.length<12)t.w.push(val);}save();}
function stuck(k){var t=st.tries[k];return !!(t&&!t.ok&&t.n>=3);}
function showHelp(fb,k,fn){if(!fb||!stuck(k))return;var id='hb_'+k;if(document.getElementById(id))return;var b=document.createElement('button');b.type='button';b.id=id;b.className='btn tip';b.style.marginTop='6px';b.textContent='Ich komme nicht weiter: Lösung zeigen';
  b.addEventListener('click',function(){st.help[k]=true;save();fn();});var wrap=document.createElement('div');wrap.className='row';wrap.appendChild(b);(fb.parentNode.classList&&fb.parentNode.classList.contains('row')?fb.parentNode:fb).insertAdjacentElement('afterend',wrap);}
function helpMsg(id,t){var f=$(id);if(f){f.className='fb ok';f.textContent=t;}}
function fnv(str){var h=0x811c9dc5;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return ('0000000'+h.toString(16)).slice(-8);}
function resets(){try{return +(localStorage.getItem(RKEY)||0);}catch(e){return 0;}}
function fmt(v,d){var p=Math.pow(10,d||0);return String(Math.round(v*p)/p).replace('.',',');}

/* ---------- Vektor-Optik ---------- */
function norm(v){var l=Math.hypot(v[0],v[1]);return [v[0]/l,v[1]/l];}
function dot(a,b){return a[0]*b[0]+a[1]*b[1];}
/* Brechung: d Richtung, nrm Normale gegen d, eta=n1/n2; null bei Totalreflexion */
function refract(d,nrm,eta){var ci=-dot(nrm,d),k=1-eta*eta*(1-ci*ci);if(k<0)return null;var f=eta*ci-Math.sqrt(k);return norm([eta*d[0]+f*nrm[0],eta*d[1]+f*nrm[1]]);}
function reflect(d,m){var k=2*dot(d,m);return [d[0]-k*m[0],d[1]-k*m[1]];}
/* Regentropfen (Einheitskreis, y nach oben): b = Auftreffhöhe 0..1, k Spiegelungen. Liefert Punkte und Winkel zur Gegenrichtung der Sonne */
function dropTrace(b,n,k){
  var p=[-Math.sqrt(1-b*b),b],d=[1,0],pts=[[p[0]-2.2,b],p];
  d=refract(d,p,1/n);
  for(var j=0;j<=k;j++){var t=-2*dot(p,d);p=[p[0]+t*d[0],p[1]+t*d[1]];pts.push(p);if(j<k)d=reflect(d,p);}
  var out=refract(d,[-p[0],-p[1]],n);if(!out)return null;
  var ang=Math.acos(Math.max(-1,Math.min(1,-out[0])))*180/Math.PI;
  return {pts:pts,out:out,ang:ang,exit:p};
}
var MAXANG={};COLS.forEach(function(c){var m=0;for(var i=1;i<1000;i++){var r=dropTrace(i/1000,c.nw,1);if(r&&r.ang>m)m=r.ang;}MAXANG[c.n]=m;});
var MAXANG2={};COLS.forEach(function(c){var m=999;for(var i=1;i<1000;i++){var r=dropTrace(i/1000,c.nw,2);if(r&&r.ang<m)m=r.ang;}MAXANG2[c.n]=m;});

/* ---------- Zeichnen ---------- */
function col(n){return getComputedStyle(document.documentElement).getPropertyValue('--'+n).trim();}

var cv=$('cv'),ctx=cv.getContext('2d'),W=0,H=0;
function line(x1,y1,x2,y2,c,w,dash,alpha){ctx.save();ctx.globalAlpha=alpha==null?1:alpha;ctx.strokeStyle=c;ctx.lineWidth=w||2;ctx.setLineDash(dash||[]);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();}
function tag(t,x,y,c,align){ctx.font=font(13,true);ctx.textBaseline='middle';ctx.textAlign=align||'center';var w=ctx.measureText(t).width,x0=align==='left'?x:align==='right'?x-w:x-w/2;
  ctx.fillStyle=col('surface');ctx.globalAlpha=.92;ctx.fillRect(x0-4,y-10,w+8,20);ctx.globalAlpha=1;ctx.fillStyle=c;ctx.fillText(t,x,y);}
function resize(){var w=cv.getBoundingClientRect().width||640,h=Math.round(Math.max(260,Math.min(w*0.58,430))),dpr=window.devicePixelRatio||1;
  cv.style.height=h+'px';cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);W=w;H=h;sizeView($('cvA'));sizeView($('cvB'));draw();}
function sizeView(c){var w=c.getBoundingClientRect().width||220,dpr=window.devicePixelRatio||1;c.width=Math.round(w*dpr);c.height=Math.round(w*dpr);c._dpr=dpr;}
function draw(){if(!W)return;var sc=STATIONS[st.station].scene;var dark=sc==='prism'||sc==='drop';ctx.fillStyle=dark?'#141826':col('surface');ctx.fillRect(0,0,W,H);
  if(sc==='prism')drawPrism();else if(sc==='drop')drawDrop();else drawSky();}

/* --- Prisma --- */
function prismResults(){
  var cx=W*0.44,cy=H*0.58,sd=Math.min(W*0.30,H*0.66),hgt=sd*Math.sqrt(3)/2;
  var A=[cx,cy-hgt*0.62],B=[cx-sd/2,cy+hgt*0.38],C=[cx+sd/2,cy+hgt*0.38];
  var nOutL=norm([-(B[1]-A[1]),-(A[0]-B[0])]);if(nOutL[0]>0)nOutL=[-nOutL[0],-nOutL[1]];
  var nOutR=norm([C[1]-A[1],-(C[0]-A[0])]);if(nOutR[0]<0)nOutR=[-nOutR[0],-nOutR[1]];
  var E=[A[0]+(B[0]-A[0])*0.58,A[1]+(B[1]-A[1])*0.58];
  var base=Math.atan2(-nOutL[1],-nOutL[0]),ang=base-st.pAng*Math.PI/180,d=[Math.cos(ang),Math.sin(ang)];
  var screenX=W*0.94,res=[];
  COLS.forEach(function(c){var d1=refract(d,nOutL,1/c.ng);
    var ux=C[0]-A[0],uy=C[1]-A[1],den=d1[0]*uy-d1[1]*ux,t=((A[0]-E[0])*uy-(A[1]-E[1])*ux)/den,X=[E[0]+d1[0]*t,E[1]+d1[1]*t];
    var d2=refract(d1,[-nOutR[0],-nOutR[1]],c.ng);if(!d2){res.push({c:c,X:X,tir:true,dev:0});return;}
    var t2=(screenX-X[0])/d2[0],Y=[screenX,X[1]+d2[1]*t2];
    var dev=Math.acos(Math.max(-1,Math.min(1,dot(d,d2))))*180/Math.PI;
    res.push({c:c,X:X,Y:Y,d2:d2,dev:dev});});
  return {A:A,B:B,C:C,E:E,d:d,res:res,screenX:screenX};
}
function drawPrism(){
  var P=prismResults(),cols=st.filter==='red'?[0]:[0,1,2,3,4,5];
  /* Lampe + weißer Strahl */
  var L0=[P.E[0]-P.d[0]*Math.min(W*0.32,(P.E[0]-40)/Math.max(.2,P.d[0])),P.E[1]-P.d[1]*Math.min(W*0.32,(P.E[0]-40)/Math.max(.2,P.d[0]))];
  line(L0[0],L0[1],P.E[0],P.E[1],st.filter==='red'?'#E8322B':'#FFFFFF',6,null,.95);
  ctx.save();ctx.translate(L0[0],L0[1]);ctx.rotate(Math.atan2(P.d[1],P.d[0]));ctx.fillStyle='#3A3F55';ctx.fillRect(-34,-14,34,28);ctx.fillStyle='#FFE58A';ctx.fillRect(-4,-8,6,16);ctx.restore();
  if(st.filter==='red'){var fm=[L0[0]+(P.E[0]-L0[0])*0.45,L0[1]+(P.E[1]-L0[1])*0.45];ctx.save();ctx.translate(fm[0],fm[1]);ctx.rotate(Math.atan2(P.d[1],P.d[0]));ctx.fillStyle='rgba(232,50,43,.85)';ctx.fillRect(-5,-22,10,44);ctx.restore();tag('Rotfilter',fm[0],fm[1]-34,'#E8322B');
    line(L0[0],L0[1],fm[0],fm[1],'#FFFFFF',6,null,.95);}
  /* Prisma */
  ctx.beginPath();ctx.moveTo(P.A[0],P.A[1]);ctx.lineTo(P.B[0],P.B[1]);ctx.lineTo(P.C[0],P.C[1]);ctx.closePath();ctx.fillStyle='rgba(170,210,255,.22)';ctx.fill();ctx.strokeStyle='#9CC3F0';ctx.lineWidth=2;ctx.stroke();
  ctx.font=font(13,true);ctx.fillStyle='#C9D3F2';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText('Prisma (Glas)',(P.B[0]+P.C[0])/2,P.B[1]+8);
  /* Schirm */
  ctx.fillStyle='#F3F4F6';ctx.fillRect(P.screenX,H*0.08,8,H*0.84);
  cols.forEach(function(i){var r=P.res[i];if(r.tir)return;line(P.E[0],P.E[1],r.X[0],r.X[1],r.c.c,2,null,.9);line(r.X[0],r.X[1],r.Y[0],r.Y[1],r.c.c,st.filter==='red'?4:3,null,.95);
    ctx.fillStyle=r.c.c;ctx.fillRect(P.screenX-2,r.Y[1]-4,12,8);});
  ctx.font=font(12,true);ctx.fillStyle='#C9D3F2';ctx.textAlign='right';ctx.textBaseline='top';ctx.fillText('Schirm',P.screenX-6,H*0.08);
  if(st.filter!=='red'){var r0=P.res[0],r5=P.res[5];if(!r0.tir&&!r5.tir){tag('Rot',P.screenX-26,r0.Y[1],'#E8322B');tag('Violett',P.screenX-34,r5.Y[1],'#8A3FC7');}}
  ctx.font=font(11);ctx.fillStyle='#8E97B8';ctx.textAlign='left';ctx.textBaseline='bottom';ctx.fillText('Farbunterschiede überzeichnet',8,H-6);
  renderPrismViews(P);
}
function renderPrismViews(P){
  $('capA').innerHTML='<b>Auf dem Schirm</b>';$('capB').innerHTML='<b>Wie stark abgelenkt?</b>';
  var c=$('cvA'),x=c.getContext('2d'),w=c.width;x.setTransform(1,0,0,1,0,0);x.fillStyle='#F4F1EA';x.fillRect(0,0,w,w);
  var cols=st.filter==='red'?[0]:[0,1,2,3,4,5],bw=w*0.6,top=w*0.16,hh=w*0.68/6;
  cols.forEach(function(i,k){x.fillStyle=COLS[i].c;x.fillRect((w-bw)/2,top+i*hh,bw,hh+1);});
  if(st.filter==='red'){x.fillStyle='#6B7280';x.font=Math.round(w/14)+'px '+getComputedStyle(document.body).fontFamily;x.textAlign='center';x.fillText('nur Rot',w/2,w*0.9);}
  var c2=$('cvB'),y=c2.getContext('2d'),w2=c2.width;y.setTransform(1,0,0,1,0,0);y.fillStyle='#FFFFFF';y.fillRect(0,0,w2,w2);
  var devs=P.res.map(function(r){return r.dev||0;}),mn=Math.min.apply(null,devs)-2,mx=Math.max.apply(null,devs)+0.5;
  var fs=Math.round(w2/16);y.font=fs+'px '+getComputedStyle(document.body).fontFamily;
  P.res.forEach(function(r,i){if(st.filter==='red'&&i>0)return;var yy=w2*0.1+i*w2*0.14,len=(r.dev-mn)/(mx-mn)*(w2*0.55);y.fillStyle=r.c.c;y.fillRect(w2*0.34,yy,Math.max(4,len),w2*0.1);y.fillStyle='#1A1F36';y.textAlign='right';y.textBaseline='middle';y.fillText(r.c.n,w2*0.31,yy+w2*0.05);});
}

/* --- Regentropfen --- */
function dropGeom(){var R=Math.min(H*0.30,W*0.19);return {cx:W*0.46,cy:H*0.40,R:R};}
function drawDrop(){
  var G=dropGeom(),k=st.refl2?2:1;
  function P(p){return [G.cx+p[0]*G.R,G.cy-p[1]*G.R];}
  /* Sonne */
  ctx.fillStyle='#FFD666';ctx.beginPath();ctx.arc(26,30,16,0,Math.PI*2);ctx.fill();ctx.font=font(12,true);ctx.fillStyle='#FFE7A0';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText('Sonnenlicht →',48,30);
  for(var yy=-0.9;yy<=0.91;yy+=0.3){var a=P([-2.3,yy]),b0=P([-Math.sqrt(1-yy*yy),yy]);line(a[0],a[1],b0[0],b0[1],'#FFFFFF',1,[3,5],.25);}
  /* Tropfen */
  ctx.beginPath();ctx.arc(G.cx,G.cy,G.R,0,Math.PI*2);ctx.fillStyle='rgba(120,180,255,.18)';ctx.fill();ctx.strokeStyle='#9CC3F0';ctx.lineWidth=2;ctx.stroke();
  ctx.font=font(12,true);ctx.fillStyle='#C9D3F2';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText('Regentropfen (stark vergrößert)',G.cx+G.R*0.75,G.cy-G.R*0.95);
  var cols=st.dfilter==='red'?[COLS[0]]:COLS,b=st.b/100*0.995;
  if(st.many){ /* viele rote Strahlen */
    for(var i=1;i<=28;i++){var bb=i/29;var r=dropTrace(bb,COLS[0].nw,k);if(!r)continue;var e=P(r.exit),L=W;line(e[0],e[1],e[0]+r.out[0]*L,e[1]-r.out[1]*L,'#E8322B',1.2,null,.45);}
  }
  var main=null;
  cols.forEach(function(c){var r=dropTrace(b,c.nw,k);if(!r)return;if(c===COLS[0])main=r;
    for(var j=0;j<r.pts.length-1;j++){var a=P(r.pts[j]),q=P(r.pts[j+1]);line(a[0],a[1],q[0],q[1],j===0?'#FFFFFF':c.c,j===0?3:2,null,.95);}
    var e=P(r.exit);line(e[0],e[1],e[0]+r.out[0]*W,e[1]-r.out[1]*W,c.c,2.5,null,.95);});
  if(!main)main=dropTrace(b,COLS[0].nw,k);
  /* Winkel anzeigen: Gegenrichtung der Sonne und austretender Strahl (rot) */
  if(main){var e=P(main.exit),ref=[e[0]-W*0.25,e[1]];line(e[0],e[1],ref[0],ref[1],'#C9D3F2',1.5,[6,5],.8);
    var a1=Math.PI,a2=Math.atan2(-main.out[1],main.out[0]);ctx.save();ctx.strokeStyle='#FFE7A0';ctx.lineWidth=2;ctx.beginPath();ctx.arc(e[0],e[1],46,Math.min(a1,a2<0?a2+2*Math.PI:a2),Math.max(a1,a2<0?a2+2*Math.PI:a2));ctx.stroke();ctx.restore();
    tag(fmt(main.ang,1)+'°',e[0]-62,e[1]+(main.out[1]>0?-26:26),'#B05A12');}
  ctx.font=font(11);ctx.fillStyle='#8E97B8';ctx.textAlign='right';ctx.textBaseline='bottom';ctx.fillText('gestrichelt: Richtung zurück zur Sonne',W-8,H-6);
  renderDropViews(k,b);
  var d=$('dispA');if(d&&main)d.textContent=fmt(main.ang,1)+'°';
}
function renderDropViews(k,b){
  $('capA').innerHTML='<b>Austrittswinkel der Farben</b>';$('capB').innerHTML='<b>Wie viel Licht bei welchem Winkel?</b> (Rot)';
  var c=$('cvA'),x=c.getContext('2d'),w=c.width,ff=getComputedStyle(document.body).fontFamily;x.setTransform(1,0,0,1,0,0);x.fillStyle='#FFFFFF';x.fillRect(0,0,w,w);
  var lo=k===1?30:44,hi=k===1?45:60;function X(a){return w*0.1+(a-lo)/(hi-lo)*w*0.8;}
  x.strokeStyle='#9CA3AF';x.lineWidth=w/200;x.beginPath();x.moveTo(X(lo),w*0.8);x.lineTo(X(hi),w*0.8);x.stroke();x.font=Math.round(w/16)+'px '+ff;x.fillStyle='#4E5677';x.textAlign='center';x.textBaseline='top';
  for(var a=lo;a<=hi;a+=5){x.fillRect(X(a)-1,w*0.78,2,w*0.04);x.fillText(a+'°',X(a),w*0.84);}
  COLS.forEach(function(cc,i){var r=dropTrace(b,cc.nw,k);if(!r)return;var y=w*0.12+i*w*0.105;x.fillStyle=cc.c;x.beginPath();x.arc(X(Math.max(lo,Math.min(hi,r.ang))),y+w*0.04,w*0.035,0,Math.PI*2);x.fill();x.fillStyle='#1A1F36';x.textAlign='left';x.textBaseline='middle';x.font=Math.round(w/18)+'px '+ff;x.fillText(cc.n,w*0.02,y+w*0.04);});
  /* Histogramm */
  var c2=$('cvB'),y2=c2.getContext('2d'),w2=c2.width;y2.setTransform(1,0,0,1,0,0);y2.fillStyle='#FFFFFF';y2.fillRect(0,0,w2,w2);
  var bins=new Array(16).fill(0),blo=k===1?0:44,bhi=k===1?48:64;for(var i=1;i<2000;i++){var r2=dropTrace(i/2000,COLS[0].nw,k);if(!r2)continue;var bi=Math.floor((r2.ang-blo)/(bhi-blo)*16);if(bi>=0&&bi<16)bins[bi]++;}
  var mx=Math.max.apply(null,bins);bins.forEach(function(v,i){var bw=w2*0.8/16,hh=v/mx*w2*0.62;y2.fillStyle=i===bins.indexOf(mx)?'#E8322B':'#F2A39F';y2.fillRect(w2*0.1+i*bw+1,w2*0.78-hh,bw-2,hh);});
  y2.fillStyle='#4E5677';y2.font=Math.round(w2/16)+'px '+ff;y2.textAlign='center';y2.textBaseline='top';[blo,(blo+bhi)/2,bhi].forEach(function(a){y2.fillText(Math.round(a)+'°',w2*0.1+(a-blo)/(bhi-blo)*w2*0.8,w2*0.82);});
  y2.textAlign='left';y2.fillText('Lichtmenge',w2*0.04,w2*0.05);

/* --- Himmel (Seitenansicht) --- */
function skyGeom(){return {gy:H*0.84,eyeH:34};}
function drops(){var a=[];for(var i=0;i<16;i++)for(var j=0;j<11;j++){a.push([0.56+i*0.027+(j%2)*0.0135,0.08+j*0.065]);}return a;}
var DROPS=drops();
function litColor(elev){var h=st.sun;for(var i=0;i<COLS.length;i++){var ang=MAXANG[COLS[i].n]-h;if(Math.abs(elev-ang)<0.55)return COLS[i].c;}return null;}
function drawSky(){
  var G=skyGeom(),h=st.sun,hr=h*Math.PI/180;
  /* Himmel/Boden */
  var g=ctx.createLinearGradient(0,0,0,G.gy);g.addColorStop(0,'#BFD9F2');g.addColorStop(1,'#E8F1FA');ctx.fillStyle=g;ctx.fillRect(0,0,W,G.gy);ctx.fillStyle='#8DBF6A';ctx.fillRect(0,G.gy,W,H-G.gy);
  /* Regenwand */
  ctx.fillStyle='rgba(90,105,135,.18)';ctx.fillRect(W*0.54,0,W*0.46,G.gy);ctx.font=font(12,true);ctx.fillStyle='#4E5677';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText('Regenschauer',W*0.77,4);
  /* Sonne + Strahlen */
  var sx=W*0.06,sy=G.gy-Math.tan(hr)*W*0.06-30-Math.min(H*0.6,h*H/70);sy=Math.max(22,G.gy-30-(h/60)*G.gy*0.9);
  ctx.fillStyle='#F5B82E';ctx.beginPath();ctx.arc(sx,sy,15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#B05A12';ctx.font=font(12,true);ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText('Sonne '+h+'°',sx+20,sy-16);
  var dir=[Math.cos(hr),Math.sin(hr)];
  for(var k=-2;k<=2;k++){var x0=sx+k*30*-dir[1],y0=sy+k*30*dir[0];line(x0,y0,x0+dir[0]*W*1.2,y0+dir[1]*W*1.2,'#F5B82E',1.5,[8,6],.55);}
  /* Personen */
  var people=[{x:W*st.obs/100,c:'#1A1F36',n:'Du'}];if(st.friend)people.push({x:W*st.obs/100-W*0.09,c:'#B05A12',n:'Freundin'});
  people.forEach(function(p,pi){var ex=p.x,ey=G.gy-G.eyeH;
    ctx.strokeStyle=p.c;ctx.lineWidth=3;ctx.beginPath();ctx.arc(ex,ey,7,0,Math.PI*2);ctx.stroke();line(ex,ey+7,ex,G.gy-14,p.c,3);line(ex,G.gy-14,ex-7,G.gy,p.c,3);line(ex,G.gy-14,ex+7,G.gy,p.c,3);line(ex,ey+14,ex+10,ey+22,p.c,3);
    ctx.font=font(12,true);ctx.fillStyle=p.c;ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(p.n,ex,G.gy+4);
    /* Schattenlinie (Gegenpunkt der Sonne) */
    if(pi===0){var t=(G.gy-ey)/dir[1];if(h>0)line(ex,ey,ex+dir[0]*Math.min(t,W),ey+dir[1]*Math.min(t,W),'#4E5677',1.5,[4,4],.8);
      var e1=(MAXANG.Rot-h)*Math.PI/180,len=W*0.62;
      if(MAXANG.Rot-h>0){line(ex,ey,ex+Math.cos(e1)*len,ey-Math.sin(e1)*len,'#E8322B',2,null,.9);var e2=(MAXANG.Violett-h)*Math.PI/180;line(ex,ey,ex+Math.cos(e2)*len,ey-Math.sin(e2)*len,'#8A3FC7',2,null,.9);
        ctx.save();ctx.strokeStyle='#1A1F36';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(ex,ey,56,-e1,hr);ctx.stroke();ctx.restore();tag('42°',ex+64*Math.cos((hr-e1)/2),ey+64*Math.sin((hr-e1)/2),'#1A1F36');}
    }
    /* leuchtende Tropfen für diese Person */
    DROPS.forEach(function(dp){var dx=dp[0]*W,dy=dp[1]*G.gy;var elev=Math.atan2(ey-dy,dx-ex)*180/Math.PI;var c=litColor(elev);
      if(pi===0&&!c){ctx.fillStyle='rgba(70,90,130,.35)';ctx.beginPath();ctx.arc(dx,dy,1.8,0,Math.PI*2);ctx.fill();}
      if(c){ctx.fillStyle=c;ctx.strokeStyle=pi===0?'#fff':'#B05A12';ctx.lineWidth=pi===0?1:2;ctx.beginPath();ctx.arc(dx,dy,pi===0?5:6,0,Math.PI*2);if(pi===0)ctx.fill();ctx.stroke();}});
  });
  if(MAXANG.Rot-h<=0)tag('Sonne zu hoch: Der Regenbogen liegt unter dem Horizont',W/2,H*0.45,'#C8423D');
  ctx.font=font(11);ctx.fillStyle='#4E5677';ctx.textAlign='right';ctx.textBaseline='bottom';ctx.fillText('Seitenansicht, nicht maßstäblich',W-8,H-4);
  renderSkyViews();
}
function rainbowView(c,full){
  var x=c.getContext('2d'),w=c.width,h=st.sun,ff=getComputedStyle(document.body).fontFamily;x.setTransform(1,0,0,1,0,0);
  var hz=w*0.72,deg=w/110,cx=w/2,cy=hz+h*deg;
  var g=x.createLinearGradient(0,0,0,hz);g.addColorStop(0,'#9DC4EC');g.addColorStop(1,'#DCEAF8');x.fillStyle=g;x.fillRect(0,0,w,hz);x.fillStyle='#8DBF6A';x.fillRect(0,hz,w,w-hz);
  x.save();if(!full){x.beginPath();x.rect(0,0,w,hz);x.clip();}
  COLS.forEach(function(cc,i){var r=MAXANG[cc.n]*deg;x.strokeStyle=cc.c;x.globalAlpha=.85;x.lineWidth=deg*0.55;x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.stroke();});
  x.restore();
  if(full){x.save();x.setLineDash([w/60,w/60]);x.strokeStyle='rgba(30,30,30,.5)';x.lineWidth=w/150;x.beginPath();x.moveTo(0,hz);x.lineTo(w,hz);x.stroke();x.restore();}
  /* Kopfschatten = Gegenpunkt */
  if(cy<w){x.fillStyle='#1A1F36';x.beginPath();x.arc(cx,cy,w/50,0,Math.PI*2);x.fill();}
  x.fillStyle='#1A1F36';x.font=Math.round(w/17)+'px '+ff;x.textAlign='left';x.textBaseline='top';x.fillText(full?'ganzer Kreis':'Horizont',w*0.03,full?w*0.03:hz+w*0.02);
}
function renderSkyViews(){$('capA').innerHTML='<b>So siehst du den Regenbogen</b>';$('capB').innerHTML='<b>Eigentlich ein Kreis</b> (Punkt: Schatten deines Kopfes)';rainbowView($('cvA'),false);rainbowView($('cvB'),true);}

/* ---------- Steuerpult ---------- */
function segHTML(id,opts,cur){return '<span class="seg full" id="'+id+'">'+opts.map(function(o){return '<button type="button" data-v="'+o[0]+'" class="'+(String(o[0])===String(cur)?'sel':'')+'">'+o[1]+'</button>';}).join('')+'</span>';}
function bindSeg(id,fn){var el=$(id);if(!el)return;Array.prototype.forEach.call(el.children,function(b){b.addEventListener('click',function(){Array.prototype.forEach.call(el.children,function(x){x.className=x===b?'sel':'';});fn(b.dataset.v);});});}
function slider(id,lab,disp,min,max,step,val,lo,hi,cls){return '<div class="lift"><div class="disp'+(cls?' '+cls:'')+'"><small>'+lab+'</small><span id="disp'+id+'">'+disp+'</span></div><div class="keys"><button class="key" id="'+id+'m" type="button" aria-label="weniger">◀</button><button class="key" id="'+id+'p" type="button" aria-label="mehr">▶</button></div></div>'+
  '<input type="range" id="'+id+'S" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'" aria-label="'+lab+'"><div class="scale"><span>'+lo+'</span><span>'+hi+'</span></div>';}
function bindSlider(id,get,set,step,min,max){function u(v){v=Math.max(min,Math.min(max,v));set(v);$(id+'S').value=v;draw();}
  $(id+'S').addEventListener('input',function(){u(parseFloat(this.value));});$(id+'m').addEventListener('click',function(){u(get()-step);});$(id+'p').addEventListener('click',function(){u(get()+step);});}
function renderCtl(){
  var sc=STATIONS[st.station].scene,h='';
  if(sc==='prism'){h=slider('P','EINFALLSWINKEL',st.pAng+'°',35,70,1,st.pAng,'35°','70°','g')+'<div class="ctlrow"><span>LICHT</span>'+segHTML('sF',[['white','weißes Licht'],['red','nur rotes Licht (Filter)']],st.filter)+'</div>';}
  else if(sc==='drop'){h=slider('B','AUFTREFFHÖHE',st.b+' %',0,99,1,st.b,'Mitte','Rand','g')+
    '<div class="disp"><small>WINKEL ZUR SONNENRICHTUNG (ROT)</small><span id="dispA">–</span></div>'+
    '<div class="ctlrow"><span>LICHT</span>'+segHTML('sD',[['red','nur Rot'],['white','weißes Licht']],st.dfilter)+'</div>'+
    '<label class="chk"><input type="checkbox" id="tMany"'+(st.many?' checked':'')+'> viele rote Strahlen zeigen</label>'+
    (STATIONS[st.station].key==='s5'?'<label class="chk"><input type="checkbox" id="tR2"'+(st.refl2?' checked':'')+'> zwei Spiegelungen im Tropfen</label>':'');}
  else{h=slider('H','SONNENHÖHE',st.sun+'°',0,60,1,st.sun,'0° (Horizont)','60° (hoch)')+slider('O','DEIN STANDORT',st.obs+' %',12,48,1,st.obs,'weiter weg','näher am Regen','g')+
    '<label class="chk"><input type="checkbox" id="tFr"'+(st.friend?' checked':'')+'> Freundin daneben stellen</label>';}
  $('ctl').innerHTML=h;
  if(sc==='prism'){bindSlider('P',function(){return st.pAng;},function(v){st.pAng=v;$('dispP').textContent=v+'°';},1,35,70);bindSeg('sF',function(v){st.filter=v;draw();});}
  else if(sc==='drop'){bindSlider('B',function(){return st.b;},function(v){st.b=v;$('dispB').textContent=v+' %';},1,0,99);bindSeg('sD',function(v){st.dfilter=v;draw();});
    $('tMany').addEventListener('change',function(){st.many=this.checked;draw();});if($('tR2'))$('tR2').addEventListener('change',function(){st.refl2=this.checked;draw();});}
  else{bindSlider('H',function(){return st.sun;},function(v){st.sun=v;$('dispH').textContent=v+'°';},1,0,60);bindSlider('O',function(){return st.obs;},function(v){st.obs=v;$('dispO').textContent=v+' %';},1,12,48);
    $('tFr').addEventListener('change',function(){st.friend=this.checked;draw();});}
}

/* ---------- Stationen-Weg & Bausteine ---------- */
function unlocked(i){return i===0||st.done[i-1];}
function renderRoute(){var h='';STATIONS.forEach(function(s,i){var cls='stop'+(s.pro?' pro':'')+(i===st.station?' on':'')+(st.done[i]?' done':'');
    h+='<button type="button" class="'+cls+'" data-i="'+i+'"'+(unlocked(i)?'':' disabled')+'><span class="n">'+(st.done[i]?'✓':(s.pro?'★':(i+1)))+'</span>'+s.name+'</button>';});
  $('route').innerHTML=h;Array.prototype.forEach.call($('route').querySelectorAll('.stop'),function(b){b.addEventListener('click',function(){go(+b.dataset.i);});});}
function go(i){if(!unlocked(i))return;st.station=i;save();render();window.scrollTo({top:0,behavior:'smooth'});}
function finish(i){if(!st.done[i]){st.done[i]=true;save();renderRoute();}}
function nextBtn(i){if(!st.done[i]||i>=STATIONS.length-1)return '';var n=STATIONS[i+1];return '<button class="btn pri" type="button" id="nextSt">'+(n.pro?'Zu den Profi-Aufgaben ★':'Weiter zu Station '+(i+2)+': '+n.name)+' →</button>';}
function bindNext(){var b=$('nextSt');if(b)b.addEventListener('click',function(){go(st.station+1);});}
function esc(t){return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function mcHTML(id,q,opts,val,ans,grid){return '<div class="q"><p><b>'+q+'</b></p><div class="choice'+(grid?' grid2':'')+'" data-mc="'+id+'">'+opts.map(function(o,j){return '<button type="button" class="opt'+(val===j?(j===ans?' ok':' bad'):'')+'" data-j="'+j+'">'+o+'</button>';}).join('')+'</div><p class="fb" id="fb_'+id+'"></p></div>';}
function bindMC(id,ans,key,okMsg,badMsgs,onOk,store){var box=document.querySelector('[data-mc="'+id+'"]');if(!box)return;
  Array.prototype.forEach.call(box.children,function(b){b.addEventListener('click',function(){var j=+b.dataset.j;tryInc(key,j===ans,j);store(j);save();
    Array.prototype.forEach.call(box.children,function(x,i){x.className='opt'+(i===j?(j===ans?' ok':' bad'):'');});
    var fb=$('fb_'+id);if(j===ans){fb.className='fb ok';fb.textContent=okMsg;if(onOk)onOk();}else{fb.className='fb bad';fb.textContent=(typeof badMsgs==='string')?badMsgs:(badMsgs[j]||'Noch nicht. Probiere es im Modell aus.');}});});}
function showFb(id,ok,msg){var f=$('fb_'+id);if(f){f.className='fb '+(ok?'ok':'bad');f.textContent=msg;}}
function segQHTML(list,store,locked){return list.map(function(q){var v=store[q.id];return '<div class="q"><p>'+q.q+'</p><span class="seg" data-sq="'+q.id+'">'+q.o.map(function(o,j){return '<button type="button" data-j="'+j+'" class="'+(v===j?(locked?'ok':'sel'):'')+'">'+o+'</button>';}).join('')+'</span></div>';}).join('');}
function bindSegQ(store,locked){Array.prototype.forEach.call(document.querySelectorAll('[data-sq]'),function(sg){Array.prototype.forEach.call(sg.children,function(b){b.addEventListener('click',function(){if(locked())return;store[sg.dataset.sq]=+b.dataset.j;save();Array.prototype.forEach.call(sg.children,function(x){x.className=x===b?'sel':'';});});});});}
function checkSegQ(list,store,key,fbId,onHelp){var fb=$(fbId),miss=0,wrong=[];
  list.forEach(function(q){var v=store[q.id],sg=document.querySelector('[data-sq="'+q.id+'"]');if(v==null){miss++;return;}var ok=v===q.a;sg.children[v].className=ok?'ok':'bad';if(!ok)wrong.push(q);});
  if(miss){fb.className='fb bad';fb.textContent='Es fehlen noch '+miss+' Antworten.';return false;}
  tryInc(key,!wrong.length,wrong.map(function(q){return q.id;}).join(','));
  if(wrong.length){fb.className='fb bad';fb.textContent=wrong[0].w;if(onHelp)showHelp(fb,key,function(){list.forEach(function(q){store[q.id]=q.a;});save();onHelp();helpMsg(fbId,'Die Lösung ist markiert. Lies sie dir durch und tippe auf „Prüfen“.');});return false;}return true;}

  document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&!ov.hidden)close();});
  ov.querySelector('#abgCopy').addEventListener('click',function(){
    upd();if(!A.name){msg(false,'Tragt zuerst eure Namen ein.');$n.focus();return;}
    var txt=abgText(A);$t.value=txt;
    function sel(){$t.hidden=false;$t.focus();$t.select();msg(true,'Der Text ist markiert. Tippe lange darauf und wähle „Kopieren“.');}
    try{navigator.clipboard.writeText(txt).then(function(){msg(true,'Text kopiert.');},sel);}catch(err){sel();}
  });
  ov.querySelector('#abgDl').addEventListener('click',function(){
    upd();if(!A.name){msg(false,'Tragt zuerst eure Namen ein.');$n.focus();return;}
    var txt=abgText(A).replace(/\r?\n/g,'\r\n'),name=resFile();
    try{var bl=new Blob(['\ufeff'+txt],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(bl),a=document.createElement('a');
      a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},10000);
      msg(true,'Die Datei „'+name+'“ wird heruntergeladen. Ladet sie jetzt in IServ bei der Aufgabe „'+APP+'“ hoch.');}
    catch(err){msg(false,'Herunterladen klappt hier nicht. Kopiert stattdessen den Text.');}
  });
  document.getElementById('abgBtn').addEventListener('click',open);
})();
})();
</script>
</body>
