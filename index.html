<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physik-Apps</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1d2433;
    --muted: #6b7486;
    --accent: #2f6fde;
    --accent-soft: #e6eefc;
    --border: #e1e5ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c;
      --card: #1b2029;
      --text: #e8ebf2;
      --muted: #9aa3b5;
      --accent: #6c9cf0;
      --accent-soft: #23314b;
      --border: #2a303c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 1.45;
  }
  main { max-width: 640px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font-size: 1.7rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  h2 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 28px 0 10px;
  }
  .app {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    text-decoration: none;
    color: inherit;
  }
  a.app:active { transform: scale(0.99); }
  .nr {
    flex: 0 0 auto;
    width: 40px; height: 40px;
    border-radius: 10px;
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 700;
    display: grid; place-items: center;
  }
  .titel { font-weight: 600; }
  .info { color: var(--muted); font-size: 0.9rem; }
  .pfeil { margin-left: auto; color: var(--accent); font-size: 1.3rem; }
  .gesperrt { opacity: 0.5; }
  .zurueck {
    display: inline-block;
    margin: 0 0 4px;
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
  }
  .hinweis {
    margin-top: 32px;
    padding: 14px 16px;
    border-radius: 14px;
    background: var(--accent-soft);
    font-size: 0.95rem;
  }
</style>
</head>
<body>
<main>
  <h1>Physik-Apps</h1>
  <p class="sub">Wähle deinen Bereich.</p>

  <div id="liste"></div>

  <div class="hinweis">
    <strong>Abgeben:</strong> Tippe in der App oben auf <strong>„Ergebnisse abgeben“</strong> und lade die Datei herunter.
    Lade sie dann in <strong>IServ → Aufgaben</strong> bei der Aufgabe mit dem Namen der App hoch.
  </div>
</main>

<script>
  /* =========================================================
     HIER BEARBEITEN: Für jede neue App eine Zeile ergänzen.
     - jahrgang: z. B. "Jahrgang 7" (muss in JAHRGAENGE stehen).
              Weglassen = Thema steht direkt auf der Startseite
              (z. B. Sicherheitsunterweisung).
     - thema: Überschrift (z. B. die Unterrichtseinheit)
     - nr:    Nummer auf der Kachel
     - titel: Name der App
     - info:  kurze Zeile unter dem Namen (optional)
     - datei: Dateiname der App im selben Repository.
              Leer lassen ("") = wird als „folgt bald“ angezeigt.
     - frei:  false = App ist hochgeladen, aber noch gesperrt („folgt bald“).
              Weglassen oder true = App ist anklickbar.
     - ab:    (optional) Datum, ab dem die App automatisch frei ist,
              z. B. ab: "2026-11-03". Davor steht sie auf „folgt bald“.
     ========================================================= */
  const JAHRGAENGE = ["Jahrgang 7", "Jahrgang 8", "Jahrgang 10"];

  const apps = [
    { thema: "Sicherheitsunterweisung", nr: 1, titel: "Sicherheits-Check", info: "Sicher experimentieren im Physikraum", datei: "Sicherheitsunterweisung/sicherheitscheck.html" },
    { jahrgang: "Jahrgang 7", thema: "Wie kann man Lichtstrahlen beeinflussen?", nr: 1, titel: "Linsen-Labor", info: "Linsen und Lichtstrahlen", datei: "Jahrgang%2007/Wie%20kann%20man%20Lichtstrahlen%20beeinflussen/linsenlabor.html" },
    { jahrgang: "Jahrgang 7", thema: "Wie kann man Lichtstrahlen beeinflussen?", nr: 2, titel: "Linsen-Messlabor", info: "Wovon hängen Lage und Größe des Bildes ab?", datei: "Jahrgang%2007/Wie%20kann%20man%20Lichtstrahlen%20beeinflussen/linsenmesslabor.html" },
    { jahrgang: "Jahrgang 7", thema: "Wie kann man Lichtstrahlen beeinflussen?", nr: 3, titel: "Optik-Werkstatt", info: "Wie helfen uns Linsen beim Sehen?", datei: "Jahrgang%2007/Wie%20kann%20man%20Lichtstrahlen%20beeinflussen/optikwerkstatt.html" },
    { jahrgang: "Jahrgang 7", thema: "Wie kann man Lichtstrahlen beeinflussen?", nr: 4, titel: "Regenbogen-Labor", info: "Wie entsteht ein Regenbogen?", datei: "Jahrgang%2007/Wie%20kann%20man%20Lichtstrahlen%20beeinflussen/regenbogenlabor.html" },
    { jahrgang: "Jahrgang 7", thema: "Wie kann man Lichtstrahlen beeinflussen?", nr: 5, titel: "Lichtschutz-Labor", info: "Wann wird Licht gefährlich?", datei: "Jahrgang%2007/Wie%20kann%20man%20Lichtstrahlen%20beeinflussen/lichtschutzlabor.html" },
    { jahrgang: "Jahrgang 7", thema: "Wie verhalten sich ruhende Ladungen?", nr: 1, titel: "Ladungslabor 1", info: "Was passiert beim Reiben?", datei: "Jahrgang%2007/Wie%20verhalten%20sich%20ruhende%20Ladungen/ladungslabor-1.html" },
    { jahrgang: "Jahrgang 7", thema: "Wie verhalten sich ruhende Ladungen?", nr: 2, titel: "Ladungslabor 2", info: "Welche Kräfte wirken zwischen Ladungen?", datei: "Jahrgang%2007/Wie%20verhalten%20sich%20ruhende%20Ladungen/ladungslabor-2.html" },
    { jahrgang: "Jahrgang 7", thema: "Wie verhalten sich ruhende Ladungen?", nr: 3, titel: "Ladungslabor 3", info: "Woher kommt die Ladung?", datei: "Jahrgang%2007/Wie%20verhalten%20sich%20ruhende%20Ladungen/ladungslabor-3.html" },
    { jahrgang: "Jahrgang 7", thema: "Wie verhalten sich ruhende Ladungen?", nr: 4, titel: "Ladungslabor 4", info: "Warum leiten Metalle?", datei: "Jahrgang%2007/Wie%20verhalten%20sich%20ruhende%20Ladungen/ladungslabor-4.html" },
    { jahrgang: "Jahrgang 7", thema: "Wie verhalten sich ruhende Ladungen?", nr: 5, titel: "Ladungslabor 5", info: "Wie entsteht Spannung?", datei: "Jahrgang%2007/Wie%20verhalten%20sich%20ruhende%20Ladungen/ladungslabor-5.html" },
    // { jahrgang: "Jahrgang 7", thema: "Wie kann man Lichtstrahlen beeinflussen?", nr: 6, titel: "Name der nächsten App", info: "", datei: "" },
  ];

  const liste = document.getElementById("liste");
  const sub = document.querySelector(".sub");
  const subStart = sub.textContent;

  function istOffen(app) {
    return !!app.datei && app.frei !== false &&
      (!app.ab || new Date() >= new Date(app.ab + "T00:00:00"));
  }
  function themenVon(liste) {
    const t = [];
    liste.forEach(a => { if (!t.includes(a.thema)) t.push(a.thema); });
    return t;
  }
  const ohneJahrgang = apps.filter(a => !a.jahrgang);

  function kachel(nr, titel, info, href, offen) {
    const el = document.createElement(offen ? "a" : "div");
    el.className = "app" + (offen ? "" : " gesperrt");
    if (offen) el.href = href;
    el.innerHTML =
      '<div class="nr"></div>' +
      '<div><div class="titel"></div><div class="info"></div></div>' +
      (offen ? '<div class="pfeil">›</div>' : '');
    el.querySelector(".nr").textContent = nr;
    el.querySelector(".titel").textContent = titel;
    el.querySelector(".info").textContent = info;
    return el;
  }
  function ueberschrift(t) {
    const h = document.createElement("h2"); h.textContent = t; liste.appendChild(h);
  }
  function zurueckLink(text, href) {
    const a = document.createElement("a");
    a.href = href; a.className = "zurueck"; a.textContent = "‹ " + text;
    liste.appendChild(a);
  }
  function anzahl(n, eins, viele) { return n + " " + (n === 1 ? eins : viele); }
  function hashFuer(o) {
    return "#" + Object.keys(o).map(k => k + "=" + encodeURIComponent(o[k])).join("&");
  }

  // Ebene 1: Startseite
  function zeigeUebersicht() {
    liste.innerHTML = "";
    sub.textContent = subStart;
    ueberschrift("Übersicht");
    let nr = 1;
    themenVon(ohneJahrgang).forEach(thema => {
      const offen = ohneJahrgang.filter(a => a.thema === thema && istOffen(a)).length;
      liste.appendChild(kachel(nr++, thema, offen ? anzahl(offen, "App", "Apps") : "folgt bald",
        hashFuer({ t: thema }), offen > 0));
    });
    JAHRGAENGE.forEach(jg => {
      const jgApps = apps.filter(a => a.jahrgang === jg);
      const offen = jgApps.filter(istOffen).length;
      const nt = themenVon(jgApps.filter(istOffen)).length;
      liste.appendChild(kachel(nr++, jg, offen ? anzahl(nt, "Thema", "Themen") : "folgt bald",
        hashFuer({ j: jg }), offen > 0));
    });
  }

  // Ebene 2: Themen eines Jahrgangs
  function zeigeJahrgang(jg) {
    liste.innerHTML = "";
    sub.textContent = "Wähle dein Thema.";
    zurueckLink("Übersicht", "#");
    ueberschrift(jg);
    const jgApps = apps.filter(a => a.jahrgang === jg);
    themenVon(jgApps).forEach((thema, i) => {
      const offen = jgApps.filter(a => a.thema === thema && istOffen(a)).length;
      liste.appendChild(kachel(i + 1, thema, offen ? anzahl(offen, "App", "Apps") : "folgt bald",
        hashFuer({ j: jg, t: thema }), offen > 0));
    });
  }

  // Ebene 3: Apps eines Themas
  function zeigeThema(jg, thema) {
    liste.innerHTML = "";
    sub.textContent = "Wähle eine App.";
    if (jg) zurueckLink(jg, hashFuer({ j: jg }));
    else zurueckLink("Übersicht", "#");
    ueberschrift(thema);
    apps.filter(a => (a.jahrgang || null) === (jg || null) && a.thema === thema).forEach(app => {
      const offen = istOffen(app);
      liste.appendChild(kachel(app.nr, app.titel, offen ? (app.info || "") : "folgt bald", app.datei, offen));
    });
  }

  function anzeigen() {
    const p = {};
    location.hash.replace(/^#/, "").split("&").forEach(x => {
      const k = x.indexOf("=");
      if (k > 0) p[x.slice(0, k)] = decodeURIComponent(x.slice(k + 1));
    });
    const jg = JAHRGAENGE.includes(p.j) ? p.j : null;
    if (p.t && apps.some(a => (a.jahrgang || null) === jg && a.thema === p.t)) zeigeThema(jg, p.t);
    else if (jg) zeigeJahrgang(jg);
    else zeigeUebersicht();
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", anzeigen);
  anzeigen();
</script>
</body>
</html>
