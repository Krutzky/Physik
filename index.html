<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physik-Apps</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1d2433;
    --muted: #6b7486;
    --accent: #2f6fde;
    --accent-soft: #e6eefc;
    --border: #e1e5ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c;
      --card: #1b2029;
      --text: #e8ebf2;
      --muted: #9aa3b5;
      --accent: #6c9cf0;
      --accent-soft: #23314b;
      --border: #2a303c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 1.45;
  }
  main { max-width: 640px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font-size: 1.7rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  h2 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 28px 0 10px;
  }
  .app {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    text-decoration: none;
    color: inherit;
  }
  a.app:active { transform: scale(0.99); }
  .nr {
    flex: 0 0 auto;
    width: 40px; height: 40px;
    border-radius: 10px;
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 700;
    display: grid; place-items: center;
  }
  .titel { font-weight: 600; }
  .info { color: var(--muted); font-size: 0.9rem; }
  .pfeil { margin-left: auto; color: var(--accent); font-size: 1.3rem; }
  .gesperrt { opacity: 0.5; }
  .zurueck {
    display: inline-block;
    margin: 0 0 4px;
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
  }
  .hinweis {
    margin-top: 32px;
    padding: 14px 16px;
    border-radius: 14px;
    background: var(--accent-soft);
    font-size: 0.95rem;
  }
</style>
</head>
<body>
<main>
  <h1>Physik-Apps</h1>
  <p class="sub">Wähle dein Thema.</p>

  <div id="liste"></div>

  <div class="hinweis">
    <strong>Abgeben:</strong> Tippe in der App oben auf <strong>„Ergebnisse abgeben“</strong> und dann auf
    „Text kopieren“. Füge den Text in <strong>IServ → Aufgaben</strong> bei der Aufgabe mit dem Namen der App ein.
  </div>
</main>

<script>
  /* =========================================================
     HIER BEARBEITEN: Für jede neue App eine Zeile ergänzen.
     - thema: Überschrift (z. B. die Unterrichtseinheit)
     - nr:    Nummer auf der Kachel
     - titel: Name der App
     - info:  kurze Zeile unter dem Namen (optional)
     - datei: Dateiname der App im selben Repository.
              Leer lassen ("") = wird als „folgt bald“ angezeigt.
     - frei:  false = App ist hochgeladen, aber noch gesperrt („folgt bald“).
              Weglassen oder true = App ist anklickbar.
     - ab:    (optional) Datum, ab dem die App automatisch frei ist,
              z. B. ab: "2026-11-03". Davor steht sie auf „folgt bald“.
     ========================================================= */
  const apps = [
    { thema: "UV 2 – Wie kann man Lichtstrahlen beeinflussen?", nr: 1, titel: "Linsen-Labor", info: "Linsen und Lichtstrahlen", datei: "linsenlabor.html" },
    // { thema: "UV 2 – Wie kann man Lichtstrahlen beeinflussen?", nr: 2, titel: "Name der nächsten App", info: "", datei: "" },
  ];

  const liste = document.getElementById("liste");
  const sub = document.querySelector(".sub");
  const subStart = sub.textContent;

  function istOffen(app) {
    return !!app.datei && app.frei !== false &&
      (!app.ab || new Date() >= new Date(app.ab + "T00:00:00"));
  }

  // Themen in der Reihenfolge, in der sie in der Liste vorkommen
  const themen = [];
  apps.forEach(app => { if (!themen.includes(app.thema)) themen.push(app.thema); });

  function kachel(nr, titel, info, href, offen) {
    const el = document.createElement(offen ? "a" : "div");
    el.className = "app" + (offen ? "" : " gesperrt");
    if (offen) el.href = href;
    el.innerHTML =
      '<div class="nr"></div>' +
      '<div><div class="titel"></div><div class="info"></div></div>' +
      (offen ? '<div class="pfeil">›</div>' : '');
    el.querySelector(".nr").textContent = nr;
    el.querySelector(".titel").textContent = titel;
    el.querySelector(".info").textContent = info;
    return el;
  }

  function zeigeUebersicht() {
    liste.innerHTML = "";
    sub.textContent = subStart;
    if (!themen.length) {
      liste.innerHTML = '<p class="sub">Hier erscheinen bald die ersten Apps.</p>';
      return;
    }
    const h = document.createElement("h2");
    h.textContent = "Themen";
    liste.appendChild(h);
    themen.forEach((thema, i) => {
      const alle = apps.filter(a => a.thema === thema);
      const offen = alle.filter(istOffen).length;
      const info = offen
        ? offen + (offen === 1 ? " App" : " Apps")
        : "folgt bald";
      liste.appendChild(kachel(i + 1, thema, info, "#thema=" + encodeURIComponent(thema), offen > 0));
    });
  }

  function zeigeThema(thema) {
    liste.innerHTML = "";
    sub.textContent = "Wähle eine App.";
    const zurueck = document.createElement("a");
    zurueck.href = "#";
    zurueck.className = "zurueck";
    zurueck.textContent = "‹ Alle Themen";
    liste.appendChild(zurueck);
    const h = document.createElement("h2");
    h.textContent = thema;
    liste.appendChild(h);
    apps.filter(a => a.thema === thema).forEach(app => {
      const offen = istOffen(app);
      liste.appendChild(kachel(app.nr, app.titel, offen ? (app.info || "") : "folgt bald", app.datei, offen));
    });
  }

  function anzeigen() {
    const m = location.hash.match(/^#thema=(.*)$/);
    const thema = m ? decodeURIComponent(m[1]) : null;
    if (thema && themen.includes(thema)) zeigeThema(thema);
    else zeigeUebersicht();
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", anzeigen);
  anzeigen();
</script>
</body>
</html>
