<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sicherheits-Check Physik</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout wie „Linsen-Labor“: Kopfleiste mit Stationen-Weg · links optische Bank + Dia- und Schirm-Ansicht mit Lineal (fest) · rechts Steuerpult + Stationsaufgabe. */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface-2:#F3F5FA; --ink:#0B1442; --ink-soft:#4E5677; --line:#CBD3E1;
  --navy:#020C45; --navy-ink:#FFFFFF; --accent:#E8892B; --accent-ink:#1B1300; --blue:#1C66C0; --blue-soft:#DCE8F7; --on-blue:#FFFFFF;
  --ok:#22865A; --ok-soft:#DDF2E7; --bad:#C8423D; --bad-soft:#F9E1DF; --pro:#6B3FB0; --pro-soft:#ECE4F8;
  --grid:#E3E8F0; --axis:#4A5068; --rail:#5B6278; --lens:#9CC3F0; --lens-edge:#3A6AA8; --ray1:#E8892B; --ray2:#1C66C0; --red:#E8432E;
  --room:#14161D; --display:#111111; --display-ink:#FFC94D;
  --f-display:"Lexend","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",Calibri,system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#060B26; --surface:#0E1640; --surface-2:#141D4F; --ink:#EEF1FA; --ink-soft:#A9B1D3; --line:#2B3672;
  --navy:#020722; --navy-ink:#FFFFFF; --accent:#F3A04F; --accent-ink:#1B1300; --blue:#6FA8F0; --blue-soft:#1A2A63; --on-blue:#06102E;
  --ok:#4CC48A; --ok-soft:#123A2C; --bad:#F07A73; --bad-soft:#40181C; --pro:#B89AF0; --pro-soft:#2A1E52;
  --grid:#1E2858; --axis:#AEB6D8; --rail:#8792C2; --lens:#3D6FB0; --lens-edge:#9CC3F0; --ray1:#F3A04F; --ray2:#6FA8F0; --red:#F2604D;
  --room:#05060A; --display:#000000; --display-ink:#FFC94D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060B26; --surface:#0E1640; --surface-2:#141D4F; --ink:#EEF1FA; --ink-soft:#A9B1D3; --line:#2B3672;
  --navy:#020722; --navy-ink:#FFFFFF; --accent:#F3A04F; --accent-ink:#1B1300; --blue:#6FA8F0; --blue-soft:#1A2A63; --on-blue:#06102E;
  --ok:#4CC48A; --ok-soft:#123A2C; --bad:#F07A73; --bad-soft:#40181C; --pro:#B89AF0; --pro-soft:#2A1E52;
  --grid:#1E2858; --axis:#AEB6D8; --rail:#8792C2; --lens:#3D6FB0; --lens-edge:#9CC3F0; --ray1:#F3A04F; --ray2:#6FA8F0; --red:#F2604D;
  --room:#05060A; --display:#000000; --display-ink:#FFC94D; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

header{background:var(--navy);color:var(--navy-ink);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hwrap{max-width:1360px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;flex-direction:column}
.brand b{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.2px}
.brand span{font-size:13px;color:#8DB7EE}
.route{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.stop{display:flex;align-items:center;gap:8px;border:2px solid #34428F;background:transparent;color:#fff;border-radius:999px;padding:5px 12px 5px 6px;font-size:14px;font-weight:700}
.stop .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#24317A;font-size:13px}
.stop.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stop.on .n{background:rgba(0,0,0,.18);color:var(--accent-ink)}
.stop.done .n{background:var(--ok);color:#fff}
.stop.pro{border-style:dashed;border-color:#8E74D6}
.stop.pro.on{background:#B89AF0;border-color:#B89AF0;color:#1A0F33;border-style:solid}
.stop:disabled{opacity:.45;cursor:not-allowed}
.reset{background:transparent;border:1.5px solid #34428F;color:#B9C6EE;border-radius:999px;padding:5px 10px;font-size:13px}

main{max-width:1360px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.plot{position:sticky;top:env(safe-area-inset-top,0px);padding:10px;display:flex;flex-direction:column;gap:10px}
@media (max-width:900px){.plot{position:static}}
canvas{display:block;width:100%;border-radius:10px;touch-action:none}
.views{display:grid;grid-template-columns:repeat(2,minmax(0,250px));justify-content:center;gap:14px}
.view{display:flex;flex-direction:column;gap:4px;min-width:0}
.view canvas{aspect-ratio:1/1;max-width:100%;background:var(--room)}
.view small{font-size:13px;color:var(--ink-soft);text-align:center}
.view small b{color:var(--ink)}

.side{display:flex;flex-direction:column;gap:16px;min-width:0}
h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0 0 4px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0}
.eyebrow{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--blue);font-weight:700;margin:0 0 2px}
.eyebrow.pro{color:var(--pro)}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--ink-soft);font-size:15px}

/* Steuerpult */
.ctl{display:flex;flex-direction:column;gap:6px}
.lift{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:stretch}
.disp{background:var(--display);color:var(--display-ink);font-family:var(--f-mono);border-radius:12px;padding:6px 10px;text-align:center;box-shadow:inset 0 0 0 3px #333;display:flex;flex-direction:column;justify-content:center}
.disp small{font-size:11px;letter-spacing:2px;color:#9a9a9a}
.disp span{font-size:28px;letter-spacing:1px;font-variant-numeric:tabular-nums}
.disp.g{color:#9FD0FF}
.keys{display:flex;gap:8px;align-items:center}
.key{width:56px;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);font-size:22px;font-weight:700}
.key:active{background:var(--accent);color:var(--accent-ink)}
input[type=range]{width:100%;accent-color:var(--accent);height:30px}
input[type=range].gr{accent-color:var(--blue)}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.locked{font-size:15px;color:var(--ink-soft);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.chk{display:flex;align-items:center;gap:10px;font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--blue)}
.sep{border:0;border-top:1.5px dashed var(--line);margin:8px 0}

.num{width:4.6em;text-align:center;border:2px solid var(--line);border-radius:8px;padding:5px 2px;background:var(--surface);font-variant-numeric:tabular-nums}
.num.ok{border-color:var(--ok);background:var(--ok-soft)}
.num.bad{border-color:var(--bad);background:var(--bad-soft)}
.sel{font:inherit;border:2px solid var(--line);border-radius:8px;padding:4px 4px;background:var(--surface);max-width:100%}
.sel.ok{border-color:var(--ok);background:var(--ok-soft)}
.sel.bad{border-color:var(--bad);background:var(--bad-soft)}
.btn{border:none;border-radius:999px;padding:10px 18px;font-weight:700;font-size:16px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--surface);border:1.5px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn.tip{background:transparent;border:1.5px dashed var(--blue);color:var(--blue);padding:7px 14px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.choice{display:flex;flex-direction:column;gap:8px}
.choice.grid2{display:grid;grid-template-columns:1fr 1fr}
@media (max-width:440px){.choice.grid2{grid-template-columns:1fr}}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.opt b{font-family:var(--f-display)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.gopt{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center}
.gopt .L{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-family:var(--f-display);grid-row:1/3}
.gopt span{font-size:15px}
.seg{display:inline-flex;flex-wrap:wrap;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:7px 14px;font-weight:700}
.seg button.sel{background:var(--blue);color:var(--on-blue)}
.seg button.ok{background:var(--ok);color:#fff}
.seg button.bad{background:var(--bad);color:#fff}
.fb{font-weight:700;min-height:1.4em}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.note{border-left:4px solid var(--accent);background:var(--surface-2);padding:10px 12px;border-radius:0 10px 10px 0;font-size:15px}
.hint{border:1.5px dashed var(--blue);background:var(--blue-soft);border-radius:10px;padding:10px 12px;font-size:15px}
.win{border:2px solid var(--ok);background:var(--ok-soft);border-radius:12px;padding:12px}
.guess{border:2px solid var(--pro);background:var(--pro-soft);border-radius:12px;padding:12px}
.q{display:flex;flex-direction:column;gap:6px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.q p b{font-family:var(--f-display);font-weight:600}
.gap ol{padding-left:1.2em;margin:0}
.gap li{margin-bottom:10px}
.dots{display:flex;gap:6px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:block}
.dots i.on{background:var(--ok);border-color:var(--ok)}
.merk{border:2px solid var(--blue);border-radius:12px;padding:14px;background:var(--surface)}
.merk h3{color:var(--blue);margin-bottom:6px}
.merk .k{color:var(--blue);font-weight:700}
textarea.free{width:100%;border:2px solid var(--line);border-radius:10px;padding:8px;background:var(--surface);color:var(--ink)}
.bz{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}
.badge{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-family:var(--f-display)}
.tw{overflow-x:auto}
table.mt{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:15.5px}
table.mt th,table.mt td{border:1.5px solid var(--line);padding:6px 6px;text-align:center}
table.mt th{background:var(--surface-2);font-weight:700}
table.mt th small{display:block;font-weight:400;color:var(--ink-soft);font-size:12px}
table.mt tr.cur td{background:var(--blue-soft)}
table.mt tr.done td{background:var(--ok-soft)}
table.mt tr.lock td{color:var(--ink-soft)}
table.mt td.v b{font-size:16px}
.chart{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--ink-soft);padding:0 6px 4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
.illu{width:100%;height:auto;display:block;border-radius:12px}
.illu text{font-family:var(--f-display)}
.cap{font-size:14px;color:var(--ink-soft);text-align:center}
.order{display:flex;flex-direction:column;gap:8px}
.order .it{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.order select,.match select{font:inherit;font-size:15px;padding:6px 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);min-height:40px}
select.ok{border-color:var(--ok);background:var(--ok-soft)} select.bad{border-color:var(--bad);background:var(--bad-soft)}
.match{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}
.match .nr{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-family:var(--f-display)}
.room{display:flex;flex-direction:column;gap:10px}
.room .it{border:1.5px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.room .it.okk{border-color:var(--ok);background:var(--ok-soft)}
.room input[type=text],.sig input{font:inherit;font-size:15px;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%;box-sizing:border-box}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rules label{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;padding:8px 10px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface);font-size:15px;line-height:1.35}
.rules input{width:22px;height:22px;margin:0;accent-color:var(--ok)}
.rules label.on{border-color:var(--ok);background:var(--ok-soft)}
.rules h4{margin:10px 0 2px;font-family:var(--f-display);font-size:15px;color:var(--ink-soft)}
.sig{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}
.sig label{font-weight:700;font-size:14px}
.prog{height:10px;border-radius:6px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;background:var(--ok);transition:width .3s}
.big{font-family:var(--f-display);font-size:20px}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand"><b>Sicherheits-Check</b><span>Sicher experimentieren im Physikraum</span></div>
    <nav class="route" id="route" aria-label="Stationen"></nav>
    <button class="reset" id="reset" type="button">Neu starten</button>
  </div>
</header>
<main>
  <section class="card plot" aria-label="Bild zur Station"><div id="pic"></div><p class="cap" id="cap"></p></section>
  <aside class="side"><section class="card stack" id="task"></section></aside>
</main>
<script>
(function(){
var $=function(id){return document.getElementById(id);};
var KEY='sicherheits-check-v1';
var STATIONS=[{name:'STOPP'},{name:'Verhalten'},{name:'Geräte'},{name:'Notfall'},{name:'Raum-Check'},{name:'Quiz'},{name:'Bestätigung'}];
var st={station:0,done:[],s:[{},{},{},{},{},{},{}],tries:{},help:[],t0:0,res:{}};
function load(){try{var o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&o.s)st=Object.assign(st,o);}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function fnv(str){var h=0x811c9dc5;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return ('0000000'+h.toString(16)).slice(-8);}
function tryInc(k,ok,val){var t=st.tries[k]||(st.tries[k]={n:0,ok:false,first:null});if(t.ok)return;t.n++;if(t.first===null)t.first=!!ok;if(ok)t.ok=true;else if(val!=null&&val!==''){t.w=t.w||[];if(t.w.length<12)t.w.push(String(val));}save();}
function stuck(k){var t=st.tries[k];return !!(t&&!t.ok&&t.n>=3);}
function fb(id,ok,t){var f=$(id);if(f){f.className='fb '+(ok?'ok':'bad');f.textContent=t;}}
function helpBtn(fbId,k,fn){if(!stuck(k))return;var id='hb_'+k;if($(id))return;var b=document.createElement('button');b.type='button';b.id=id;b.className='btn tip';b.style.marginTop='6px';b.textContent='Ich komme nicht weiter: Lösung zeigen';
  b.addEventListener('click',function(){if(st.help.indexOf(k)<0)st.help.push(k);var t=st.tries[k];if(t)t.helped=true;save();fn();});var f=$(fbId);f.parentNode.insertBefore(b,f.nextSibling);}
function unlocked(i){return i===0||!!st.done[i-1];}
function finish(i){if(!st.done[i]){st.done[i]=true;save();renderRoute();}}
function renderRoute(){$('route').innerHTML=STATIONS.map(function(s,i){return '<button type="button" class="stop'+(i===st.station?' on':'')+(st.done[i]?' done':'')+'" data-i="'+i+'"'+(unlocked(i)?'':' disabled')+'><span class="n">'+(st.done[i]?'✓':(i+1))+'</span>'+s.name+'</button>';}).join('');
  Array.prototype.forEach.call($('route').children,function(b){b.addEventListener('click',function(){go(+b.dataset.i);});});}
function go(i){if(!unlocked(i))return;st.station=i;save();render();try{window.scrollTo({top:0,behavior:'smooth'});}catch(e){window.scrollTo(0,0);}}
function nextBtn(i){if(!st.done[i]||i>=STATIONS.length-1)return '';return '<div class="row"><button class="btn pri" type="button" id="nextSt">Weiter zu Station '+(i+2)+': '+STATIONS[i+1].name+' →</button></div>';}
function bindNext(){var b=$('nextSt');if(b)b.addEventListener('click',function(){go(st.station+1);});}
function head(i,title,intro){return '<div><p class="eyebrow">Station '+(i+1)+' von '+STATIONS.length+'</p><h2>'+title+'</h2></div>'+(intro?'<p>'+intro+'</p>':'');}
function win(i,t){return st.done[i]?'<p class="win"><b>Geschafft!</b> '+t+'</p>':'';}

/* ---- Multiple Choice mit Hilfe ---- */
function mcHTML(id,q){var v=q.v;return '<div class="q"><p><b>'+q.q+'</b></p><div class="choice" data-mc="'+id+'">'+q.o.map(function(o,j){return '<button type="button" class="opt'+(v===j?(j===q.a?' ok':' bad'):'')+'" data-j="'+j+'">'+o+'</button>';}).join('')+'</div><p class="fb" id="fb_'+id+'"></p></div>';}
function bindMC(id,q,store,onOk,rerender){var box=document.querySelector('[data-mc="'+id+'"]');if(!box)return;
  if(store[q.id+'Ok']){fb('fb_'+id,true,q.ok);return;}
  Array.prototype.forEach.call(box.children,function(b){b.addEventListener('click',function(){if(store[q.id+'Ok'])return;var j=+b.dataset.j;tryInc(id,j===q.a,j);store[q.id]=j;
    Array.prototype.forEach.call(box.children,function(x,i){x.className='opt'+(i===j?(j===q.a?' ok':' bad'):'');});
    if(j===q.a){store[q.id+'Ok']=true;save();onOk();rerender();}else{save();fb('fb_'+id,false,(q.bad&&q.bad[j])||q.hint||'Noch nicht richtig. Lies die Antworten noch einmal genau.');
      helpBtn('fb_'+id,id,function(){store[q.id]=q.a;store[q.id+'Ok']=true;save();onOk();rerender();});}});});}
function chainHTML(list,store,key){var h='';for(var i=0;i<list.length;i++){var q=list[i];q.v=store[q.id];h+=mcHTML(key+q.id,q);if(!store[q.id+'Ok'])break;}return h;}
function bindChain(list,store,key,rerender,onDone){list.forEach(function(q,i){if(i>0&&!store[list[i-1].id+'Ok'])return;bindMC(key+q.id,q,store,function(){if(i===list.length-1&&onDone)onDone();},rerender);});}

/* ---- Auswahllisten (Zuordnen / Reihenfolge) ---- */
function selHTML(id,opts,val,cls){return '<select id="'+id+'" class="'+(cls||'')+'"><option value="">…</option>'+opts.map(function(o,j){return '<option value="'+j+'"'+(String(val)===String(j)?' selected':'')+'>'+o+'</option>';}).join('')+'</select>';}
/* list: [{t, a}] a = Index der richtigen Option; check(vals) optional */
function selGroup(prefix,list,store,locked){list.forEach(function(q,i){var el=$(prefix+i);if(!el)return;if(locked){el.disabled=true;el.className='ok';return;}el.addEventListener('change',function(){store[i]=el.value;el.className='';save();});});}
function checkGroup(prefix,list,store,key,fbId,okFn,rerender,isOk,wrongMsg){var miss=0,wrong=[];
  list.forEach(function(q,i){var v=store[i];if(v==null||v===''){miss++;return;}});
  if(miss){fb(fbId,false,'Es fehlen noch '+miss+' Angaben.');return;}
  list.forEach(function(q,i){var ok=isOk?isOk(i,+store[i]):(+store[i]===q.a);$(prefix+i).className=ok?'ok':'bad';if(!ok)wrong.push(i);});

  var h=head(3,'Notfälle und Alarm','Was tust du bei einem Unfall? Bringe die Unfallkette in die richtige Reihenfolge.')+
   '<div class="order">'+UNF.map(function(q,i){return '<div class="it"><span>'+q.t+'</span>'+selHTML('unf'+i,POS,s.u[i])+'</div>';}).join('')+'</div>'+
   (s.uOk?'':'<div class="row"><button class="btn pri" type="button" id="c3u">Prüfen</button></div>')+'<p class="fb" id="fb3u"></p>';
  if(s.uOk)h+='<p><b>Und bei Feueralarm?</b> Bringe auch diese Schritte in die richtige Reihenfolge.</p><div class="order">'+ALA.map(function(q,i){return '<div class="it"><span>'+q.t+'</span>'+selHTML('ala'+i,POS.slice(0,3),s.al[i])+'</div>';}).join('')+'</div>'+
   (s.aOk?'':'<div class="row"><button class="btn pri" type="button" id="c3a">Prüfen</button></div>')+'<p class="fb" id="fb3a"></p>';
  if(s.aOk)h+=chainHTML(Q3,s,'s4');
  h+=win(3,'Du weißt, was im Notfall zu tun ist.')+nextBtn(3);
  $('task').innerHTML=h;selGroup('unf',UNF,s.u,s.uOk);
  if(!s.uOk)$('c3u').addEventListener('click',function(){checkGroup('unf',UNF,s.u,'s4unfall','fb3u',function(){s.uOk=true;save();r3();},r3,null,'Noch nicht richtig. Merke: Erst Ruhe bewahren und sichern, dann Hilfe holen.');});
  else fb('fb3u',true,'Richtig! Ruhe bewahren – Lehrkraft – Notruf – Erste Hilfe.');
  if(s.uOk){selGroup('ala',ALA,s.al,s.aOk);
    if(!s.aOk)$('c3a').addEventListener('click',function(){checkGroup('ala',ALA,s.al,'s4alarm','fb3a',function(){s.aOk=true;save();r3();},r3,null,'Noch nicht richtig. Bevor du gehst, schließt du die Fenster.');});
    else fb('fb3a',true,'Richtig! Fenster zu, in Zweierreihe raus, über den Fluchtweg zum Sammelpunkt.');}
  if(s.aOk)bindChain(Q3,s,'s4',r3,function(){finish(3);});
  bindNext();}

/* ---------- Station 5: Raum-Check ---------- */
var SIGQ=SIGN_ORDER.map(function(k){return {a:k};});
function r4(){var s=st.s[4];s.sel=s.sel||{};s.room=s.room||{};
  var h=head(4,'Sicherheit im Physikraum','Welches Zeichen ist welches? Ordne jedem Bild (1–6) den richtigen Namen zu.')+
   '<div class="match">'+SIGQ.map(function(q,i){return '<span class="nr">'+(i+1)+'</span>'+selHTML('sig'+i,SIGNS.map(function(x){return x.n;}),s.sel[i]);}).join('')+'</div>'+
   (s.ok?'':'<div class="row"><button class="btn pri" type="button" id="c4">Prüfen</button></div>')+'<p class="fb" id="fb4"></p>';
  if(s.ok){h+='<div class="merk stack"><h3>Schau dich im Raum um!</h3><p>Suche jede Einrichtung in <b>deinem</b> Physikraum. Schreibe auf, wo sie ist (z. B. „neben der Tür“). Gibt es sie hier nicht, tippe auf „gibt es hier nicht“.</p></div><div class="room">'+
     SIGNS.map(function(x){var r=s.room[x.k]||{};return '<div class="it'+(r.f===true&&(r.w||'').trim().length>=3||r.f===false?' okk':'')+'" id="rm_'+x.k+'"><b>'+x.n+'</b><span class="seg"><button type="button" data-f="1" class="'+(r.f===true?'sel':'')+'">gefunden</button><button type="button" data-f="0" class="'+(r.f===false?'sel':'')+'">gibt es hier nicht</button></span>'+
       (r.f===true?'<input type="text" placeholder="Wo genau?" value="'+esc(r.w)+'" maxlength="80" aria-label="Ort: '+x.n+'">':'')+'</div>';}).join('')+'</div>'+
     (st.done[4]?'':'<div class="row"><button class="btn pri" type="button" id="c4r">Raum-Check abschließen</button></div>')+'<p class="fb" id="fb4r"></p>';}
  h+=win(4,'Du weißt, wo die Sicherheitseinrichtungen sind.')+nextBtn(4);
  $('task').innerHTML=h;selGroup('sig',SIGQ,s.sel,s.ok);
  if(!s.ok)$('c4').addEventListener('click',function(){checkGroup('sig',SIGQ,s.sel,'s5zeichen','fb4',function(){s.ok=true;save();r4();},r4,null,'Noch nicht richtig. Tipp: Rote Zeichen haben mit Brand zu tun, grüne mit Rettung.');});
  else{fb('fb4',true,'Alles richtig zugeordnet!');
    SIGNS.forEach(function(x){var box=$('rm_'+x.k),r=s.room[x.k]||(s.room[x.k]={});
      Array.prototype.forEach.call(box.querySelectorAll('[data-f]'),function(b){b.addEventListener('click',function(){r.f=b.dataset.f==='1';save();r4();var inp=$('rm_'+x.k).querySelector('input');if(inp)inp.focus();});});
      var inp=box.querySelector('input');if(inp)inp.addEventListener('input',function(){r.w=inp.value;save();box.className='it'+(r.w.trim().length>=3?' okk':'');});});
    if($('c4r'))$('c4r').addEventListener('click',function(){var miss=SIGNS.filter(function(x){var r=s.room[x.k]||{};return !(r.f===false||(r.f===true&&(r.w||'').trim().length>=3));});
      if(miss.length){fb('fb4r',false,'Noch offen: '+miss.map(function(x){return x.n;}).join(', ')+'. Schreibe bei „gefunden“ dazu, wo es ist.');return;}
      finish(4);save();r4();});}
  bindNext();}

/* ---------- Station 6: Quiz ---------- */
var Q5=[
 {id:'q1',q:'Darfst du ohne Auftrag ein Experiment beginnen?',o:['Nein, nur nach Arbeitsauftrag und mit Erlaubnis.','Ja, wenn alle Geräte auf dem Tisch stehen.','Ja, wenn es ungefährlich aussieht.'],a:0,ok:'Richtig! Erst Auftrag und Erlaubnis, dann experimentieren.'},
 {id:'q2',q:'Wohin gehören Taschen im Physikraum?',o:['So an die Seite oder unter den Tisch, dass niemand darüber stolpert.','Auf den Experimentiertisch.','In den Gang, da ist Platz.'],a:0,ok:'Genau! Wege und Arbeitsplätze bleiben frei.'},
 {id:'q3',q:'Darf man im Physikraum essen oder trinken?',o:['Nein, auch nicht aus der eigenen Flasche.','Ja, wenn man vorsichtig ist.','Nur Wasser.'],a:0,ok:'Richtig! Im Physikraum wird nicht gegessen und nicht getrunken.'},
 {id:'q4',q:'Was machst du, wenn etwas kaputtgeht?',o:['Ich melde es sofort der Lehrkraft, auch kleine Schäden.','Ich räume es schnell weg, damit es keiner merkt.','Ich repariere es selbst.'],a:0,ok:'Genau! Schäden, Glasbruch und Unfälle immer sofort melden.'},
 {id:'q5',q:'Warum soll man im Physikraum gehen und nicht rennen?',o:['Man kann stolpern, Aufbauten umstoßen und sich oder andere verletzen.','Weil es zu laut ist.','Weil der Boden sonst schmutzig wird.'],a:0,ok:'Richtig! Im Physikraum stehen Geräte, Kabel und manchmal heiße Platten.'},
 {id:'q6',q:'Darf man ohne Lehrkraft in den Physikraum?',o:['Nein, nur wenn eine Lehrkraft anwesend ist.','Ja, in den Pausen.','Ja, wenn die Tür offen ist.'],a:0,ok:'Richtig! Den Physikraum betrittst du nur mit einer Lehrkraft.'},
 {id:'q7',q:'Wann schaltest du ein Netzgerät, eine Heizplatte oder einen Brenner ein?',o:['Nur auf Anweisung der Lehrkraft.','Sobald alles aufgebaut ist.','Wenn mein Partner bereit ist.'],a:0,ok:'Genau! Einschalten nur auf Anweisung.'},
 {id:'q8',q:'Eine Mitschülerin hat sich verletzt. Was tust du zuerst?',o:['Ruhe bewahren, sichern und sofort die Lehrkraft informieren.','Ein Foto machen.','Weiterarbeiten, die Lehrkraft merkt es schon.'],a:0,ok:'Richtig! Erst Ruhe bewahren und sichern, dann Hilfe holen.'}];
/* Antworten mischen, damit nicht immer A richtig ist */
(function(){var sh=[[1,0,2],[2,1,0],[0,2,1],[1,2,0],[2,0,1],[0,1,2],[1,0,2],[2,1,0]];Q5.forEach(function(q,i){var p=sh[i],o=q.o.slice();q.o=p.map(function(k){return o[k];});q.a=p.indexOf(0);});})();
function r5(){var s=st.s[5];
  var nOk=Q5.filter(function(q){return s[q.id+'Ok'];}).length;
  var h=head(5,'Sicherheits-Check','Beantworte alle Fragen. Bei einem Fehler darfst du es noch einmal versuchen.')+
   '<div class="prog" aria-hidden="true"><i style="width:'+(nOk/Q5.length*100)+'%"></i></div><p class="muted">'+nOk+' von '+Q5.length+' Fragen geschafft</p>'+
   chainHTML(Q5,s,'s6')+win(5,'Alle Fragen richtig beantwortet.')+nextBtn(5);
  $('task').innerHTML=h;bindChain(Q5,s,'s6',r5,function(){finish(5);});bindNext();}

/* ---------- Station 7: Bestätigung ---------- */
var RULES=[['Verhalten',[
 'Ich betrete den Physikraum nur in Anwesenheit einer Lehrkraft.',
 'Ich befolge die Anweisungen der Lehrkraft.',
 'Ich experimentiere nur nach Arbeitsauftrag und mit Erlaubnis.',
 'Ich arbeite niemals allein oder unbeaufsichtigt.',
 'Ich gehe im Physikraum, renne nicht und halte Wege sowie Arbeitsplätze frei.',
 'Taschen stelle ich so ab, dass keine Stolperfallen entstehen.',
 'Ich esse und trinke nicht im Physikraum.',
 'Ich trage die angeordnete Schutzkleidung, insbesondere eine Schutzbrille.',
 'Lange Haare binde ich zusammen, weite Kleidung sichere ich.']],
 ['Experimentieren',[
 'Ich arbeite nur mit trockenen Händen und überprüfe Kabel sowie Geräte vor der Benutzung auf sichtbare Schäden.',
 'Ich schalte elektrische Geräte, Netzgeräte, Heizplatten oder Brenner nur auf Anweisung ein.',
 'Vor Beginn prüfe ich, ob mein Versuchsaufbau stabil, korrekt und sicher ist.',
 'Ich gehe vorsichtig mit Strom, Wärmequellen, Flammen, Chemikalien und Glasgeräten um.',
 'Ich verwende keine unbekannten oder unbeschrifteten Stoffe und probiere Chemikalien niemals.',
 'Ich melde Schäden, Glasbruch, Unfälle und gefährliche Situationen sofort der Lehrkraft.',
 'Nach dem Experiment schalte ich Geräte aus, räume auf und hinterlasse meinen Arbeitsplatz sauber.',
 'Im Notfall oder bei Alarm beende ich die Arbeit sofort und folge den Anweisungen der Lehrkraft.']],
 ['Zum Schluss',['Mir ist bewusst, dass die Sicherheitsregeln dem Schutz aller dienen. Bei Missachtung der Regeln kann die Lehrkraft das Experimentieren für einzelne Schülerinnen und Schüler oder für die ganze Klasse beenden.']]];
var NRULES=RULES.reduce(function(n,g){return n+g[1].length;},0);
function halbjahr(d){var m=d.getMonth()+1,y=d.getFullYear();var sj=m>=8?y+'/'+String(y+1).slice(2):(y-1)+'/'+String(y).slice(2);return {hj:(m>=8||m===1)?'1. Halbjahr':'2. Halbjahr',sj:sj};}
function nChecked(){var r=st.s[6].r||{};return Object.keys(r).filter(function(k){return r[k];}).length;}
function complete(){return STATIONS.slice(0,6).every(function(x,i){return st.done[i];})&&nChecked()===NRULES&&!!st.s[6].sig&&!!(st.res.name||'').trim()&&!!(st.res.klasse||'').trim();}
function r6(){var s=st.s[6];s.r=s.r||{};var n=0,h=head(6,'Bestätigung','Lies jede Regel genau und hake sie ab. Mit deinem Namen bestätigst du, dass du die Regeln kennst und einhältst.')+
   '<div class="prog" aria-hidden="true"><i id="pbar" style="width:'+(nChecked()/NRULES*100)+'%"></i></div><p class="muted" id="pcount">'+nChecked()+' von '+NRULES+' Regeln abgehakt</p><ul class="rules">';
  RULES.forEach(function(g){h+='<li><h4>'+g[0]+'</h4></li>';g[1].forEach(function(t){var id='r'+n;h+='<li><label class="'+(s.r[id]?'on':'')+'"><input type="checkbox" data-r="'+id+'"'+(s.r[id]?' checked':'')+'><span>'+t+'</span></label></li>';n++;});});
  h+='</ul><div class="merk stack" style="border-color:var(--accent)"><h3 style="color:var(--ink)">Unterschrift</h3><div class="sig">'+
   '<label for="resName">Vor- und Nachname</label><input id="resName" autocomplete="off" value="'+esc(st.res.name)+'">'+
   '<label for="resKlasse">Klasse / Kurs</label><input id="resKlasse" autocomplete="off" placeholder="z. B. 7d" value="'+esc(st.res.klasse)+'">'+
   '<label for="resLk">Lehrkraft</label><input id="resLk" autocomplete="off" value="'+esc(st.res.lk)+'"></div>'+
   '<ul class="rules"><li><label class="'+(s.sig?'on':'')+'"><input type="checkbox" id="sig"'+(s.sig?' checked':'')+'><span><b>Ich bestätige mit meinem Namen</b>, dass ich über die Sicherheitsregeln informiert wurde und sie einhalte.</span></label></li></ul></div>'+
   '<p class="fb" id="fb6"></p>'+resultsHTML();
  $('task').innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('[data-r]'),function(c){c.addEventListener('change',function(){s.r[c.dataset.r]=c.checked;c.parentNode.className=c.checked?'on':'';save();upd6();});});
  $('sig').addEventListener('change',function(){if(this.checked&&(nChecked()<NRULES||!(st.res.name||'').trim())){this.checked=false;fb('fb6',false,nChecked()<NRULES?'Hake zuerst alle Regeln ab.':'Trage zuerst deinen Vor- und Nachnamen ein.');return;}
    s.sig=this.checked;if(s.sig)s.sigAt=new Date().toISOString();this.parentNode.className=this.checked?'on':'';save();upd6();});
  ['resName','resKlasse','resLk'].forEach(function(id){$(id).addEventListener('input',function(){st.res.name=$('resName').value.trim();st.res.klasse=$('resKlasse').value.trim();st.res.lk=$('resLk').value.trim();save();upd6();});});
  bindResults();upd6();}
function upd6(){$('pbar').style.width=(nChecked()/NRULES*100)+'%';$('pcount').textContent=nChecked()+' von '+NRULES+' Regeln abgehakt';
  if(complete()){finish(6);fb('fb6',true,'Alles erledigt! Speichere jetzt deine Ergebnisse und lade sie bei IServ hoch.');}
  else if(st.s[6].sig&&!complete())fb('fb6',false,'Es fehlt noch etwas: '+missing().join(', ')+'.');else{var f=$('fb6');f.className='fb';f.textContent='';}
  if(!$('resTxt').hidden)$('resTxt').value=resText();}
function missing(){var m=[];STATIONS.slice(0,6).forEach(function(x,i){if(!st.done[i])m.push('Station '+(i+1));});if(nChecked()<NRULES)m.push((NRULES-nChecked())+' Regeln');if(!(st.res.name||'').trim())m.push('Name');if(!(st.res.klasse||'').trim())m.push('Klasse');if(!st.s[6].sig)m.push('Bestätigung');return m;}
/* ---------- Ergebnisse ---------- */
var TASKS=[['s1stopp','STOPP zuordnen'],['s1when','Wann gilt STOPP?'],['s2verh','Verhalten: 10 Situationen'],['s3order','Reihenfolge Geräte'],['s3kabel','Kabel beschädigt'],['s3schrank','Gerät aus dem Schrank'],['s3ende','Nach dem Experiment'],
 ['s4unfall','Unfallkette'],['s4alarm','Ablauf bei Alarm'],['s4nr','Notrufnummer'],['s4mit','Alarm: nichts mitnehmen'],['s5zeichen','Sicherheitszeichen zuordnen']].concat(Q5.map(function(q,i){return ['s6'+q.id,'Quiz '+(i+1)+': '+q.q];}));
function resFile(){var n=(st.res.name||'Name').replace(/[^A-Za-zÄÖÜäöüß0-9]+/g,'_').replace(/^_|_$/g,'');var k=(st.res.klasse||'').replace(/[^A-Za-z0-9]+/g,'');return 'Sicherheitsunterweisung_'+n+(k?'_'+k:'')+'.txt';}
function resText(){var now=new Date(),h=halbjahr(now),dur=Math.round((Date.now()-(st.t0||Date.now()))/1000),L=[];
  L.push('SICHERHEITSUNTERWEISUNG PHYSIK · Sicherheits-Check');L.push('Name: '+(st.res.name||'')+'   Klasse: '+(st.res.klasse||'')+'   Lehrkraft: '+(st.res.lk||''));
  L.push('Datum: '+now.toLocaleDateString('de-DE')+' '+now.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+'   Schuljahr '+h.sj+', '+h.hj+'   Bearbeitungszeit: '+Math.round(dur/60)+' min');
  L.push('Status: '+(complete()?'VOLLSTÄNDIG':'UNVOLLSTÄNDIG (fehlt: '+missing().join(', ')+')'));L.push('');
  STATIONS.forEach(function(x,i){L.push('Station '+(i+1)+' '+x.name+': '+(st.done[i]?'erledigt':'offen'));});L.push('');
  L.push('Aufgaben (Versuche):');TASKS.forEach(function(t){var r=st.tries[t[0]];L.push('  '+t[1]+': '+(r?(r.ok?(r.n===1?'beim 1. Versuch richtig':'richtig nach '+r.n+' Versuchen'):'offen nach '+r.n+' Versuchen')+(r.helped?' (Lösung angezeigt)':''):'nicht bearbeitet'));});
  L.push('');L.push('Raum-Check:');var room=st.s[4].room||{};SIGNS.forEach(function(x){var r=room[x.k]||{};L.push('  '+x.n+': '+(r.f===true?'gefunden – '+(r.w||'').trim():(r.f===false?'gibt es hier nicht':'offen')));});
  L.push('');L.push('Regeln abgehakt: '+nChecked()+' von '+NRULES);L.push('Bestätigt mit Namen: '+(st.s[6].sig?'ja':'nein'));
  var data={v:1,name:st.res.name||'',klasse:st.res.klasse||'',lk:st.res.lk||'',date:now.toISOString(),dur:dur,sj:h.sj,hj:h.hj,done:STATIONS.map(function(x,i){return !!st.done[i];}),
    tries:st.tries,help:st.help,rules:nChecked(),nrules:NRULES,sig:!!st.s[6].sig,sigAt:st.s[6].sigAt||'',room:room,complete:complete()};
  var js=JSON.stringify(data);L.push('');L.push('#DATEN '+js);L.push('#PRUEF '+fnv('SU-v1|'+js));return L.join('\n');}
function resultsHTML(){return '<div class="merk stack" id="resBox" style="border-color:var(--accent)"><h3 style="color:var(--ink)">Ergebnisse speichern</h3>'+
   '<p class="muted">Tippe auf <b>„Als Textdatei speichern“</b> (iPad: „Laden“ bestätigen). Lade die Datei danach bei <b>IServ</b> in der Aufgabe „Sicherheitsunterweisung“ hoch. Jede und jeder gibt eine eigene Datei ab.</p>'+
   '<div class="row"><button class="btn pri" type="button" id="resSave">Als Textdatei speichern</button><button class="btn sec" type="button" id="resCopy">Text kopieren</button><button class="btn tip" type="button" id="resShow">Text anzeigen</button></div>'+
   '<p class="fb" id="resFb"></p><textarea class="free" id="resTxt" rows="12" readonly hidden style="font-family:var(--f-mono);font-size:13px"></textarea>'+
   '<p class="muted"><b>So geht’s bei IServ:</b> Aufgaben → „Sicherheitsunterweisung“ öffnen → Datei hochladen → in <b>Dateien → Downloads</b> die gespeicherte Datei auswählen → Abgeben.</p>'+
   '<p class="muted"><b>Gerät weitergeben?</b> Erst speichern und hochladen, dann oben auf „Neu starten“ tippen.</p></div>';}
function bindResults(){
  function msg(ok,t){fb('resFb',ok,t);}
  function need(){if(!(st.res.name||'').trim()){msg(false,'Trage zuerst deinen Vor- und Nachnamen ein.');$('resName').focus();return false;}
    if(!complete())msg(false,'Achtung: Noch nicht vollständig (fehlt: '+missing().join(', ')+'). Die Datei wird trotzdem gespeichert.');return true;}
  $('resShow').addEventListener('click',function(){var t=$('resTxt');t.hidden=!t.hidden;if(!t.hidden)t.value=resText();this.textContent=t.hidden?'Text anzeigen':'Text ausblenden';});
  $('resCopy').addEventListener('click',function(){if(!need())return;var txt=resText(),t=$('resTxt');t.hidden=false;t.value=txt;$('resShow').textContent='Text ausblenden';
    function sel(){t.focus();t.select();msg(true,'Text markiert. Kopiere ihn mit Strg+C (Tablet: gedrückt halten → Kopieren).');}
    try{navigator.clipboard.writeText(txt).then(function(){msg(true,'Kopiert! Du kannst den Text jetzt bei IServ einfügen.');},sel);}catch(e){sel();}});
  $('resSave').addEventListener('click',function(){if(!need())return;var txt=resText(),name=resFile(),warn=!complete();
    function done(t){if(!warn)msg(true,t);}
    function blobSave(){try{var b=new Blob(['﻿'+txt],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},4000);
      done('Datei „'+name+'“ wird gespeichert. Falls nichts passiert: „Text kopieren“ benutzen.');}catch(e){msg(false,'Speichern klappt hier nicht. Benutze „Text kopieren“.');}}
    var c=window.claude;
    if(c&&c.use){c.use('downloads').then(function(d){if(!d){blobSave();return;}
        d.save({filename:name,data:txt}).then(function(){done('Gespeichert als „'+name+'“. Jetzt bei IServ hochladen!');},function(err){
          if(err&&err.code==='declined')msg(false,'Speichern abgebrochen. Du kannst es nochmal versuchen.');else msg(false,'Speichern klappt hier nicht. Benutze „Text kopieren“.');});},blobSave);}
    else blobSave();});}

/* ---------- Gesamt ---------- */
function pic(){var p=picFor(st.station);$('pic').innerHTML=p[0];$('cap').textContent=p[1];}
function render(){renderRoute();pic();[r0,r1,r2,r3,r4,r5,r6][st.station]();}
$('reset').addEventListener('click',function(){var b=this;if(!b._armed){b._armed=true;b.textContent='Wirklich alles löschen?';setTimeout(function(){b._armed=false;b.textContent='Neu starten';},3500);return;}
  try{localStorage.removeItem(KEY);}catch(e){}location.reload();});
load();if(!st.t0){st.t0=Date.now();save();}if(!unlocked(st.station))st.station=0;
render();
})();
</script>
